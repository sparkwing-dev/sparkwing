name: Canonical gates

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref whose source the canonical gates verify
        required: false
        type: string
        default: ""
      release_tag:
        description: Immutable release tag allowed for the isolated self-pin fixture update
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gate:
    name: Canonical / ${{ matrix.gate == 'gate' && 'gate-core' || matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.gate == 'pre-release' || startsWith(matrix.gate, 'race-store-')) && 130 || 80 }}
    strategy:
      fail-fast: false
      matrix:
        # perf: each race-store lane races one part of internal/store on its
        # own four-core runner, so pre-release leaves that step to them.
        # perf: pushes and pull requests verify only what changed (decision 96); the full suite,
        # pre-release and the store race run nightly, on dispatch and for releases.
        gate: ${{ (inputs.source_ref != '' || inputs.release_tag != '') && fromJSON('["gate", "pre-release"]') || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["gate", "race-touched", "pre-release", "race-store-1-of-3", "race-store-2-of-3", "race-store-3-of-3"]') || fromJSON('["gate", "race-touched"]')) }}
    env:
      GOWORK: "auto"
    services:
      postgres:
        image: ${{ matrix.gate == 'pre-release' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Prepare isolated controller key
        env:
          SPARKWING_HOME: ${{ runner.temp }}/sparkwing-home
          SPARKWING_SECRETS_KEY_FILE: ${{ runner.temp }}/sparkwing-home/secrets.key
        run: |
          umask 077
          mkdir -p "$SPARKWING_HOME"
          openssl rand 32 > "$SPARKWING_SECRETS_KEY_FILE"
          printf 'SPARKWING_HOME=%s\nSPARKWING_SECRETS_KEY_FILE=%s\n' "$SPARKWING_HOME" "$SPARKWING_SECRETS_KEY_FILE" >> "$GITHUB_ENV"

      - name: Checkout immutable release verifier
        if: inputs.release_tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Copy the immutable release verifier
        if: inputs.release_tag != ''
        run: |
          cp bin/check-hosted-gate-clean.sh "$RUNNER_TEMP/check-hosted-gate-clean.sh"
          cp bin/report-hosted-run-failure.sh "$RUNNER_TEMP/report-hosted-run-failure.sh"
          cp bin/export-hosted-run-timings.sh "$RUNNER_TEMP/export-hosted-run-timings.sh"

      - name: Copy the v0.37.2 test repair
        if: inputs.release_tag == 'v0.37.2'
        run: |
          cp bin/apply-release-test-repair.sh "$RUNNER_TEMP/apply-release-test-repair.sh"
          cp .github/release-recovery/v0.37.2-test-oracle.patch "$RUNNER_TEMP/v0.37.2-test-oracle.patch"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false

      # perf: setup-go keys its cache on go.sum alone, so every run hit that key
      # exactly and none saved; the build cache froze at its first save. A
      # per-commit key saved from main pushes keeps it current, and every other
      # run restores main's newest by prefix.
      - name: Restore the Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ hashFiles('go.sum', '.sparkwing/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ hashFiles('go.sum', '.sparkwing/go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-1.26.10-

      - name: Capture the immutable source commit
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >>"$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ !startsWith(matrix.gate, 'race-store-') }}
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !startsWith(matrix.gate, 'race-store-') }}
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install TypeScript SDK dependencies
        if: ${{ !startsWith(matrix.gate, 'race-store-') }}
        run: npm ci --ignore-scripts --prefix sdk/typescript

      - name: Install dashboard dependencies
        if: matrix.gate == 'gate'
        run: pnpm install --frozen-lockfile --ignore-scripts --dir web

      - name: Install golangci-lint
        if: ${{ !startsWith(matrix.gate, 'race-store-') }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-only: true
          skip-cache: true

      - name: Install Terraform
        if: matrix.gate == 'pre-release'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.4"
          terraform_wrapper: false

      - name: Verify hosted tools
        run: |
          set -euo pipefail
          case "${{ matrix.gate }}" in
            race-store-*) exit 0 ;;
          esac
          command -v golangci-lint
          if [ "${{ matrix.gate }}" = pre-release ]; then
            command -v shellcheck
            command -v terraform
          fi

      - name: Build the checked-out Sparkwing CLI
        run: go build -trimpath -o "$RUNNER_TEMP/sparkwing" ./cmd/sparkwing

      - name: Stage the event change
        if: matrix.gate == 'gate' || matrix.gate == 'race-touched'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          base="$PUSH_BEFORE_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="$PR_BASE_SHA"
          fi
          zero=0000000000000000000000000000000000000000
          if [ -z "$base" ] || [ "$base" = "$zero" ] || ! git cat-file -e "$base^{commit}"; then
            base="$(git rev-parse "$target_sha^")"
          fi
          git reset --soft "$base"
          test "$(git write-tree)" = "$(git rev-parse "$target_sha^{tree}")"
          git diff --quiet

      - name: Prepare the immutable release self-pin fixture
        if: matrix.gate == 'pre-release' && inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git tag --delete -- "$RELEASE_TAG"
          sdk_version="$(go mod edit -json | jq -r '.Require[] | select(.Path == "github.com/sparkwing-dev/sparkwing/sparkwing") | .Version')"
          [[ "$sdk_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          go -C .sparkwing mod edit -require=github.com/sparkwing-dev/sparkwing@"$RELEASE_TAG" -require=github.com/sparkwing-dev/sparkwing/sparkwing@"$sdk_version" -dropreplace=github.com/sparkwing-dev/sparkwing -dropreplace=github.com/sparkwing-dev/sparkwing/sparkwing
          go -C .sparkwing mod tidy
          git add -- .sparkwing/go.mod .sparkwing/go.sum
          go -C testdata/k8s-e2e/repo/.sparkwing mod edit -require=github.com/sparkwing-dev/sparkwing/sparkwing@"$sdk_version" -dropreplace=github.com/sparkwing-dev/sparkwing/sparkwing
          go -C testdata/k8s-e2e/repo/.sparkwing mod tidy
          sed -i "s/^const FallbackSDKVersion = \"[^\"]*\"$/const FallbackSDKVersion = \"$sdk_version\"/" pkg/scaffold/version.go
          grep -Fxq "const FallbackSDKVersion = \"$sdk_version\"" pkg/scaffold/version.go
          snapshot_dir="$(mktemp -d)"
          trap 'rm -rf "$snapshot_dir"' EXIT
          bash bin/regen-api-snapshot.sh "$snapshot_dir"
          cp "$snapshot_dir/pkg_scaffold.txt" .apidiff/pkg_scaffold.txt
          patch_oid="$(git diff HEAD --binary -- .apidiff/pkg_scaffold.txt .sparkwing/go.mod .sparkwing/go.sum pkg/scaffold/version.go testdata/k8s-e2e/repo/.sparkwing/go.mod testdata/k8s-e2e/repo/.sparkwing/go.sum | git hash-object --stdin)"
          echo "RELEASE_SELF_PIN_PATCH_OID=$patch_oid" >>"$GITHUB_ENV"

      - name: Apply the audited tagged-test repair
        if: inputs.release_tag == 'v0.37.2'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash "$RUNNER_TEMP/apply-release-test-repair.sh" "$RELEASE_TAG" "$SOURCE_SHA" "$RUNNER_TEMP/v0.37.2-test-oracle.patch"

      - name: Pin the change base for affected checks
        if: inputs.source_ref == '' && inputs.release_tag == '' && (github.event_name == 'push' || github.event_name == 'pull_request')
        env:
          CHANGE_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: |
          # safety: the gate scopes to the change since origin/main; on a push HEAD already is
          # origin/main, so point it at the commit before this push (or the PR base).
          if [ -n "$CHANGE_BASE" ] && [ "$CHANGE_BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$CHANGE_BASE^{commit}" 2>/dev/null; then
            git update-ref refs/remotes/origin/main "$CHANGE_BASE"
          else
            git update-ref -d refs/remotes/origin/main || true
          fi

      - name: Run canonical gate
        if: matrix.gate == 'gate'
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gate_selection=()
          gate_args=()
          if [ -z "$SOURCE_REF" ] && [ -z "$RELEASE_TAG" ]; then
            gate_selection=(--sw-only gate)
            if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              gate_args=(-- --full)
            fi
          fi
          "$RUNNER_TEMP/sparkwing" run gate "${gate_selection[@]}" --sw-run-handle-file "$RUNNER_TEMP/canonical-run.json" "${gate_args[@]}"
          if [ "$RELEASE_TAG" = v0.37.2 ]; then
            git apply --unidiff-zero --reverse --check "$RUNNER_TEMP/v0.37.2-test-oracle.patch"
            git apply --unidiff-zero --reverse "$RUNNER_TEMP/v0.37.2-test-oracle.patch"
            git diff --quiet
          fi

      - name: Run canonical touched-package race
        if: matrix.gate == 'race-touched'
        run: '"$RUNNER_TEMP/sparkwing" run gate --sw-only race-touched --sw-run-handle-file "$RUNNER_TEMP/canonical-run.json"'

      - name: Run canonical pre-release
        if: matrix.gate == 'pre-release'
        env:
          SPARKWING_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          race_store_part=()
          if [ -z "$SOURCE_REF" ] && [ -z "$RELEASE_TAG" ]; then
            race_store_part=(-- --race-store-part none)
          fi
          "$RUNNER_TEMP/sparkwing" run pre-release --sw-run-handle-file "$RUNNER_TEMP/canonical-run.json" "${race_store_part[@]}"
          if [ -n "$RELEASE_TAG" ]; then
            if [ "$RELEASE_TAG" = v0.37.2 ]; then
              git apply --unidiff-zero --reverse --check "$RUNNER_TEMP/v0.37.2-test-oracle.patch"
              git apply --unidiff-zero --reverse "$RUNNER_TEMP/v0.37.2-test-oracle.patch"
              git diff --quiet HEAD -- internal/orchestrator/repo_ident_test.go
            fi
            bash "$RUNNER_TEMP/check-hosted-gate-clean.sh" --release-self-pin "$RELEASE_TAG" "$RELEASE_SELF_PIN_PATCH_OID" "$target_sha"
          else
            bash bin/check-hosted-gate-clean.sh "$target_sha"
          fi

      - name: Run canonical store race part
        if: startsWith(matrix.gate, 'race-store-')
        env:
          LANE: ${{ matrix.gate }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          part="${LANE#race-store-}"
          part="${part/-of-//}"
          "$RUNNER_TEMP/sparkwing" run pre-release --sw-start-at race-store --sw-stop-at race-store --sw-run-handle-file "$RUNNER_TEMP/canonical-run.json" -- --race-store-part "$part"
          bash bin/check-hosted-gate-clean.sh "$target_sha"

      - name: Save the Go caches
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.gate == 'gate' && steps.go-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Export canonical run timings
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 1
        run: |
          exporter="bin/export-hosted-run-timings.sh"
          if [ -f "$RUNNER_TEMP/export-hosted-run-timings.sh" ]; then
            exporter="$RUNNER_TEMP/export-hosted-run-timings.sh"
          fi
          bash "$exporter" "$RUNNER_TEMP/canonical-run.json" "$RUNNER_TEMP/sparkwing" "$RUNNER_TEMP/canonical-timings.json"

      - name: Retain canonical run timings
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-timings-${{ matrix.gate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canonical-timings.json
          if-no-files-found: warn
          retention-days: 30

      - name: Print failed canonical run diagnostics
        if: ${{ failure() }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          reporter="bin/report-hosted-run-failure.sh"
          if [ -f "$RUNNER_TEMP/report-hosted-run-failure.sh" ]; then
            reporter="$RUNNER_TEMP/report-hosted-run-failure.sh"
          fi
          bash "$reporter" "$RUNNER_TEMP/canonical-run.json" "$RUNNER_TEMP/sparkwing" "$RUNNER_TEMP/canonical-run.log"

      - name: Retain failed canonical run log
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-run-log-${{ matrix.gate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canonical-run.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload dashboard browser failure artifacts
        if: ${{ failure() && matrix.gate == 'gate' && hashFiles('web/test-results/.sparkwing-browser-failed') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  required-gate:
    name: Canonical / gate
    if: ${{ always() }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every canonical result
        env:
          RESULT: ${{ needs.gate.result }}
        run: test "$RESULT" = success

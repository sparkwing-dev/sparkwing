
name: release
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild after a publication-only failure
        required: true
        type: string
      publish_images:
        description: Publish container images as part of the rebuild
        required: true
        default: true
        type: boolean
      force_retag:
        description: Move a published image tag that already points at a different digest
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

# A tag push builds and publishes. Health comes from the periodic jobs that run
# against main, not from re-running them on the tagged commit.
jobs:
  validate-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          fi
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          remote="https://github.com/${{ github.repository }}.git"
          lines="$(git ls-remote --exit-code --tags "$remote" "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          source_sha="$(printf '%s\n' "$lines" | awk -v peeled="refs/tags/$TAG^{}" '$2 == peeled { print $1 }')"
          if [ -z "$source_sha" ]; then
            source_sha="$(printf '%s\n' "$lines" | awk -v direct="refs/tags/$TAG" '$2 == direct { print $1 }')"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$source_sha" >>"$GITHUB_OUTPUT"

  dashboard:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate-tag.outputs.source_sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build dashboard once
        run: bash bin/build-web.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dashboard
          path: internal/web/next-out
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  build:
    needs: [validate-tag, dashboard]
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ${{ matrix.goos == 'darwin' && 'macos-latest' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate-tag.outputs.source_sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dashboard
          path: internal/web/next-out
      - name: Checkout publication tools
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-tools
      - name: Select publication tools
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "RELEASE_TOOLS=$GITHUB_WORKSPACE/.release-tools" >>"$GITHUB_ENV"
          else
            echo "RELEASE_TOOLS=$GITHUB_WORKSPACE" >>"$GITHUB_ENV"
          fi
      - name: Build target binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: bash "$RELEASE_TOOLS/bin/build-release-target.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Apply current image recipe
        if: matrix.goos == 'linux' && (github.event_name != 'workflow_dispatch' || inputs.publish_images) && github.event_name == 'workflow_dispatch'
        run: |
          cp .release-tools/.dockerignore .dockerignore
          cp .release-tools/build/Dockerfile.binary .release-tools/build/Dockerfile.runner .release-tools/build/runner-tools build/
          cp .release-tools/bin/build-release-images.sh .release-tools/bin/check-runner-image.sh bin/
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: matrix.goos == 'linux' && (github.event_name != 'workflow_dispatch' || inputs.publish_images)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: matrix.goos == 'linux' && (github.event_name != 'workflow_dispatch' || inputs.publish_images)
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: matrix.goos == 'linux' && (github.event_name != 'workflow_dispatch' || inputs.publish_images)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package release executables as images
        if: matrix.goos == 'linux' && (github.event_name != 'workflow_dispatch' || inputs.publish_images)
        env:
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SOURCE_SHA: ${{ needs.validate-tag.outputs.source_sha }}
          SPARKWING_IMAGE_REFRESH: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash bin/build-release-images.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.goos == 'linux' && (github.event_name != 'workflow_dispatch' || inputs.publish_images)
        with:
          name: image-platform-${{ matrix.goarch }}
          path: image-platform-digests/*
          retention-days: 1
          if-no-files-found: error

  typescript-native:
    needs: [validate-tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      NODE_VERSION: 22.18.0
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET_ARCH: ${{ matrix.arch }}
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate-tag.outputs.source_sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install SDK dependencies
        run: npm ci --ignore-scripts
      - name: Download matching Node headers and import library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "v$env:NODE_VERSION"
          $base = "https://nodejs.org/dist/$version"
          $directory = Join-Path $env:RUNNER_TEMP 'node-sdk'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $sums = (Invoke-WebRequest "$base/SHASUMS256.txt").Content
          foreach ($asset in @("node-$version-headers.tar.gz", "win-$env:TARGET_ARCH/node.lib")) {
            $matches = @($sums -split "`n" | Where-Object { ($_ -split '\s+')[-1].Trim() -eq $asset })
            if ($matches.Count -ne 1) { throw "Missing unique checksum for $asset" }
            $expected = ($matches[0] -split '\s+')[0]
            $output = Join-Path $directory (Split-Path $asset -Leaf)
            Invoke-WebRequest "$base/$asset" -OutFile $output
            if ((Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
              throw "Checksum mismatch for $asset"
            }
          }
          tar -xzf "$directory/node-$version-headers.tar.gz" -C $directory
          if ($LASTEXITCODE -ne 0) { throw 'Node header extraction failed' }
      - name: Verify Windows bridge
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=%TARGET_ARCH% -host_arch=%TARGET_ARCH%
          if errorlevel 1 exit /b 1
          npm run release:native -- --version "%TAG%" --arch "%TARGET_ARCH%" --headers "%RUNNER_TEMP%\node-sdk\node-v%NODE_VERSION%\include\node" --node-lib "%RUNNER_TEMP%\node-sdk\node.lib"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typescript-win32-${{ matrix.arch }}
          path: sdk/typescript/native/win32-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  typescript-package:
    needs: [validate-tag, typescript-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate-tag.outputs.source_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: typescript-win32-x64
          path: sdk/typescript/native/win32-x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: typescript-win32-arm64
          path: sdk/typescript/native/win32-arm64
      - name: Assemble TypeScript package
        working-directory: sdk/typescript
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          mkdir -p "$GITHUB_WORKSPACE/typescript-dist"
          npm run release:pack -- --version "$TAG" --destination "$GITHUB_WORKSPACE/typescript-dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-typescript
          path: typescript-dist/*.tgz
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [validate-tag, build, typescript-package]
    runs-on: ubuntu-latest
    concurrency:
      group: release-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate-tag.outputs.source_sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum
      - name: Checkout publication tools
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-tools
      - name: Select publication tools
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "RELEASE_TOOLS=$GITHUB_WORKSPACE/.release-tools" >>"$GITHUB_ENV"
          else
            echo "RELEASE_TOOLS=$GITHUB_WORKSPACE" >>"$GITHUB_ENV"
          fi
      - name: Download all binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-typescript
          path: typescript-dist
      - name: Check npm publication credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NODE_AUTH_TOKEN"
      - name: Ad-hoc-sign macOS binaries (rcodesign)
        working-directory: dist
        run: |
          set -euo pipefail
          RCODESIGN_VERSION=0.27.0
          # SHA256 of the pinned tarball. This signer runs against the
          # darwin binaries BEFORE SHA256SUMS is computed, so a tampered
          # signer would produce bytes that carry a valid fleet ed25519
          # signature -- verify the tarball before trusting it. To bump the
          # version: download the new asset, `sha256sum` it, and paste the
          # digest here alongside the new RCODESIGN_VERSION.
          RCODESIGN_SHA256=a0e0c548b313026abf4f40a6e06554d352c6f4e1add6a87d626c94134a4ee564
          url="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fSL "$url" -o rcodesign.tar.gz
          echo "${RCODESIGN_SHA256}  rcodesign.tar.gz" | sha256sum -c -
          tar xzf rcodesign.tar.gz
          rc="$(find . -type f -name rcodesign | head -1)"
          chmod +x "$rc"
          for f in *-darwin-*; do
            echo "==> ad-hoc signing $f"
            "$rc" sign "$f"
          done
          rm -rf rcodesign.tar.gz apple-codesign-*

      - name: Select Latest from published versions
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          eligible="$(GOWORK=off go -C "$RELEASE_TOOLS" run ./cmd/verify-release --latest-tag "$TAG")"
          echo "eligible=$eligible" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images
        with:
          pattern: image-platform-*
          path: image-platform-digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images

      - name: Assemble multi-architecture image digests
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images
        run: bash "$RELEASE_TOOLS/bin/assemble-image-digests.sh"
      - name: Sign image digests
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          binaries=(
            sparkwing-controller
            sparkwing-runner
          )
          for binary in "${binaries[@]}"; do
            digest="$(tr -d '\r\n' <"scanned-image-digests/$binary")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            cosign sign --yes "ghcr.io/sparkwing-dev/${binary}@${digest}"
          done

      - name: Publish image tags
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          LATEST: ${{ steps.latest.outputs.eligible }}
          FORCE_RETAG: ${{ inputs.force_retag || false }}
        run: bash "$RELEASE_TOOLS/bin/publish-image-tags.sh"

      - name: Stage published image manifest
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images
        run: cp image-digests/image-digests.json dist/
      - name: Compute SHA256SUMS
        working-directory: dist
        run: |
          sha256sum sparkwing-* > SHA256SUMS
          ls -la

      # sparkwing.dev serves this script, so it ships as a signed asset of the
      # tag it was built from and the site can check what it publishes.
      - name: Stage the public installer
        run: cp install/install.sh dist/install.sh

      - name: Sign release assets
        env:
          SPARKWING_RELEASE_SIGNING_KEY: ${{ secrets.SPARKWING_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          GOWORK=off go -C "$RELEASE_TOOLS" run ./cmd/verify-release --dist "$GITHUB_WORKSPACE/dist"
          GOWORK=off go -C "$RELEASE_TOOLS" run ./cmd/verify-release --dist "$GITHUB_WORKSPACE/dist" --verify
          test -f dist/SHA256SUMS.sig
          test -f dist/install.sh.sig
          ls dist/sparkwing-*.sig >/dev/null

      # The changelog section is the release notes when the tag has one. A tag
      # cut by hand from any commit may not, so the annotated message and then a
      # pointer at CHANGELOG.md stand in rather than failing the release.
      - name: Assemble release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! bash bin/extract-changelog-section.sh "$TAG" CHANGELOG.md >release-notes.md 2>/dev/null; then
            : >release-notes.md
            git fetch --quiet --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
            if [ "$(git cat-file -t "refs/tags/$TAG" 2>/dev/null || echo none)" = tag ]; then
              git tag -l --format='%(contents)' "$TAG" >release-notes.md
            fi
          fi
          if [ ! -s release-notes.md ]; then
            printf 'Release %s. See CHANGELOG.md for what changed.\n' "$TAG" >release-notes.md
          fi
          echo "==> release notes:"
          cat release-notes.md

      - name: Publish TypeScript package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          LATEST: ${{ steps.latest.outputs.eligible }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          packages=(typescript-dist/*.tgz)
          test "${#packages[@]}" -eq 1
          npm_tag="release-${TAG#v}"
          if [ "$LATEST" = true ]; then npm_tag=latest; fi
          if [[ "$TAG" = *-* ]]; then npm_tag=next; fi
          node "$RELEASE_TOOLS/bin/publish-typescript.mjs" "${packages[0]}" "${TAG#v}" "$npm_tag"

      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          LATEST: ${{ steps.latest.outputs.eligible }}
        run: |
          set -euo pipefail
          tag="$TAG"
          # A published tag and its signed assets are immutable. Build
          # the complete set privately, then publish once.
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "release $tag is published; immutable publication refuses mutation" >&2
              exit 1
            fi
            gh release delete "$tag" --yes
          fi
          draft_created=false
          cleanup_draft() {
            if [ "$draft_created" = true ]; then
              state="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
              if [ "$state" = true ]; then
                gh release delete "$tag" --yes || true
              fi
            fi
          }
          trap cleanup_draft EXIT
          gh release create "$tag" \
            --draft \
            --verify-tag \
            --latest=false \
            --title "sparkwing CLI $tag" \
            --notes-file release-notes.md
          draft_created=true
          gh release upload "$tag" dist/*
          asset_count="$(gh release view "$tag" --json assets --jq '.assets | length')"
          test "$asset_count" -eq "$(find dist -type f | wc -l | tr -d ' ')"
          gh release edit "$tag" --draft=false --latest="$LATEST"
          draft_created=false
          gh release view "$tag"

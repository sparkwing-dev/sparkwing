# Cross-compile + upload sparkwing binaries to GH Releases on every
# tag push.
#
# Trigger: any tag matching v*. Release notes are auto-generated from
# PR titles since the previous tag.
#
# To cut a release: push a v*-prefixed tag (e.g. via `sparkwing run
# release --version vX.Y.Z`). This workflow takes it from there.
#
# Shape: matrix-parallel build (one runner per binary × platform),
# followed by a single release job that downloads every artifact and
# pushes the bundle to GH Releases. Cuts wall-clock from ~8 min
# sequential to ~1-2 min parallel; trades runner-minutes for latency.
#
# Per-binary platform constraints:
#   - sparkwing -- the user-facing CLI; 6 platforms (linux/darwin/
#     windows × amd64/arm64). It also bundles the local dashboard
#     server, so `sparkwing dashboard start` is the supported way to
#     run a long-lived local UI -- there is no separately-released
#     daemon binary anymore.
#   - sparkwing-cache, controller, runner, logs, web -- server-side
#     components meant for Linux containers. linux + darwin (for local
#     dev) only; windows is excluded because (a) nobody runs these on
#     a Windows host, and (b) sparkwing-cache uses POSIX-only Setpgid
#     + syscall.Kill so it won't compile there anyway.

name: release
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required: gh release create + upload
  packages: write # required: GHCR push (build-images job)
  id-token: write # required: cosign keyless OIDC (build-images job)

jobs:
  build:
    # fail-fast: false so a cell failure doesn't cancel siblings and
    # leave the release half-built. The release job's `needs: build`
    # gate then refuses to run on partial results, so the user sees a
    # clean "build failed; release not created" outcome rather than a
    # release with missing assets.
    strategy:
      fail-fast: false
      matrix:
        binary:
          - sparkwing
          - sparkwing-cache
          - sparkwing-controller
          - sparkwing-runner
          - sparkwing-logs
          - sparkwing-web
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - { binary: sparkwing-cache, goos: windows }
          - { binary: sparkwing-controller, goos: windows }
          - { binary: sparkwing-runner, goos: windows }
          - { binary: sparkwing-logs, goos: windows }
          - { binary: sparkwing-web, goos: windows }
    runs-on: ${{ matrix.goos == 'darwin' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      # Pin the checkout to the tag's exact commit. Every job in this
      # workflow checks out the same github.sha, so a version string
      # implies one identical tree across all assets and matches what
      # `go install ...@tag` compiles -- no provenance drift.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      # actions/setup-go@v5 caches ~/go/pkg/mod (module deps); this
      # cache covers ~/.cache/go-build (compiled object files for
      # stdlib + dep packages, target-specific). Key includes goos +
      # goarch since cross-compiled object files don't share, and
      # all .go files so any source change invalidates fully. Cells
      # with the same (goos, goarch) but different binary share the
      # cache because the cached entries are binary-agnostic.
      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum', '**/*.go') }}
          restore-keys: |
            gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-

      # The dashboard SPA is embedded via //go:embed all:next-out by
      # both sparkwing (for `sparkwing dashboard start`) and
      # sparkwing-web (the cluster pod). Other binaries skip this.
      - name: Setup Node (binaries that embed the dashboard)
        if: matrix.binary == 'sparkwing' || matrix.binary == 'sparkwing-web'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Audit production dashboard dependencies
        if: matrix.binary == 'sparkwing' || matrix.binary == 'sparkwing-web'
        run: npm --prefix web audit --omit=dev --audit-level=high

      - name: Build dashboard + populate next-out
        if: matrix.binary == 'sparkwing' || matrix.binary == 'sparkwing-web'
        run: bash bin/build-web.sh

      - name: Build ${{ matrix.binary }} for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          BIN: ${{ matrix.binary }}
          # GitHub injects ${{ github.ref_name }} as the tag name;
          # keep it in an env so the run script reads it as a normal
          # bash var rather than YAML interpolation in a heredoc.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          out="dist/${BIN}-${GOOS}-${GOARCH}${ext}"
          echo "==> $out"
          go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=${TAG}" \
            -o "$out" "./cmd/${BIN}"
          if [ "$GOOS" = "darwin" ]; then
            codesign --force --sign - "$out"
          fi
          ls -la "$out"

      - name: Scan exact release binary
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
          BIN: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          ext=""
          [ "$TARGET_GOOS" = "windows" ] && ext=".exe"
          bash bin/check-release-binary-vulnerabilities.sh \
            "dist/${BIN}-${TARGET_GOOS}-${TARGET_GOARCH}${ext}"

      # Each cell uploads exactly one binary as a uniquely-named
      # artifact. The release job re-downloads all of them with
      # merge-multiple so they land in a single dist/ for sha256sum +
      # upload. retention-days: 1 because these are immediately
      # consumed by the release job; no value in keeping them after.
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.binary }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.binary }}-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 1
          if-no-files-found: error

  prepare-binaries:
    name: Assemble & scan release binaries
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The scanner script and Go vulnerability tooling come from the exact
      # tagged commit whose matrix artifacts are assembled below.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      # merge-multiple: true flattens every artifact into one dist/
      # without per-artifact subdirectories, so sha256sum + the upload
      # glob below pick up all files in one shot.
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      # Ad-hoc-sign the macOS Mach-O assets BEFORE SHA256SUMS is
      # computed, so the published+hashed bytes are already
      # Gatekeeper-valid and `sparkwing update` installs them UNCHANGED
      # (the client no longer codesigns after verification -- doing so
      # would mutate the verified bytes). rcodesign is a pure-Rust,
      # cross-platform Apple code-signer, so this runs on the Linux
      # runner with no macOS host. Version pinned; the released binary is
      # fetched rather than built to keep the step fast.
      - name: Ad-hoc-sign macOS binaries (rcodesign)
        working-directory: dist
        run: |
          set -euo pipefail
          RCODESIGN_VERSION=0.27.0
          # SHA256 of the pinned tarball. This signer runs against the
          # darwin binaries BEFORE SHA256SUMS is computed, so a tampered
          # signer would produce bytes that carry a valid fleet ed25519
          # signature -- verify the tarball before trusting it. To bump the
          # version: download the new asset, `sha256sum` it, and paste the
          # digest here alongside the new RCODESIGN_VERSION.
          RCODESIGN_SHA256=a0e0c548b313026abf4f40a6e06554d352c6f4e1add6a87d626c94134a4ee564
          url="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fSL "$url" -o rcodesign.tar.gz
          echo "${RCODESIGN_SHA256}  rcodesign.tar.gz" | sha256sum -c -
          tar xzf rcodesign.tar.gz
          rc="$(find . -type f -name rcodesign | head -1)"
          chmod +x "$rc"
          for f in *-darwin-*; do
            echo "==> ad-hoc signing $f"
            "$rc" sign "$f"
          done
          rm -rf rcodesign.tar.gz apple-codesign-*

      - name: Scan assembled release binaries
        run: bash bin/check-release-binary-vulnerabilities.sh dist/sparkwing-*

      - name: Upload scanned release binaries
        uses: actions/upload-artifact@v4
        with:
          name: scanned-release-binaries
          path: dist/sparkwing-*
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [prepare-binaries, publish-images]
    runs-on: ubuntu-latest
    steps:
      # Checkout supplies the tagged changelog, verification code, and schema
      # reference. The binaries themselves come only from prepare-binaries.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Download scanned release binaries
        uses: actions/download-artifact@v4
        with:
          name: scanned-release-binaries
          path: dist

      - name: Compute SHA256SUMS
        # Operators verifying via install.sh (or any third party) can
        # diff against this; the contents are fully reproducible from
        # the GitHub-Actions-built binaries. Computed AFTER the macOS
        # ad-hoc signing above so the digests match the shipped bytes.
        working-directory: dist
        run: |
          sha256sum sparkwing-* > SHA256SUMS
          ls -la

      - name: Sign and verify immutable release assets
        env:
          SPARKWING_RELEASE_SIGNING_KEY: ${{ secrets.SPARKWING_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          go run ./cmd/verify-release --dist dist
          go run ./cmd/verify-release --dist dist --verify
          test -f dist/SHA256SUMS.sig
          ls dist/sparkwing-*.sig >/dev/null

      - name: Verify release asset schema parity
        # Pre-publish gate: the uploaded linux/amd64 binary must embed
        # the same runs-store schema that the tagged source compiles.
        # The reference is built fresh from the checked-out tag tree, so
        # a mismatch means an asset was built from a different commit
        # than the tag -- exactly the schema-skew failure mode. Fails
        # the release before any asset reaches the public page.
        # linux/amd64 is the one asset the runner can execute; every
        # asset builds from the same pinned github.sha, and the schema
        # constant is platform-independent, so this one is representative.
        run: |
          set -euo pipefail
          chmod +x dist/sparkwing-linux-amd64
          bash bin/check-release-schema-parity.sh \
            --asset dist/sparkwing-linux-amd64 \
            --repo .

      - name: Extract CHANGELOG section for this tag
        # The CHANGELOG entry for [vX.Y.Z] is the curated migration
        # narrative. Use it verbatim as the release body so adopters
        # see the migration tables, not the dev-facing commit log
        # (which includes things like "regen apidiff" / "lint sweep"
        # that aren't user-visible). Fails the workflow if the
        # section is missing -- catches a missed [Unreleased] -> [v*]
        # rename before adopters ever see an empty release page.
        run: |
          set -euo pipefail
          bash bin/extract-changelog-section.sh "${GITHUB_REF_NAME}" CHANGELOG.md > release-notes.md
          echo "==> release notes:"
          cat release-notes.md

      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # A published tag and its signed assets are immutable. Build
          # the complete set privately, verify it, then publish once.
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "release $tag is published; immutable publication refuses mutation" >&2
              exit 1
            fi
            gh release delete "$tag" --yes
          fi
          draft_created=false
          cleanup_draft() {
            if [ "$draft_created" = true ]; then
              state="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
              if [ "$state" = true ]; then
                gh release delete "$tag" --yes || true
              fi
            fi
          }
          trap cleanup_draft EXIT
          gh release create "$tag" \
            --draft \
            --verify-tag \
            --latest=false \
            --title "sparkwing CLI $tag" \
            --notes-file release-notes.md
          draft_created=true
          gh release upload "$tag" dist/*
          asset_count="$(gh release view "$tag" --json assets --jq '.assets | length')"
          test "$asset_count" -eq "$(find dist -type f | wc -l | tr -d ' ')"
          gh release edit "$tag" --draft=false
          draft_created=false
          gh release view "$tag"

  # Build and scan multi-arch container images for the cluster-side
  # binaries on every v* tag push. Each matrix cell stages one untagged
  # digest in GHCR; no version or latest tag is published until every
  # image and architecture is clean.
  #
  # Five images fan out one runner per binary. The runner uses
  # Dockerfile.runner because its runtime needs the Go toolchain and
  # netrc-seeding entrypoint; the other four share Dockerfile.binary.
  # Each cell pushes an untagged digest and scans both architectures.
  # publish-images waits for the complete matrix before signing or tagging.
  #
  # Cosign signs keylessly via GitHub OIDC (id-token: write at the
  # workflow level). No KMS key, no secret -- the signature commits
  # the workflow + repo + tag triple as the signing identity, which
  # `cosign verify --certificate-identity-regexp ...` can attest.
  build-images:
    name: Build & scan container images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        binary:
          - sparkwing-controller
          - sparkwing-runner
          - sparkwing-cache
          - sparkwing-logs
          - sparkwing-web
    steps:
      # Pinned to the tag's exact commit, matching the binary build
      # job so images and binaries ship from one identical tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Setup Node (dashboard image)
        if: matrix.binary == 'sparkwing-web'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Audit production dashboard dependencies for image
        if: matrix.binary == 'sparkwing-web'
        run: npm --prefix web audit --omit=dev --audit-level=high

      - name: Build dashboard for image
        if: matrix.binary == 'sparkwing-web'
        run: bash bin/build-web.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate vulnerability waiver policy
        run: GOWORK=off go run ./bin/check-vulnerability-waivers.go .trivyignore.yaml

      # metadata-action emits the full tag list:
      #   - type=ref,event=tag       -> ghcr.io/.../<bin>:v1.2.3
      #   - type=raw,value=latest    -> ghcr.io/.../<bin>:latest
      # `:latest` is gated on the tag NOT containing a hyphen so
      # pre-release tags (v1.2.3-rc.1) don't clobber the stable
      # rolling pointer.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sparkwing-dev/${{ matrix.binary }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.binary == 'sparkwing-runner' && 'build/Dockerfile.runner' || 'build/Dockerfile.binary' }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/sparkwing-dev/${{ matrix.binary }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BINARY=${{ matrix.binary }}
            SPARKWING_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.binary }}
          cache-to: type=gha,mode=max,scope=${{ matrix.binary }}

      - name: Scan image digest (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/sparkwing-dev/${{ matrix.binary }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image digest (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/sparkwing-dev/${{ matrix.binary }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true
        env:
          TRIVY_PLATFORM: linux/arm64
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Export scanned image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          mkdir -p scanned-image-digests
          printf '%s\n' "$DIGEST" >"scanned-image-digests/$BINARY"

      - name: Upload scanned image digest
        uses: actions/upload-artifact@v4
        with:
          name: scanned-image-${{ matrix.binary }}
          path: scanned-image-digests/${{ matrix.binary }}
          retention-days: 1
          if-no-files-found: error

  publish-images:
    name: Publish scanned container images
    needs: [build-images, prepare-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: scanned-image-*
          path: scanned-image-digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      # Sign every approved digest before exposing any version tag. A signing
      # failure therefore leaves only the untagged staging digests behind.
      - name: Sign scanned image digests
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          binaries=(
            sparkwing-controller
            sparkwing-runner
            sparkwing-cache
            sparkwing-logs
            sparkwing-web
          )
          for binary in "${binaries[@]}"; do
            digest="$(tr -d '\r\n' <"scanned-image-digests/$binary")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            cosign sign --yes "ghcr.io/sparkwing-dev/${binary}@${digest}"
          done

      - name: Publish scanned image tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          binaries=(
            sparkwing-controller
            sparkwing-runner
            sparkwing-cache
            sparkwing-logs
            sparkwing-web
          )
          for binary in "${binaries[@]}"; do
            digest="$(tr -d '\r\n' <"scanned-image-digests/$binary")"
            image="ghcr.io/sparkwing-dev/${binary}"
            tag_args=(--tag "${image}:${TAG}")
            if [[ "$TAG" != *-* ]]; then
              tag_args+=(--tag "${image}:latest")
            fi
            docker buildx imagetools create \
              "${tag_args[@]}" \
              "${image}@${digest}"
          done

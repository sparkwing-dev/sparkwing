
name: release
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild after a publication-only failure
        required: true
        type: string
      publish_images:
        description: Publish container images as part of the rebuild
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  validate-tag:
    name: Validate immutable release tag
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          remote="https://github.com/${{ github.repository }}.git"
          lines="$(git ls-remote --exit-code --tags "$remote" "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          source_sha="$(printf '%s\n' "$lines" | awk -v peeled="refs/tags/$TAG^{}" '$2 == peeled { print $1 }')"
          if [ -z "$source_sha" ]; then
            source_sha="$(printf '%s\n' "$lines" | awk -v direct="refs/tags/$TAG" '$2 == direct { print $1 }')"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$source_sha" >>"$GITHUB_OUTPUT"

  canonical:
    name: Verify tagged source
    needs: validate-tag
    uses: ./.github/workflows/canonical-gates.yaml
    with:
      source_ref: ${{ needs.validate-tag.outputs.source_sha }}
      release_tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read

  build:
    needs: [validate-tag, canonical]
    if: ${{ always() && needs.validate-tag.result == 'success' && needs.canonical.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        binary:
          - sparkwing
          - sparkwing-cache
          - sparkwing-controller
          - sparkwing-runner
          - sparkwing-logs
          - sparkwing-web
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - { binary: sparkwing-cache, goos: windows }
          - { binary: sparkwing-controller, goos: windows }
          - { binary: sparkwing-runner, goos: windows }
          - { binary: sparkwing-logs, goos: windows }
          - { binary: sparkwing-web, goos: windows }
    runs-on: ${{ matrix.goos == 'darwin' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate-tag.outputs.source_sha }}

      - name: Checkout current release scanner
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-tools

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum', '**/*.go') }}
          restore-keys: |
            gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-

      - name: Setup Node (binaries that embed the dashboard)
        if: matrix.binary == 'sparkwing' || matrix.binary == 'sparkwing-web'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Audit production dashboard dependencies
        if: matrix.binary == 'sparkwing' || matrix.binary == 'sparkwing-web'
        run: npm --prefix web audit --omit=dev --audit-level=high

      - name: Build dashboard + populate next-out
        if: matrix.binary == 'sparkwing' || matrix.binary == 'sparkwing-web'
        run: bash bin/build-web.sh

      - name: Build ${{ matrix.binary }} for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          BIN: ${{ matrix.binary }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          out="dist/${BIN}-${GOOS}-${GOARCH}${ext}"
          echo "==> $out"
          go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=${TAG}" \
            -o "$out" "./cmd/${BIN}"
          if [ "$GOOS" = "darwin" ]; then
            codesign --force --sign - "$out"
          fi
          ls -la "$out"

      - name: Scan exact release binary
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
          BIN: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          ext=""
          [ "$TARGET_GOOS" = "windows" ] && ext=".exe"
          bash "${{ github.event_name == 'workflow_dispatch' && '.release-tools/bin/check-release-binary-vulnerabilities.sh' || 'bin/check-release-binary-vulnerabilities.sh' }}" \
            "dist/${BIN}-${TARGET_GOOS}-${TARGET_GOARCH}${ext}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.binary }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.binary }}-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 1
          if-no-files-found: error

  prepare-binaries:
    name: Assemble & scan release binaries
    needs: [validate-tag, build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}

      - name: Checkout current release scanner
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-tools

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      - name: Ad-hoc-sign macOS binaries (rcodesign)
        working-directory: dist
        run: |
          set -euo pipefail
          RCODESIGN_VERSION=0.27.0
          # SHA256 of the pinned tarball. This signer runs against the
          # darwin binaries BEFORE SHA256SUMS is computed, so a tampered
          # signer would produce bytes that carry a valid fleet ed25519
          # signature -- verify the tarball before trusting it. To bump the
          # version: download the new asset, `sha256sum` it, and paste the
          # digest here alongside the new RCODESIGN_VERSION.
          RCODESIGN_SHA256=a0e0c548b313026abf4f40a6e06554d352c6f4e1add6a87d626c94134a4ee564
          url="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fSL "$url" -o rcodesign.tar.gz
          echo "${RCODESIGN_SHA256}  rcodesign.tar.gz" | sha256sum -c -
          tar xzf rcodesign.tar.gz
          rc="$(find . -type f -name rcodesign | head -1)"
          chmod +x "$rc"
          for f in *-darwin-*; do
            echo "==> ad-hoc signing $f"
            "$rc" sign "$f"
          done
          rm -rf rcodesign.tar.gz apple-codesign-*

      - name: Scan assembled release binaries
        run: bash "${{ github.event_name == 'workflow_dispatch' && '.release-tools/bin/check-release-binary-vulnerabilities.sh' || 'bin/check-release-binary-vulnerabilities.sh' }}" dist/sparkwing-*

      - name: Upload scanned release binaries
        uses: actions/upload-artifact@v4
        with:
          name: scanned-release-binaries
          path: dist/sparkwing-*
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [validate-tag, prepare-binaries, publish-images]
    if: ${{ always() && needs.prepare-binaries.result == 'success' && (needs.publish-images.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.publish_images == false && needs.publish-images.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate-tag.outputs.source_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum

      - name: Download scanned release binaries
        uses: actions/download-artifact@v4
        with:
          name: scanned-release-binaries
          path: dist

      - name: Compute SHA256SUMS
        working-directory: dist
        run: |
          sha256sum sparkwing-* > SHA256SUMS
          ls -la

      - name: Sign and verify immutable release assets
        env:
          SPARKWING_RELEASE_SIGNING_KEY: ${{ secrets.SPARKWING_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          go run ./cmd/verify-release --dist dist
          go run ./cmd/verify-release --dist dist --verify
          test -f dist/SHA256SUMS.sig
          ls dist/sparkwing-*.sig >/dev/null

      - name: Verify release asset schema parity
        run: |
          set -euo pipefail
          chmod +x dist/sparkwing-linux-amd64
          bash bin/check-release-schema-parity.sh \
            --asset dist/sparkwing-linux-amd64 \
            --repo .

      - name: Extract CHANGELOG section for this tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          bash bin/extract-changelog-section.sh "$TAG" CHANGELOG.md > release-notes.md
          echo "==> release notes:"
          cat release-notes.md

      - name: Verify release tag remains pinned
        env:
          EXPECTED_SHA: ${{ needs.validate-tag.outputs.source_sha }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          remote="https://github.com/${{ github.repository }}.git"
          lines="$(git ls-remote --exit-code --tags "$remote" "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          actual_sha="$(printf '%s\n' "$lines" | awk -v peeled="refs/tags/$TAG^{}" '$2 == peeled { print $1 }')"
          if [ -z "$actual_sha" ]; then
            actual_sha="$(printf '%s\n' "$lines" | awk -v direct="refs/tags/$TAG" '$2 == direct { print $1 }')"
          fi
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          # A published tag and its signed assets are immutable. Build
          # the complete set privately, verify it, then publish once.
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "release $tag is published; immutable publication refuses mutation" >&2
              exit 1
            fi
            gh release delete "$tag" --yes
          fi
          draft_created=false
          cleanup_draft() {
            if [ "$draft_created" = true ]; then
              state="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
              if [ "$state" = true ]; then
                gh release delete "$tag" --yes || true
              fi
            fi
          }
          trap cleanup_draft EXIT
          gh release create "$tag" \
            --draft \
            --verify-tag \
            --latest=false \
            --title "sparkwing CLI $tag" \
            --notes-file release-notes.md
          draft_created=true
          gh release upload "$tag" dist/*
          asset_count="$(gh release view "$tag" --json assets --jq '.assets | length')"
          test "$asset_count" -eq "$(find dist -type f | wc -l | tr -d ' ')"
          remote="https://github.com/${{ github.repository }}.git"
          lines="$(git ls-remote --exit-code --tags "$remote" "refs/tags/$tag" "refs/tags/$tag^{}")"
          actual_sha="$(printf '%s\n' "$lines" | awk -v peeled="refs/tags/$tag^{}" '$2 == peeled { print $1 }')"
          if [ -z "$actual_sha" ]; then
            actual_sha="$(printf '%s\n' "$lines" | awk -v direct="refs/tags/$tag" '$2 == direct { print $1 }')"
          fi
          test "$actual_sha" = "${{ needs.validate-tag.outputs.source_sha }}"
          gh release edit "$tag" --draft=false
          draft_created=false
          gh release view "$tag"

  build-images:
    name: Build & scan container images
    needs: [validate-tag, canonical]
    if: ${{ always() && needs.validate-tag.result == 'success' && needs.canonical.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish_images) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        binary:
          - sparkwing-controller
          - sparkwing-runner
          - sparkwing-cache
          - sparkwing-logs
          - sparkwing-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate-tag.outputs.source_sha }}

      - name: Checkout current image recipe
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-tools

      - name: Apply current image recipe
        if: github.event_name == 'workflow_dispatch'
        run: cp .release-tools/.dockerignore .dockerignore && cp .release-tools/build/Dockerfile.binary .release-tools/build/Dockerfile.runner build/

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum

      - name: Setup Node (dashboard image)
        if: matrix.binary == 'sparkwing-web'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Audit production dashboard dependencies for image
        if: matrix.binary == 'sparkwing-web'
        run: npm --prefix web audit --omit=dev --audit-level=high

      - name: Build dashboard for image
        if: matrix.binary == 'sparkwing-web'
        run: bash bin/build-web.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate vulnerability waiver policy
        run: GOWORK=off go run ./bin/check-vulnerability-waivers.go .trivyignore.yaml

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sparkwing-dev/${{ matrix.binary }}
          tags: |
            type=raw,value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.binary == 'sparkwing-runner' && 'build/Dockerfile.runner' || 'build/Dockerfile.binary' }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/sparkwing-dev/${{ matrix.binary }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BINARY=${{ matrix.binary }}
            SPARKWING_VERSION=${{ inputs.tag || github.ref_name }}
            SPARKWING_IMAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ matrix.binary }}
          cache-to: type=gha,mode=max,scope=${{ matrix.binary }}

      - name: Scan image digest (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/sparkwing-dev/${{ matrix.binary }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image digest (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/sparkwing-dev/${{ matrix.binary }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true
        env:
          TRIVY_PLATFORM: linux/arm64
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Export scanned image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          mkdir -p scanned-image-digests
          printf '%s\n' "$DIGEST" >"scanned-image-digests/$BINARY"

      - name: Upload scanned image digest
        uses: actions/upload-artifact@v4
        with:
          name: scanned-image-${{ matrix.binary }}
          path: scanned-image-digests/${{ matrix.binary }}
          retention-days: 1
          if-no-files-found: error

  publish-images:
    name: Publish scanned container images
    needs: [validate-tag, build-images, prepare-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: scanned-image-*
          path: scanned-image-digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Verify release tag before signing images
        env:
          EXPECTED_SHA: ${{ needs.validate-tag.outputs.source_sha }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          remote="https://github.com/${{ github.repository }}.git"
          lines="$(git ls-remote --exit-code --tags "$remote" "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          actual_sha="$(printf '%s\n' "$lines" | awk -v peeled="refs/tags/$TAG^{}" '$2 == peeled { print $1 }')"
          if [ -z "$actual_sha" ]; then
            actual_sha="$(printf '%s\n' "$lines" | awk -v direct="refs/tags/$TAG" '$2 == direct { print $1 }')"
          fi
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Sign scanned image digests
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          binaries=(
            sparkwing-controller
            sparkwing-runner
            sparkwing-cache
            sparkwing-logs
            sparkwing-web
          )
          for binary in "${binaries[@]}"; do
            digest="$(tr -d '\r\n' <"scanned-image-digests/$binary")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            cosign sign --yes "ghcr.io/sparkwing-dev/${binary}@${digest}"
          done

      - name: Publish scanned image tags
        env:
          EXPECTED_SHA: ${{ needs.validate-tag.outputs.source_sha }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          remote="https://github.com/${{ github.repository }}.git"
          lines="$(git ls-remote --exit-code --tags "$remote" "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          actual_sha="$(printf '%s\n' "$lines" | awk -v peeled="refs/tags/$TAG^{}" '$2 == peeled { print $1 }')"
          if [ -z "$actual_sha" ]; then
            actual_sha="$(printf '%s\n' "$lines" | awk -v direct="refs/tags/$TAG" '$2 == direct { print $1 }')"
          fi
          test "$actual_sha" = "$EXPECTED_SHA"
          binaries=(
            sparkwing-controller
            sparkwing-runner
            sparkwing-cache
            sparkwing-logs
            sparkwing-web
          )
          for binary in "${binaries[@]}"; do
            digest="$(tr -d '\r\n' <"scanned-image-digests/$binary")"
            image="ghcr.io/sparkwing-dev/${binary}"
            tag_args=(--tag "${image}:${TAG}")
            if [[ "$TAG" != *-* ]]; then
              tag_args+=(--tag "${image}:latest")
            fi
            docker buildx imagetools create \
              "${tag_args[@]}" \
              "${image}@${digest}"
          done

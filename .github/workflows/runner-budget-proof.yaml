name: Runner CPU budget proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-budget-proof
  cancel-in-progress: false

jobs:
  prove:
    name: Runner CPU budget proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GOWORK: "auto"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false

      - name: Prove local runner CPU budget
        run: bash bin/runner-budget-proof.sh "$RUNNER_TEMP/runner-budget-evidence"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-budget-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-budget-evidence
          if-no-files-found: error
          retention-days: 14


version: "2"

run:
  # A full `golangci-lint run ./...` over the root module measured 97s on a cold
  # cache and 56s warm, on an idle 16-core Linux host. Under contention from
  # parallel agents it has exceeded 5m and exited 4 with packages unjudged, which
  # reads as a findings failure. The budget sits far above the measurement so a
  # slow run finishes rather than reporting a partial verdict.
  timeout: 20m

linters:
  # depguard and the F1 forbidigo rules live in .golangci-guards.yml, which
  # judges the whole tree against .guards/ rather than only new code.
  default: none
  enable:
    - bidichk # CVE-2021-42574 Trojan Source defense
    - bodyclose # missing http response body Close()
    - contextcheck # work started on a context that ignores the caller's cancellation
    - copyloopvar # loop-variable capture bugs (Go 1.22+ semantics)
    - errcheck # unchecked error returns
    - errorlint # %w wrapping + errors.Is/As discipline
    - forbidigo # banned function calls (panic / os.Exit outside main)
    - govet # default vet + extras enabled below
    - ineffassign # assignments whose value is never read
    - misspell # common english spelling errors
    - nilerr # nil returned after a non-nil error was observed
    - nolintlint # stale / malformed nolint directives
    - staticcheck # SA + S + ST + QF rule families
    - unconvert # redundant type conversions
    - usestdlibvars # use stdlib constants (http.StatusOK over 200)
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    staticcheck:
      checks:
        - all
        - -QF1001
        - -QF1002
        - -QF1003
        - -QF1004
        - -QF1005
        - -QF1006
        - -QF1007
        - -QF1008
        - -QF1009
        - -QF1010
        - -QF1011
        - -QF1012
        - -ST1000
        - -ST1020
        - -ST1021
    errcheck:
      # `_ = f()` hides an error as surely as ignoring the call does; drop one only
      # through a helper that logs why. The exclude list keeps the accepted idioms quiet.
      check-blank: true
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    misspell:
      locale: US
      ignore-rules:
        - cancelled
        - cancelling
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    forbidigo:
      exclude-godoc-examples: true
      analyze-types: false
      forbid:
        - pattern: ^panic$
          msg: "panic() in library code is a hard crash; return an error and let the caller decide. Allowed in cmd/**/main.go and _test.go (see exclusions)."
        - pattern: ^os\.Exit$
          msg: "os.Exit short-circuits deferred cleanup; return an error from main or use orchestrator-managed shutdown. Allowed in cmd/**/main.go (see exclusions)."
        - pattern: ^fmt\.Println$
          msg: "fmt.Println bypasses the structured logger; use sparkwing.Info/Error or slog directly. Allowed in cmd/**/main.go and _test.go (see exclusions)."
  exclusions:
    paths:
      - web/node_modules/
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: _test\.go
        linters:
          - forbidigo
      - path: cmd/
        linters:
          - forbidigo
      - path: (^|/)main\.go$
        linters:
          - forbidigo
      - path: ^sparkwing/[^/]+\.go$
        linters:
          - forbidigo
      - path: sparkwing/planguard/
        linters:
          - forbidigo
      - path: \.pb\.go$
        linters:
          - all
      - source: "^// Code generated"
        linters:
          - all

issues:
  # This key forgives every finding that predates origin/main, so the gate can
  # be green while the tree carries a large standing balance. Measured at merge
  # base e31e70c5 on an isolated cache, that balance is 1453 findings:
  #
  #   GOLANGCI_LINT_CACHE=$(mktemp -d) golangci-lint run ./... \
  #     --new-from-merge-base= --max-issues-per-linter=0 --max-same-issues=0
  #
  # errcheck 1141, contextcheck 152, errorlint 45, nilerr 35, forbidigo 33,
  # misspell 12, depguard 7, copyloopvar 5, unconvert 4, staticcheck 4,
  # ineffassign 4, govet 4, bodyclose 4, nolintlint 3.
  #
  # Re-measure rather than quoting the number: it moves with every merge. Two
  # traps produce different figures from the same tree. Default truncation stops
  # at 50 issues per linter and 3 per repeated finding. A shared cache replays
  # findings from sibling worktrees holding identical content at other paths,
  # which inflated an earlier count by 85 percent.
  #
  # The 51 findings from the linters that usually hold defects -- nilerr,
  # bodyclose, govet, ineffassign, staticcheck -- were read one at a time. Two
  # were defects and are fixed: source gates that skipped a Go file the parser
  # rejected and so passed it unjudged. The other 49 were each judged harmless
  # on their own code rather than by category, so re-read the finding rather
  # than trusting a rule of thumb about its linter. Burning the balance down is
  # optional cleanup rather than defect work, and every linter still judges new
  # code in full.
  new-from-merge-base: origin/main

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/sparkwing-dev

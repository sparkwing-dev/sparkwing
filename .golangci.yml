
version: "2"

run:
  # A full `golangci-lint run ./...` over the root module measured 97s on a cold
  # cache and 56s warm, on an idle 16-core Linux host. Under contention from
  # parallel agents it has exceeded 5m and exited 4 with packages unjudged, which
  # reads as a findings failure. The budget sits far above the measurement so a
  # slow run finishes rather than reporting a partial verdict.
  timeout: 20m

linters:
  # depguard and the F1 forbidigo rules live in .golangci-guards.yml, which
  # judges the whole tree against .guards/ rather than only new code.
  default: none
  enable:
    - bidichk # CVE-2021-42574 Trojan Source defense
    - bodyclose # missing http response body Close()
    - contextcheck # work started on a context that ignores the caller's cancellation
    - copyloopvar # loop-variable capture bugs (Go 1.22+ semantics)
    - errcheck # unchecked error returns
    - errorlint # %w wrapping + errors.Is/As discipline
    - forbidigo # banned function calls (panic / os.Exit outside main)
    - govet # default vet + extras enabled below
    - ineffassign # assignments whose value is never read
    - misspell # common english spelling errors
    - nilerr # nil returned after a non-nil error was observed
    - nolintlint # stale / malformed nolint directives
    - staticcheck # SA + S + ST + QF rule families
    - unconvert # redundant type conversions
    - usestdlibvars # use stdlib constants (http.StatusOK over 200)
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    staticcheck:
      checks:
        - all
        - -QF1001
        - -QF1002
        - -QF1003
        - -QF1004
        - -QF1005
        - -QF1006
        - -QF1007
        - -QF1008
        - -QF1009
        - -QF1010
        - -QF1011
        - -QF1012
        - -ST1000
        - -ST1020
        - -ST1021
    errcheck:
      # `_ = f()` hides an error as surely as ignoring the call does; drop one only
      # through a helper that logs why. The exclude list keeps the accepted idioms quiet.
      check-blank: true
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    misspell:
      locale: US
      ignore-rules:
        - cancelled
        - cancelling
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    forbidigo:
      exclude-godoc-examples: true
      analyze-types: false
      forbid:
        - pattern: ^panic$
          msg: "panic() in library code is a hard crash; return an error and let the caller decide. Allowed in cmd/**/main.go and _test.go (see exclusions)."
        - pattern: ^os\.Exit$
          msg: "os.Exit short-circuits deferred cleanup; return an error from main or use orchestrator-managed shutdown. Allowed in cmd/**/main.go (see exclusions)."
        - pattern: ^fmt\.Println$
          msg: "fmt.Println bypasses the structured logger; use sparkwing.Info/Error or slog directly. Allowed in cmd/**/main.go and _test.go (see exclusions)."
  exclusions:
    paths:
      - web/node_modules/
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: _test\.go
        linters:
          - forbidigo
      - path: cmd/
        linters:
          - forbidigo
      - path: (^|/)main\.go$
        linters:
          - forbidigo
      - path: ^sparkwing/[^/]+\.go$
        linters:
          - forbidigo
      - path: sparkwing/planguard/
        linters:
          - forbidigo
      - path: \.pb\.go$
        linters:
          - all
      - source: "^// Code generated"
        linters:
          - all

issues:
  # These linters judge changes since origin/main. The whole-tree architecture
  # rules in .golangci-guards.yml use shrinking allow-lists under .guards/.
  new-from-merge-base: origin/main

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/sparkwing-dev

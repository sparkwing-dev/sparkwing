
version: "2"

run:
  # A full `golangci-lint run ./...` over the root module measured 97s on a cold
  # cache and 56s warm, on an idle 16-core Linux host. Under contention from
  # parallel agents it has exceeded 5m and exited 4 with packages unjudged, which
  # reads as a findings failure. The budget sits far above the measurement so a
  # slow run finishes rather than reporting a partial verdict.
  timeout: 20m

linters:
  default: none
  enable:
    - bidichk # CVE-2021-42574 Trojan Source defense
    - bodyclose # missing http response body Close()
    - contextcheck # work started on a context that ignores the caller's cancellation
    - copyloopvar # loop-variable capture bugs (Go 1.22+ semantics)
    - depguard # package dependency boundaries
    - errcheck # unchecked error returns
    - errorlint # %w wrapping + errors.Is/As discipline
    - forbidigo # banned function calls (panic / os.Exit outside main)
    - govet # default vet + extras enabled below
    - ineffassign # assignments whose value is never read
    - misspell # common english spelling errors
    - nilerr # nil returned after a non-nil error was observed
    - nolintlint # stale / malformed nolint directives
    - staticcheck # SA + S + ST + QF rule families
    - unconvert # redundant type conversions
    - usestdlibvars # use stdlib constants (http.StatusOK over 200)
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: "io/ioutil is deprecated since Go 1.16; use io and os."
            - pkg: github.com/pkg/errors
              desc: "use stdlib errors with %w wrapping; errors.Is/As replaces pkg/errors.Cause/As."
            - pkg: gopkg.in/yaml.v2
              desc: "use gopkg.in/yaml.v3; v2 is unmaintained and has known issues with anchor handling."
            - pkg: github.com/stretchr/testify/assert
              desc: "use testify/require instead so a failed assertion stops the test (assert keeps going and produces follow-on noise)."

        thin-binaries-no-dispatch:
          list-mode: lax
          files:
            - "**/cmd/sparkwing-controller/**"
            - "**/internal/backend/**"
            - "**/internal/web/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/orchestrator
              desc: "Thin binaries and the dashboard support packages must not import internal/orchestrator. Extract the symbol to its own leaf package first."

        memo-inputs-declarations:
          list-mode: strict
          files:
            - "**/sparkwing/inputs/*.go"
            - "!$test"
          allow:
            - github.com/sparkwing-dev/sparkwing/sparkwing$

        memo-key-host-only:
          list-mode: lax
          files:
            - "**/sparkwing/sdk_contract.go"
          deny:
            - pkg: crypto
              desc: "Memo callbacks return values; the executing host owns memo hashing."

        # The SDK is every package under the module's sparkwing/ directory. A
        # **/sparkwing/** glob would also match a checkout whose root is named
        # sparkwing, so the scope is the tree minus the other top-level trees.
        sdk-allowed-internal:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/cmd/**"
            - "!**/internal/**"
            - "!**/pkg/**"
            - "!**/tests/**"
            - "!**/examples/**"
            - "!**/perf/**"
            - "!**/testdata/**"
            - "!**/.sparkwing/**"
            - "!**/sparkwingtest/**"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal
              desc: "The SDK may import only the named internal leaves; server packages stay behind the host boundary."
          allow: &sdk-internal-leaves
            - github.com/sparkwing-dev/sparkwing/internal/apierr$
            - github.com/sparkwing-dev/sparkwing/internal/argvalue$
            - github.com/sparkwing-dev/sparkwing/internal/depcachekey$
            - github.com/sparkwing-dev/sparkwing/internal/execdiag$
            - github.com/sparkwing-dev/sparkwing/internal/gitcmd$
            - github.com/sparkwing-dev/sparkwing/internal/limits$
            - github.com/sparkwing-dev/sparkwing/internal/nodeproto$
            - github.com/sparkwing-dev/sparkwing/internal/paths$
            - github.com/sparkwing-dev/sparkwing/internal/procenv$
            - github.com/sparkwing-dev/sparkwing/internal/procgroup$
            - github.com/sparkwing-dev/sparkwing/internal/protofd$
            - github.com/sparkwing-dev/sparkwing/internal/sdkserve$
            - github.com/sparkwing-dev/sparkwing/internal/secrets$
            - github.com/sparkwing-dev/sparkwing/internal/sessionledger$
            - github.com/sparkwing-dev/sparkwing/internal/swtags$
            - github.com/sparkwing-dev/sparkwing/internal/envredact$
            - github.com/sparkwing-dev/sparkwing/internal/fssecure$

        sdk-leaves-allowed-internal:
          list-mode: lax
          files:
            - "**/internal/apierr/*.go"
            - "**/internal/argvalue/*.go"
            - "**/internal/depcachekey/*.go"
            - "**/internal/execdiag/*.go"
            - "**/internal/gitcmd/*.go"
            - "**/internal/limits/*.go"
            - "**/internal/nodeproto/*.go"
            - "**/internal/paths/*.go"
            - "**/internal/procenv/*.go"
            - "**/internal/procgroup/*.go"
            - "**/internal/protofd/*.go"
            - "**/internal/sdkserve/*.go"
            - "**/internal/secrets/*.go"
            - "**/internal/sessionledger/*.go"
            - "**/internal/swtags/*.go"
            - "**/internal/envredact/*.go"
            - "**/internal/fssecure/*.go"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal
              desc: "SDK leaves may depend only on the named leaves, never store, controller, wingd or other server packages."
          allow: *sdk-internal-leaves

        store-allowed-internal:
          list-mode: lax
          files:
            - "**/internal/store/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal
              desc: "internal/store may import only the data-model packages it owns the authority over. Git resolution, token minting and wire DTOs belong to the controller."
          allow:
            - github.com/sparkwing-dev/sparkwing/internal/store
            - github.com/sparkwing-dev/sparkwing/internal/capability
            - github.com/sparkwing-dev/sparkwing/internal/blob
            - github.com/sparkwing-dev/sparkwing/internal/runspec
            - github.com/sparkwing-dev/sparkwing/internal/runstate
            - github.com/sparkwing-dev/sparkwing/internal/limits
            - github.com/sparkwing-dev/sparkwing/internal/apierr
            - github.com/sparkwing-dev/sparkwing/internal/nodeproto
            - github.com/sparkwing-dev/sparkwing/internal/settings
            - github.com/sparkwing-dev/sparkwing/internal/admission
            - github.com/sparkwing-dev/sparkwing/internal/cronspec
            - github.com/sparkwing-dev/sparkwing/internal/sourceurl
            - github.com/sparkwing-dev/sparkwing/internal/secrets
            - github.com/sparkwing-dev/sparkwing/internal/procenv

        wire-is-leaf:
          list-mode: lax
          files:
            - "**/internal/controllerwire/**"
            - "**/pkg/wingwire/**"
            - "**/internal/localhostwire/**"
            - "**/internal/runspec/**"
            - "**/internal/runstate/**"
            - "**/internal/engineid/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/store
              desc: "Wire and value packages are leaves; they must not reach the store."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/controller$
              desc: "Server implementation belongs behind the controller wire contract."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/controller/
              desc: "Wire and value packages are leaves; they must not reach the controller."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/engine/
              desc: "Wire and value packages must not reach engine implementation packages."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/engine$
              desc: "Wire and value packages are leaves; move the shared value to a leaf package such as engineid."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/wingd
              desc: "Wire and value packages are leaves; they must not reach the local daemon."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/procgroup
              desc: "Wire and value packages are leaves; they must not reach process machinery."

        controller-not-daemon:
          list-mode: lax
          files:
            - "**/internal/controller/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/wingd
              desc: "The controller must not depend on the local daemon; move shared types to a wire package such as localhostwire."

        host-not-server:
          list-mode: lax
          files:
            - "**/internal/nodehost/**"
            - "**/internal/runners/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/controller$
              desc: "Server implementation belongs behind the controller wire contract."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/controller/
              desc: "Run hosts and runners talk to the controller through internal/controller/client, never the server package."
          allow:
            - github.com/sparkwing-dev/sparkwing/internal/controller/client

        client-not-store:
          list-mode: lax
          files:
            - "**/internal/controller/client/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/store
              desc: "The controller client must not link the store; use wire types."

        internal-not-sdk:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/testdata/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/sparkwing
              desc: "Internal packages must not depend on the author SDK; move the shared value to an internal leaf the SDK re-exports."

        no-testing-in-prod:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/*test/**"
            - "!**/internal/testleak/**"
            - "!**/internal/testhome/**"
            - "!**/internal/testshell/**"
            - "!**/internal/chaos/**"
          deny:
            - pkg: testing
              desc: "Production code must not import testing; move the hook to export_test.go or a test-only package."

        backends-no-impls:
          list-mode: lax
          files:
            - "**/pkg/backends/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/storage
              desc: "pkg/backends is config-type only; internal/storage consumes the config, not the reverse."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/store
              desc: "pkg/backends is config-type only."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/controller$
              desc: "Server implementation belongs behind the controller wire contract."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/controller/
              desc: "pkg/backends declares the controller backend type only."
            - pkg: github.com/sparkwing-dev/sparkwing/pkg/logs
              desc: "pkg/backends declares log backend types only."

        cluster-runner-only:
          list-mode: lax
          files:
            - "$all"
            - "!**/cmd/sparkwing-runner/**"
            - "!**/internal/cluster/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/cluster
              desc: "internal/cluster is the warm-runner pool; only cmd/sparkwing-runner imports it."

        runners-dispatcher-only:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/cluster/**"
            - "!**/internal/runners/**"
            - "!**/internal/wingd/localcontroller/**"
            - "!**/cmd/sparkwing/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/runners
              desc: "internal/runners/* are the execution backends. Only internal/cluster, internal/wingd/localcontroller and cmd/sparkwing select one; service installers import internal/runners/service/unitfile, and award validation is the shared leaf internal/runners/award."
          allow:
            - github.com/sparkwing-dev/sparkwing/internal/runners/service/unitfile
            - github.com/sparkwing-dev/sparkwing/internal/runners/award

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    staticcheck:
      checks:
        - all
        - -QF1001
        - -QF1002
        - -QF1003
        - -QF1004
        - -QF1005
        - -QF1006
        - -QF1007
        - -QF1008
        - -QF1009
        - -QF1010
        - -QF1011
        - -QF1012
        - -ST1000
        - -ST1020
        - -ST1021
    errcheck:
      # `_ = f()` hides an error as surely as ignoring the call does; drop one only
      # through a helper that logs why. The exclude list keeps the accepted idioms quiet.
      check-blank: true
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    misspell:
      locale: US
      ignore-rules:
        - cancelled
        - cancelling
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    forbidigo:
      exclude-godoc-examples: true
      analyze-types: false
      forbid:
        - pattern: ^panic$
          msg: "panic() in library code is a hard crash; return an error and let the caller decide. Allowed in cmd/**/main.go and _test.go (see exclusions)."
        - pattern: ^os\.Exit$
          msg: "os.Exit short-circuits deferred cleanup; return an error from main or use orchestrator-managed shutdown. Allowed in cmd/**/main.go (see exclusions)."
        - pattern: ^fmt\.Println$
          msg: "fmt.Println bypasses the structured logger; use sparkwing.Info/Error or slog directly. Allowed in cmd/**/main.go and _test.go (see exclusions)."
  exclusions:
    paths:
      - web/node_modules/
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: _test\.go
        linters:
          - forbidigo
      - path: cmd/
        linters:
          - forbidigo
      - path: (^|/)main\.go$
        linters:
          - forbidigo
      - path: ^sparkwing/[^/]+\.go$
        linters:
          - forbidigo
      - path: sparkwing/planguard/
        linters:
          - forbidigo
      - path: \.pb\.go$
        linters:
          - all
      - source: "^// Code generated"
        linters:
          - all

issues:
  # Judge changes since origin/main.
  new-from-merge-base: origin/main

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/sparkwing-dev

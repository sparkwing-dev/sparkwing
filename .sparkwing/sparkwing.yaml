pipelines:
  # pre-commit is the source-policy tier and runs from the git pre-commit hook;
  # pre-push is the fast push-boundary tier and runs from the git pre-push hook;
  # gate is the broad tier, which `sparkwing run gate` and hosted CI run and no
  # git hook fires; pre-release is the release-boundary tier, which the release
  # pipeline and the hosted release lane run.
  - name: pre-commit
    entrypoint: PreCommit
    on:
      pre_commit: {}

  - name: pre-push
    entrypoint: PrePush
    on:
      pre_push: {}

  - name: gate
    entrypoint: Gate

  - name: pre-release
    entrypoint: PreRelease

  - name: lint
    entrypoint: Lint

  - name: test
    entrypoint: Test

  - name: feature-e2e
    entrypoint: FeatureE2E

  - name: static-analysis
    entrypoint: StaticAnalysis

  - name: jev-lint
    entrypoint: JevLint

  - name: jev-sweeper
    entrypoint: JevSweeper

  - name: security-scan
    entrypoint: SecurityScan

  - name: review
    entrypoint: Review

  # land is the pre-merge path for every change: the gate's source-policy job
  # first, then the rest of the gate and the review in parallel, then a
  # fast-forward of main to the commit both judged.
  - name: land
    entrypoint: Land

  - name: integration
    entrypoint: Integration

  - name: store-postgres
    entrypoint: StorePostgres

  - name: local-controller-e2e
    entrypoint: LocalControllerE2E

  # Manual synthetic workloads for comparing local admission modes. Keep each
  # shape under a stable pipeline name so learned profiles never mix costs.
  - name: admission-stress
    entrypoint: AdmissionStressMatrix

  - name: admission-stress-light-sequential
    entrypoint: AdmissionStressLightSequential

  - name: admission-stress-light-parallel
    entrypoint: AdmissionStressLightParallel

  - name: admission-stress-medium-fan-in
    entrypoint: AdmissionStressMediumFanIn

  - name: admission-stress-cpu-heavy
    entrypoint: AdmissionStressCPUHeavy

  - name: admission-stress-heavy
    entrypoint: AdmissionStressHeavy

  - name: build
    entrypoint: Build

  - name: build-images
    entrypoint: BuildImages

  - name: publish-images
    entrypoint: PublishImages

  - name: k8s-e2e
    entrypoint: KubernetesE2E

  - name: release
    entrypoint: Release

  - name: release-cut
    entrypoint: ReleaseCut

  - name: weekly-release
    entrypoint: WeeklyRelease
    on:
      schedule:
        - name: weekly-sdk-cli
          cron: '0 9 * * 1'
          tz: America/Denver
          where: local
          overlap: skip

  - name: owned-sdk-main
    entrypoint: OwnedSDK
    on:
      schedule:
        - name: owned-sdk-main
          cron: '0 8 * * *'
          tz: America/Denver
          where: local
          overlap: skip

  - name: template-verify
    entrypoint: TemplateVerify

  - name: deploy
    entrypoint: Deploy
    requires: [deploy-kikd-prod]
    on:
      push:
        branches: [main]

  - name: deploy-scan
    entrypoint: DeployScan
    requires: [deploy-kikd-prod]

  - name: deploy-smoke
    entrypoint: DeploySmoke

  - name: example
    entrypoint: Example

  - name: example-probe
    entrypoint: ExampleProbe

  - name: weather-report
    entrypoint: WeatherReport

  # The Cloud's own targets, so a webhook run, which carries no arguments,
  # probes them. The API server addresses are the EKS control-plane ENIs
  # behind the kubernetes Service; recheck them after a control-plane upgrade
  # with `kubectl get endpointslices -l kubernetes.io/service-name=kubernetes`.
  - name: escape-probe
    entrypoint: EscapeProbe
    args:
      controller-url: https://api.sparkwing.dev
      rds: kikd-prod-sparkwing-postgres.cv04yywoevz8.us-west-2.rds.amazonaws.com:5432
      api-hosts: 10.0.41.86,10.0.59.73

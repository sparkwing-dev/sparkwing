pipelines:
  # pre-commit is the source-policy tier and runs from the git pre-commit hook;
  # gate is the broad tier and runs from the git pre-push hook; pre-release is
  # the release-boundary tier, which the release pipeline and the hosted
  # release lane run and no git hook fires.
  - name: pre-commit
    entrypoint: PreCommit
    on:
      pre_commit: {}

  - name: gate
    entrypoint: Gate
    on:
      pre_push: {}

  - name: pre-release
    entrypoint: PreRelease

  - name: lint
    entrypoint: Lint

  - name: test
    entrypoint: Test

  - name: static-analysis
    entrypoint: StaticAnalysis

  - name: security-scan
    entrypoint: SecurityScan

  - name: integration
    entrypoint: Integration

  - name: store-postgres
    entrypoint: StorePostgres

  - name: build
    entrypoint: Build

  - name: build-images
    entrypoint: BuildImages

  - name: k8s-e2e
    entrypoint: KubernetesE2E

  - name: release
    entrypoint: Release

  - name: template-verify
    entrypoint: TemplateVerify

  - name: example
    entrypoint: Example

  - name: weather-report
    entrypoint: WeatherReport

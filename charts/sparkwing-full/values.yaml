# Default values for sparkwing-full.
#
# Override with `helm install ... --set key=value` or `-f
# my-values.yaml`. This chart version has no compatible public image
# default: a bare install is not a runnable release. Build or mirror a
# mutually compatible image set and explicitly set image.repository
# and image.tag for every enabled component until a corrected release
# is published.
#
# Sections, in roughly the order operators care about:
#   1. controller.*               -- the orchestrator and dashboard
#   2. ingress.*                  -- optional public ingress for the controller
#   3. serviceAccount             -- the controller's identity
#   4. imagePullSecrets
#   5. security defaults
#   6. sparkwing-runner-bundle.*  -- sub-chart pass-through

# -----------------------------------------------------------------------
# 1. Controller. Single-instance orchestrator: owns the state DB,
#    serves /api/v1/*, the dashboard and its sign-in pages, and hosts
#    webhooks. HA-multi-instance lives in the paid feature pack; the
#    OSS posture is one pod.
# -----------------------------------------------------------------------
controller:
  # Single-instance is the OSS posture (decision 0001). Don't bump
  # this -- the controller's state DB is local SQLite; multi-replica
  # would corrupt it. HA controller is a paid feature.
  replicas: 1

  image:
    # Registry-layout fallback only. The current appVersion is not a
    # compatible public image contract; set repository and tag to an
    # image built or mirrored with the other enabled components.
    repository: ghcr.io/sparkwing-dev/sparkwing-controller
    tag: "" # falls back to .Chart.AppVersion when empty
    pullPolicy: IfNotPresent

  # Bind addr. Service maps :80 -> :4344. Match the controller's
  # default to keep things readable; operators rarely need to change.
  port: 4344

  # Optional scrape port for Prometheus /metrics on a listener of its
  # own. 0 leaves /metrics on the API port, where it answers only an
  # admin bearer, so the scraper needs an admin token. A port moves the
  # endpoint onto a container port no Service exposes and serves it
  # without a bearer, so only an in-cluster scraper reaches it.
  metricsPort: 0


  # Memory ceiling in MiB for concurrent argon2id password and token
  # hashing. Each hash holds 64 MiB while it runs, so the default
  # admits four at a time and keeps unauthenticated login traffic
  # inside resources.limits.memory below.
  argon2MemoryBudgetMB: 256

  # Label terms a node whose plan declares no Prefers of its own prefers its
  # runner to advertise, in the Prefers term syntax. Empty leaves such a node
  # to the first claimant.
  defaultPreferLabels: []

  # How long a node is held back from a claim-mode runner that does not
  # advertise its preference, measured from the node's ready time, while a
  # runner that does advertise it is live and has a slot. Empty keeps the
  # controller default of 20s; "0s" claims first-in-first-out regardless of
  # preference.
  placementHold: ""

  # How recently a claim-mode runner must have polled for a claim to count as
  # live for the hold above. Empty keeps the controller default of 30s.
  placementLiveness: ""

  # Runs one principal may create in a rolling hour. Each run a GitHub App
  # delivery creates counts against the team the installation is bound to.
  # Past the cap the controller answers 429
  # with a Retry-After. The budget lives in controller memory, so a restart
  # refills every principal. 0 is unlimited.
  maxRunsPerPrincipalHour: 0

  # Pending-trigger depth of one team past which that team's new GitHub App
  # deliveries and API submissions are shed with 503 and a Retry-After rather
  # than queued. 0 never sheds.
  shedQueueDepth: 0

  # How long a content-identical API submission answers with the run the first
  # one started instead of starting a second, for example "10m". GitHub
  # deliveries are deduped by delivery id and body digest regardless. Empty
  # dedupes no API submission.
  triggerDedupeWindow: ""

  # Per-runner request budgets on the claim and heartbeat routes, per rolling
  # minute, keyed on the token prefix together with the runner the request
  # names, so a fleet sharing one token is budgeted runner by runner. The agent
  # liveness heartbeat is never budgeted. Empty leaves both unlimited; 1200
  # suits the cadence the shipped runners use.
  claimsPerRunnerMinute: ""
  heartbeatsPerRunnerMinute: ""

  # Request budget on every route one token can reach, per rolling minute,
  # keyed on the token prefix. It bounds a caller that varies the runner it
  # says it is, which the per-runner budgets cannot. The agent liveness
  # heartbeat is never budgeted. Empty is unlimited.
  requestsPerTokenMinute: ""

  # Request rate, across every caller, past which the controller logs at warn
  # and counts sparkwing_request_rate_alarm_total. It refuses nothing. Empty
  # raises no alarm.
  requestsPerMinuteAlarm: ""

  # Widest poll interval the controller suggests to a claim loop while it has no
  # work, for example "5s". A runner honors it only to poll less often. The
  # controller refuses to start when the suggestion plus a runner's own spread
  # reaches placementHold or placementLiveness. Empty keeps the controller
  # default of 5s.
  idleClaimPoll: ""

  # Named set of abuse guards the controller runs with: "cloud" for a paid
  # hosted controller, "cloud-free" for a free-tier one. A profile supplies the
  # per-runner and per-token request budgets, the request rate alarm, the
  # egress stream and download caps, and idle-poll enforcement, and it fills a
  # guard only where nothing above named one, so an explicit value always wins.
  # Empty, the default, supplies none and leaves a self-hosted controller
  # exactly as it was. See docs/security.md.
  limitsProfile: ""

  # Query-free HTTP(S) dashboard base URL used for commit-status run links.
  # Empty or invalid keeps reporting enabled but omits the target URL.
  dashboardURL: ""

  # Ceilings on the whole object store. Above either maximum the
  # controller freezes object writes: reads and deletes keep working,
  # health reports the freeze, and `sparkwing cluster object-store
  # reset-breaker` thaws it until the next measurement. Empty leaves the
  # bucket unlimited, which is the shipped behavior. See
  # docs/observability.md.
  bucketCeiling:
    # Stored bytes at or above which object writes freeze.
    maxBytes: ""
    # Objects at or above which object writes freeze.
    maxObjects: ""
    # Stored bytes at which health reports a warning, refusing nothing.
    warnBytes: ""
    # Objects at which health reports a warning.
    warnObjects: ""
    # Gap between bucket measurements (default 1h); "0" measures once at
    # startup and then relies on the running count.
    reconcile: ""
    # Object store the ceiling measures, as a store URL such as
    # s3://bucket/prefix. Read on the interval above and never served.
    # Empty counts only the writes the controller itself makes.
    store: ""
    # Listings one measurement may spend before it stops and reports
    # itself incomplete. Each listing covers a thousand objects, so the
    # default of 1000 bounds a measurement at a million; raise it for a
    # larger bucket.
    measurePages: ""

  logs:
    # The sparkwing-logs service the controller announces to clients
    # and reads dashboard log panes from. Empty = auto-generate to point
    # at the bundled sparkwing-runner-bundle's logs Service; if that
    # sub-chart or its logs component is disabled, the controller
    # announces no logs service and the dashboard shows no logs.
    url: ""

  cache:
    # Which sparkwing-cache the controller's gitcache proxy forwards
    # to, so off-cluster callers can clone and seed through
    # /api/v1/gitcache/. Empty = auto-generate to point at the bundled
    # sparkwing-runner-bundle's cache Service; if that sub-chart or its
    # cache is disabled, the controller runs without a cache URL and
    # the proxy routes answer 404.
    url: ""

  # Secrets-store encryption key. When set, the controller encrypts
  # secret values stored in the state DB at rest. Without it, the
  # controller logs a WARNING at startup and stores plaintext.
  # Generate with `openssl rand -base64 32`.
  secretsKey:
    # Empty name disables; controller runs with plaintext secrets.
    name: ""
    key: key

  # The key stored secret values were sealed under before secretsKey.
  # Read-only: a value that does not open under secretsKey is tried
  # against this one, which is what keeps every value readable across a
  # key change. Run `sparkwing secrets rotate --profile <name>` to
  # re-encrypt everything under secretsKey, then clear this.
  secretsPreviousKey:
    # Empty name disables; the controller holds one key.
    name: ""
    key: key

  # The first admin token, read before the listener binds. When the
  # tokens table is empty the controller stores that token's hash as an
  # admin credential, so a provisioned controller never serves a request
  # unauthenticated and requireAuth is satisfied on its first start.
  # Ignored once any token exists. The value has to look like a minted
  # token: "swu_" followed by at least 28 characters, for example
  # `printf 'swu_%s' "$(openssl rand -hex 24)"`.
  bootstrapAdminToken:
    # Empty name disables; the render then refuses while requireAuth is
    # true unless allowOpenBootstrap opts in.
    name: ""
    key: token

  # Refuse to start when no live token exists, which turns an
  # accidentally open controller into a failed rollout instead of a
  # running hole. With bootstrapAdminToken set a fresh install starts
  # authenticated. Without it the render refuses unless
  # allowOpenBootstrap is true, because a fresh controller would have no
  # way to mint its first token and would crash-loop.
  requireAuth: true

  # Start without bootstrapAdminToken. The chart then drops
  # --require-auth, so a controller whose tokens table is empty serves
  # every route unauthenticated -- token minting and first-admin
  # creation included -- to anything that reaches its Service, until a
  # token exists and the controller restarts. A controller that already
  # holds a live token stays authenticated, so an upgrade can set this
  # instead of creating a bootstrap Secret, at the cost of that open
  # window reopening if the tokens table is ever emptied. Bool only.
  allowOpenBootstrap: false

  # Optional Secret containing a PostgreSQL DSN. Empty keeps SQLite.
  databaseSecret:
    name: ""
    key: dsn

  # SQLite state lives on a PVC. Set type=emptyDir with databaseSecret.
  storage:
    # "pvc" mounts a PersistentVolumeClaim at /data.
    # "emptyDir" runs ephemeral (state lost on pod restart).
    type: pvc
    pvc:
      size: 5Gi
      # Empty = use the cluster default StorageClass.
      storageClassName: ""
      # PVC survives `helm uninstall` so run history isn't wiped on
      # an accidental uninstall. Operators who want a clean slate
      # can `kubectl delete pvc` after.
      keepOnUninstall: true

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # Optional Pod-level scheduling controls. Empty = no constraints.
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Extra env passed to the controller container. Useful for
  # forwarding GOPRIVATE, OTEL_*, etc.
  extraEnv: []
  # - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
  #   value: http://tempo.monitoring.svc.cluster.local:4318/v1/traces

# -----------------------------------------------------------------------
# 2. Ingress. Optional public ingress to the controller Service, which
#    serves the dashboard and the API on one port. Disabled by default
#    -- many self-host operators front the controller with their own
#    Ingress / Gateway / cloud LB and don't want this chart to manage
#    one. A console host and an API host may both point at the
#    controller Service; a proxy in front can still split them.
# -----------------------------------------------------------------------
ingress:
  enabled: false
  # IngressClass name. Empty = cluster default.
  className: ""
  annotations: {}
  # - cert-manager.io/cluster-issuer: letsencrypt-prod
  # - nginx.ingress.kubernetes.io/proxy-body-size: 50m
  hosts:
    - host: sparkwing.example.com
      paths:
        - path: /
          pathType: Prefix
  # The render check on this list is presence-only: one entry is enough,
  # and an entry without `secretName` leaves the ingress controller's
  # default certificate to terminate TLS, which is the operator's call.
  # Any entry also passes `--hsts` to the controller, which then sends
  # Strict-Transport-Security and requires an https Origin on
  # cookie-authenticated writes.
  tls: []
  # - hosts:
  #     - sparkwing.example.com
  #   secretName: sparkwing-tls

  # Publish the controller without TLS or without --require-auth. An
  # Ingress exposes the whole controller API and dashboard beyond the
  # cluster, so the render fails on `tls: []`, on
  # `controller.requireAuth: false`, or on `controller.allowOpenBootstrap:
  # true` without a bootstrap token, until this says the exposure is
  # deliberate. Must be a bool: a quoted string fails the render rather
  # than reading as an opt-out. With `tls: []` the controller also gets
  # `--insecure-cookies`, so a browser can hold a session over plain
  # HTTP.
  allowInsecure: false

# -----------------------------------------------------------------------
# 3. ServiceAccount for the controller. The controller makes no
#    Kubernetes API calls, so the chart grants it no Role and mounts no
#    API token; the account exists to carry IRSA / Workload Identity
#    annotations for S3 and similar cloud access.
#
#    The runner-side SA + RBAC is managed by the sparkwing-runner-bundle
#    sub-chart -- see `sparkwing-runner-bundle.serviceAccount` /
#    `sparkwing-runner-bundle.rbac` below.
# -----------------------------------------------------------------------
serviceAccount:
  # Create a SA for the controller pod (recommended). Set false if
  # you've pre-created one with custom IRSA / Workload Identity
  # annotations.
  create: true
  # Empty + create=true => name generated from .Release.Name.
  name: ""
  # Annotations on the SA. Common case: IRSA (EKS) role binding for
  # ECR pulls, S3 backups, etc.
  annotations: {}

# -----------------------------------------------------------------------
# 4. Image pull secrets applied to the controller. The runner-side
#    bundle has its own (`sparkwing-runner-bundle.imagePullSecrets`).
# -----------------------------------------------------------------------
imagePullSecrets: []
# - name: ghcr-pull-secret

# -----------------------------------------------------------------------
# 5. Pod-level security defaults applied to the controller.
# -----------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
  # Required by the Pod Security "restricted" profile. Drop this only
  # for a workload that needs syscalls the runtime's default profile
  # blocks; the pods this chart runs do not.
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  # Every path the controller pod writes lives on a mounted
  # volume: /data, the /tmp scratch emptyDir, and SPARKWING_HOME
  # inside it. Set false only for an image that writes to its own
  # layer.
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# safety: Mounted roots must belong to the runtime UID before SPARKWING_HOME becomes owner-only.
# The init requires /bin/chown and violates Restricted Pod Security; disable it only for pre-owned storage.
volumePermissions:
  enabled: true

# -----------------------------------------------------------------------
# 6. Sub-chart: sparkwing-runner-bundle. All values nested here are
#    forwarded as the sub-chart's `.Values`. Defaults below override
#    the sub-chart's own defaults so the runner immediately claims
#    work from the in-cluster controller installed by THIS chart.
#
#    Full schema in charts/sparkwing-runner-bundle/values.yaml.
# -----------------------------------------------------------------------
sparkwing-runner-bundle:
  # Toggles whether this chart deploys the runner side at all. Off
  # if operators want only the controller in this release (e.g.
  # they're running runners in another cluster).
  enabled: true

  controller:
    # Wire the bundled runner at the bundled controller's Service.
    # An explicit URL still wins when the runner should claim from a
    # different controller.
    url: ""
    bundled: true
    # The controller-token Secret the runner mounts. Empty =
    # unauthenticated to the controller (fine for isolated development;
    # not for shared installs). Pre-create with:
    #   kubectl create secret generic sparkwing-token \
    #     --from-literal=token=<token>
    tokenSecret:
      name: ""
      key: token

  # Sensible defaults for a single-cluster install. Override if you
  # need a beefier runner pool or different label set.
  runner:
    replicas: 1
    labels:
      - cluster
    maxConcurrent: 2
    alsoClaimTriggers: true
    triggerRunner:
      kind: inprocess
      labels: []

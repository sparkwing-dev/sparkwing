# Default values for sparkwing-full.
#
# Override with `helm install ... --set key=value` or `-f
# my-values.yaml`. This chart version has no compatible public image
# default: a bare install is not a runnable release. Build or mirror a
# mutually compatible image set and explicitly set image.repository
# and image.tag for every enabled component until a corrected release
# is published.
#
# Sections, in roughly the order operators care about:
#   1. controller.*               -- the orchestrator
#   2. web.*                      -- the dashboard SPA host
#   3. ingress.*                  -- optional public ingress for the dashboard
#   4. serviceAccount / rbac      -- shared identity / permissions
#   5. secrets.*                  -- references to pre-created Secrets
#   6. imagePullSecrets / security defaults
#   7. sparkwing-runner-bundle.*  -- sub-chart pass-through

# -----------------------------------------------------------------------
# 1. Controller. Single-instance orchestrator: owns the state DB,
#    serves /api/v1/*, hosts webhooks. HA-multi-instance lives in the
#    paid feature pack; the OSS posture is one pod.
# -----------------------------------------------------------------------
controller:
  # Single-instance is the OSS posture (decision 0001). Don't bump
  # this -- the controller's state DB is local SQLite; multi-replica
  # would corrupt it. HA controller is a paid feature.
  replicas: 1

  image:
    # Registry-layout fallback only. The current appVersion is not a
    # compatible public image contract; set repository and tag to an
    # image built or mirrored with the other enabled components.
    repository: ghcr.io/sparkwing-dev/sparkwing-controller
    tag: "" # falls back to .Chart.AppVersion when empty
    pullPolicy: IfNotPresent

  # Bind addr. Service maps :80 -> :4344. Match the controller's
  # default to keep things readable; operators rarely need to change.
  port: 4344

  # Optional scrape port for Prometheus /metrics on a listener of its
  # own. 0 leaves /metrics on the API port, where an ingress in front
  # of the controller publishes pipeline names to anyone who asks. A
  # port moves the endpoint onto a container port no Service exposes,
  # so only an in-cluster scraper reaches it.
  metricsPort: 0

  # The controller's warm-PVC pool feature (creates ephemeral
  # warmer pods to pre-pull images onto PVCs). Requires K8s API
  # access in the install namespace; rbac.create must be true.
  pool:
    enabled: true
    # Empty = use install namespace. Override only if the controller
    # should manage a pool in a *different* namespace.
    namespace: ""

  # Webhook signing. Enables HMAC verification on
  # POST /webhooks/github/{pipeline}. Reference an existing Secret
  # (rotation = kubectl edit secret + rollout restart, no helm
  # upgrade needed).
  githubWebhookSecret:
    # Empty name disables the env var injection (webhooks accept
    # without HMAC verification -- fine for kind/dev, not prod).
    name: ""
    key: webhook-secret

  # GitHub commit statuses for pull_request webhook runs. The token
  # needs commit-status write access to every repository whose webhook
  # reaches this controller. Empty name disables status reporting.
  githubStatusToken:
    name: ""
    key: token

  # Proxy source CIDRs allowed to supply X-Forwarded-For for login
  # throttling. This must include the dashboard pod's address: the web
  # deployment forwards each browser's address to the controller, and
  # an untrusted source is ignored, which collapses every dashboard
  # login into one budget. Set the web pod's address when you pin it;
  # when the pod IP is unknown, set the cluster pod CIDR, for example
  # 10.244.0.0/16 (kubeadm/kind), 10.42.0.0/16 (k3s), or the value of
  # `kubectl cluster-info dump | grep cluster-cidr`. Every pod in the
  # listed range can then supply X-Forwarded-For, so list the
  # narrowest range that contains the web pod. Empty keys the limiter
  # on the TCP peer. List proxy networks, not client networks.
  trustedProxyCIDRs: []

  # Memory ceiling in MiB for concurrent argon2id password and token
  # hashing. Each hash holds 64 MiB while it runs, so the default
  # admits four at a time and keeps unauthenticated login traffic
  # inside resources.limits.memory below.
  argon2MemoryBudgetMB: 256

  # Label terms a node whose plan declares no Prefers of its own prefers its
  # runner to advertise, in the Prefers term syntax. Empty leaves such a node
  # to the first claimant.
  defaultPreferLabels: []

  # How long a node is held back from a claim-mode runner that does not
  # advertise its preference, measured from the node's ready time, while a
  # runner that does advertise it is live and has a slot. Empty keeps the
  # controller default of 20s; "0s" claims first-in-first-out regardless of
  # preference.
  placementHold: ""

  # How recently a claim-mode runner must have polled for a claim to count as
  # live for the hold above. Empty keeps the controller default of 30s.
  placementLiveness: ""

  # Runs one principal may create in a rolling hour. A webhook delivery counts
  # against the repository it names. Past the cap the controller answers 429
  # with a Retry-After. The budget lives in controller memory, so a restart
  # refills every principal. 0 is unlimited.
  maxRunsPerPrincipalHour: 0

  # Pending-trigger depth past which a new webhook delivery or API submission is
  # shed with 503 and a Retry-After rather than queued. 0 never sheds.
  shedQueueDepth: 0

  # How long a content-identical API submission answers with the run the first
  # one started instead of starting a second, for example "10m". GitHub
  # deliveries are deduped by delivery id and body digest regardless. Empty
  # dedupes no API submission.
  triggerDedupeWindow: ""

  # Per-runner request budgets on the claim and heartbeat routes, per rolling
  # minute, keyed on the token prefix together with the runner the request
  # names, so a fleet sharing one token is budgeted runner by runner. The agent
  # liveness heartbeat is never budgeted. Empty leaves both unlimited; 1200
  # suits the cadence the shipped runners use.
  claimsPerRunnerMinute: ""
  heartbeatsPerRunnerMinute: ""

  # Widest poll interval the controller suggests to a claim loop while it has no
  # work, for example "5s". A runner honors it only to poll less often. The
  # controller refuses to start when the suggestion plus a runner's own spread
  # reaches placementHold or placementLiveness. Empty keeps the controller
  # default of 5s.
  idleClaimPoll: ""

  # Query-free HTTP(S) dashboard base URL used for commit-status run links.
  # Empty or invalid keeps reporting enabled but omits the target URL.
  dashboardURL: ""

  cache:
    # Which sparkwing-cache the controller's gitcache proxy forwards
    # to, so off-cluster callers can clone and seed through
    # /api/v1/gitcache/. Empty = auto-generate to point at the bundled
    # sparkwing-runner-bundle's cache Service; if that sub-chart or its
    # cache is disabled, the controller runs without a cache URL and
    # the proxy routes answer 404.
    url: ""

  # Secrets-store encryption key. When set, the controller encrypts
  # secret values stored in the state DB at rest. Without it, the
  # controller logs a WARNING at startup and stores plaintext.
  # Generate with `openssl rand -base64 32`.
  secretsKey:
    # Empty name disables; controller runs with plaintext secrets.
    name: ""
    key: key

  # The key stored secret values were sealed under before secretsKey.
  # Read-only: a value that does not open under secretsKey is tried
  # against this one, which is what keeps every value readable across a
  # key change. Run `sparkwing secrets rotate --profile <name>` to
  # re-encrypt everything under secretsKey, then clear this.
  secretsPreviousKey:
    # Empty name disables; the controller holds one key.
    name: ""
    key: key

  # The first admin token, read before the listener binds. When the
  # tokens table is empty the controller stores that token's hash as an
  # admin credential, so a provisioned controller never serves a request
  # unauthenticated and requireAuth is satisfied on its first start.
  # Ignored once any token exists. The value has to look like a minted
  # token: "swu_" followed by at least 28 characters, for example
  # `printf 'swu_%s' "$(openssl rand -hex 24)"`.
  bootstrapAdminToken:
    # Empty name disables; the controller bootstraps through an open window.
    name: ""
    key: token

  # Refuse to start when no live token exists, which turns an
  # accidentally open controller into a failed rollout instead of a
  # running hole. An upgrade of a cluster that already holds a token
  # needs nothing else. A fresh install needs bootstrapAdminToken set
  # alongside it, or the pod crash-loops with no way to mint the first
  # token; the render does not refuse that pairing, because it cannot
  # see what the state DB already holds.
  requireAuth: false

  # State DB lives on a PVC. Single-instance, so RWO is fine.
  storage:
    # "pvc" mounts a PersistentVolumeClaim at /data.
    # "emptyDir" runs ephemeral (state lost on pod restart).
    type: pvc
    pvc:
      size: 5Gi
      # Empty = use the cluster default StorageClass.
      storageClassName: ""
      # PVC survives `helm uninstall` so run history isn't wiped on
      # an accidental uninstall. Operators who want a clean slate
      # can `kubectl delete pvc` after.
      keepOnUninstall: true

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # Optional Pod-level scheduling controls. Empty = no constraints.
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Extra env passed to the controller container. Useful for
  # forwarding GOPRIVATE, OTEL_*, etc.
  extraEnv: []
  # - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
  #   value: http://tempo.monitoring.svc.cluster.local:4318/v1/traces

# -----------------------------------------------------------------------
# 2. Web. Thin SPA host that proxies /api/v1/* to the controller.
#    Stateless; the embedded Next.js bundle ships in the binary.
# -----------------------------------------------------------------------
web:
  # Web is stateless -- a 2-replica deployment is fine if you want
  # zero-downtime rollouts. Default 1 to match the OSS single-pod
  # posture.
  replicas: 1

  image:
    # Pin this with the controller and runner-bundle images; the
    # appVersion fallback is not a runnable public release default.
    repository: ghcr.io/sparkwing-dev/sparkwing-web
    tag: ""
    pullPolicy: IfNotPresent

  # Bind addr. Service maps :80 -> :4343.
  port: 4343

  # Address sparkwing-web binds. Empty = 0.0.0.0:<port>, which the
  # Service needs. Set "127.0.0.1:4343" to keep a token-backed
  # dashboard off the pod network; the Service then reaches nothing,
  # so this is for a kubectl port-forward or a sidecar only.
  addr: ""

  controller:
    # Where the web pod proxies /api/v1/* to. Empty = auto-generate
    # to point at the in-cluster controller Service. Override if
    # you're running the controller out-of-cluster or in another
    # namespace.
    url: ""

  logs:
    # Where the web pod proxies log reads to. Empty = auto-generate
    # to point at the bundled sparkwing-runner-bundle's logs
    # Service. Set explicitly if logs live elsewhere.
    url: ""

  cache:
    # Which sparkwing-cache the dashboard's services panel probes.
    # Empty = auto-generate to point at the bundled
    # sparkwing-runner-bundle's cache Service; if that sub-chart or
    # its cache is disabled, the web pod runs without --cache and the
    # panel simply omits the cache. Probe-only: the dashboard reads
    # the cache's /health and nothing else, so pointing it at a cache
    # you run yourself costs nothing but one GET per refresh.
    url: ""

  # Bearer token the web pod uses when proxying to the controller
  # (so the controller's /api/v1/auth checks pass) and when reading
  # from an authenticated logs service. Reference an existing Secret;
  # the chart does NOT create it. Empty falls back to
  # sparkwing-runner-bundle.controller.tokenSecret, so an install that
  # names only that Secret still gets working log panes; set a name
  # here to give the dashboard its own narrower token.
  tokenSecret:
    name: ""
    key: token

  # Force unauthenticated browsers to /login. Leave false on a
  # fresh install (the tokens table is empty so login would loop);
  # turn on after bootstrapping the admin user.
  requireLogin: false

  # Accept a token-backed dashboard that anyone reaching the service
  # port can drive. Required when the token secret is set and
  # requireLogin is false; the dashboard refuses to start otherwise.
  allowUnauthenticatedRemote: false

  # Proxy source CIDRs allowed to supply X-Forwarded-For. Empty ignores it.
  trustedProxyCIDRs: []

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  extraEnv: []

# -----------------------------------------------------------------------
# 3. Ingress. Optional public ingress for the dashboard. Disabled by
#    default -- many self-host operators front the dashboard with
#    their own Ingress / Gateway / cloud LB and don't want this chart
#    to manage one.
# -----------------------------------------------------------------------
ingress:
  enabled: false
  # IngressClass name. Empty = cluster default.
  className: ""
  annotations: {}
  # - cert-manager.io/cluster-issuer: letsencrypt-prod
  # - nginx.ingress.kubernetes.io/proxy-body-size: 50m
  hosts:
    - host: sparkwing.example.com
      paths:
        - path: /
          pathType: Prefix
  # The render check on this list is presence-only: one entry is enough,
  # and an entry without `secretName` leaves the ingress controller's
  # default certificate to terminate TLS, which is the operator's call.
  tls: []
  # - hosts:
  #     - sparkwing.example.com
  #   secretName: sparkwing-tls

  # Publish the dashboard without TLS or without a login gate. An
  # Ingress exists to expose the dashboard beyond the cluster, so the
  # render fails on `tls: []` or `web.requireLogin: false` until this
  # says the exposure is deliberate. Must be a bool: a quoted string
  # fails the render rather than reading as an opt-out. With `tls: []`
  # the web Deployment also gets `SPARKWING_WEB_INSECURE_COOKIES=1` and
  # `--allow-insecure-cookies-remote`, so a browser can hold a session
  # over plain HTTP.
  allowInsecure: false

# -----------------------------------------------------------------------
# 4. ServiceAccount + RBAC for the controller. The controller needs
#    K8s API access for its warm-PVC pool: namespaces/get, PVC CRUD,
#    pods CRUD, configmaps/events read, plus a small ClusterRole on
#    storage.k8s.io/storageclasses for the startup default-class
#    probe.
#
#    The runner-side SA + RBAC is managed by the sparkwing-runner-bundle
#    sub-chart -- see `sparkwing-runner-bundle.serviceAccount` /
#    `sparkwing-runner-bundle.rbac` below.
# -----------------------------------------------------------------------
serviceAccount:
  # Create a SA for the controller pod (recommended). Set false if
  # you've pre-created one with custom IRSA / Workload Identity
  # annotations.
  create: true
  # Empty + create=true => name generated from .Release.Name.
  name: ""
  # Annotations on the SA. Common case: IRSA (EKS) role binding for
  # ECR pulls, S3 backups, etc.
  annotations: {}

rbac:
  # Create the namespace-scoped Role + RoleBinding for the
  # controller's pool feature. Set false to drop the chart-managed
  # RBAC (e.g. you've pre-applied your own).
  create: true
  # Cluster-scoped read on storage.k8s.io/storageclasses for the
  # startup default-class probe. Without it the controller logs a
  # one-line "skipped: list StorageClasses: forbidden" warning at
  # boot but otherwise functions. Set false in clusters where you
  # can't grant ClusterRole.
  clusterStorageClasses: true

# -----------------------------------------------------------------------
# 5. Image pull secrets applied to controller + web. The runner-side
#    bundle has its own (`sparkwing-runner-bundle.imagePullSecrets`).
# -----------------------------------------------------------------------
imagePullSecrets: []
# - name: ghcr-pull-secret

# -----------------------------------------------------------------------
# 6. Pod-level security defaults. Applied to controller + web
#    unless a per-component override sets its own.
# -----------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
  # Required by the Pod Security "restricted" profile. Drop this only
  # for a workload that needs syscalls the runtime's default profile
  # blocks; the pods this chart runs do not.
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  # Every path the controller and web pods write lives on a mounted
  # volume: /data, the /tmp scratch emptyDir, and SPARKWING_HOME
  # inside it. Set false only for an image that writes to its own
  # layer.
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# safety: Mounted roots must belong to the runtime UID before SPARKWING_HOME becomes owner-only.
# The init requires /bin/chown and violates Restricted Pod Security; disable it only for pre-owned storage.
volumePermissions:
  enabled: true

# -----------------------------------------------------------------------
# 7. Sub-chart: sparkwing-runner-bundle. All values nested here are
#    forwarded as the sub-chart's `.Values`. Defaults below override
#    the sub-chart's own defaults so the runner immediately claims
#    work from the in-cluster controller installed by THIS chart.
#
#    Full schema in charts/sparkwing-runner-bundle/values.yaml.
# -----------------------------------------------------------------------
sparkwing-runner-bundle:
  # Toggles whether this chart deploys the runner side at all. Off
  # if operators want only controller+web in this release (e.g.
  # they're running runners in another cluster).
  enabled: true

  controller:
    # Wire the bundled runner at the bundled controller's Service.
    # An explicit URL still wins when the runner should claim from a
    # different controller.
    url: ""
    bundled: true
    # The controller-token Secret the runner mounts. Empty =
    # unauthenticated to the controller (fine for isolated development;
    # not for shared installs). Pre-create with:
    #   kubectl create secret generic sparkwing-token \
    #     --from-literal=token=<token>
    tokenSecret:
      name: ""
      key: token

  # Sensible defaults for a single-cluster install. Override if you
  # need a beefier runner pool or different label set.
  runner:
    replicas: 1
    labels:
      - cluster
    maxConcurrent: 2
    alsoClaimTriggers: true
    triggerRunner:
      kind: inprocess

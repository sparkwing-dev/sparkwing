{{- $listener := .Values.controller.trustedProxyListener -}}
{{- if $listener.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sparkwing-full.controller.fullname" . }}-trusted-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sparkwing-full.componentLabels" (dict "root" . "component" "controller") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sparkwing-full.componentSelectorLabels" (dict "root" . "component" "controller") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
        {{- if gt (int .Values.controller.metricsPort) 0 }}
        - port: metrics
        {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $listener.namespaceSelector | nindent 14 }}
          {{- with $listener.podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: proxy
{{- end }}

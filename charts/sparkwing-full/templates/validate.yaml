{{- if gt (int .Values.controller.replicas) 1 -}}
{{- fail "sparkwing-full: controller.replicas above 1 is unsupported with the controller's local SQLite state DB. Keep controller.replicas at 1; HA controller is a paid feature" -}}
{{- end -}}
{{- $bundle := index .Values "sparkwing-runner-bundle" -}}
{{- if and (index $bundle "enabled") (or .Values.nameOverride .Values.fullnameOverride) (not (index $bundle "controller" "url")) -}}
{{- fail "sparkwing-full: nameOverride/fullnameOverride changes the controller Service name; set sparkwing-runner-bundle.controller.url explicitly" -}}
{{- end -}}
{{- range $value := list "githubWebhookSecret" "githubStatusToken" -}}
{{- if (get (get $.Values.controller $value | default dict) "name") -}}
{{- fail (printf "sparkwing-full: controller.%s was removed with the per-pipeline GitHub webhook; GitHub triggers come from the GitHub App now. Unset it and follow the migration guide section \"Per-pipeline GitHub webhooks are removed\"" $value) -}}
{{- end -}}
{{- end -}}
{{- if .Values.web -}}
{{- fail "sparkwing-full: web was removed with the sparkwing-web Deployment; the controller serves the dashboard now. Unset web and follow the migration guide section \"The controller serves the dashboard\"" -}}
{{- end -}}
{{- if .Values.controller.logs -}}
{{- fail "sparkwing-full: controller.logs was removed with the sparkwing-logs Deployment; runners upload node logs to the controller now. Unset controller.logs and follow the migration guide section \"The logs service is removed\"" -}}
{{- end -}}
{{- if and .Values.controller.databaseSecret.name (not .Values.controller.databaseSecret.key) -}}
{{- fail "sparkwing-full: controller.databaseSecret.key is required when controller.databaseSecret.name is set" -}}
{{- end -}}
{{- if and .Values.controller.secretsKey.name (not .Values.controller.secretsKey.key) -}}
{{- fail "sparkwing-full: controller.secretsKey.key is required when controller.secretsKey.name is set" -}}
{{- end -}}
{{- if and .Values.controller.secretsPreviousKey.name (not .Values.controller.secretsPreviousKey.key) -}}
{{- fail "sparkwing-full: controller.secretsPreviousKey.key is required when controller.secretsPreviousKey.name is set" -}}
{{- end -}}
{{- if and .Values.controller.secretsPreviousKey.name (not (include "sparkwing-full.controller.hasSecretsKey" .)) -}}
{{- fail "sparkwing-full: controller.secretsPreviousKey.name without a current key gives the controller a key to read old values with and none to write new ones under, which it refuses to start on. Set controller.secretsKey.name to the key values are sealed under now, or put it in controller.credentialsSecret as secrets-key" -}}
{{- end -}}
{{- if and .Values.controller.bootstrapAdminToken.name (not .Values.controller.bootstrapAdminToken.key) -}}
{{- fail "sparkwing-full: controller.bootstrapAdminToken.key is required when controller.bootstrapAdminToken.name is set" -}}
{{- end -}}
{{- if not (kindIs "bool" .Values.controller.allowOpenBootstrap) -}}
{{- fail "sparkwing-full: controller.allowOpenBootstrap must be a bool. A quoted value such as 'false' reads as true to the template, which would silently omit --require-auth" -}}
{{- end -}}
{{- $hasBootstrap := include "sparkwing-full.controller.hasBootstrapAdminToken" . -}}
{{- if and .Values.controller.requireAuth (not $hasBootstrap) (ne .Values.controller.allowOpenBootstrap true) -}}
{{- fail "sparkwing-full: controller.requireAuth=true needs controller.bootstrapAdminToken.name or bootstrap-admin-token in controller.credentialsSecret for a fresh install. controller.allowOpenBootstrap=true permits rendering without one and omits --require-auth; protected routes still require credentials, so provision the administrator out of band before use" -}}
{{- end -}}
{{- if not (kindIs "bool" .Values.ingress.allowInsecure) -}}
{{- fail "sparkwing-full: ingress.allowInsecure must be a bool. A quoted value such as 'false' reads as true to the template, which would silently drop the published-controller guard" -}}
{{- end -}}
{{- if and .Values.ingress.enabled (ne .Values.ingress.allowInsecure true) -}}
{{- if not .Values.ingress.tls -}}
{{- fail "sparkwing-full: ingress.enabled=true with an empty ingress.tls publishes the controller API, its tokens and the dashboard's session cookies over plain HTTP, where anyone on the path can read them. Set ingress.tls, or set ingress.allowInsecure=true to publish it unencrypted anyway, which also passes --insecure-cookies so a browser keeps its session" -}}
{{- end -}}
{{- if not (include "sparkwing-full.controller.rendersRequireAuth" .) -}}
{{- fail "sparkwing-full: ingress.enabled=true with controller.requireAuth=false, or with controller.allowOpenBootstrap=true and no controller.bootstrapAdminToken.name (a credentialsSecret does not count, since the chart cannot see whether it carries one), publishes a controller without the chart's startup credential requirement. Set controller.bootstrapAdminToken.name and keep controller.requireAuth=true, or set ingress.allowInsecure=true to waive this startup guard" -}}
{{- end -}}
{{- end -}}

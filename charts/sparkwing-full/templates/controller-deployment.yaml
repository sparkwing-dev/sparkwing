apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sparkwing-full.controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sparkwing-full.componentLabels" (dict "root" . "component" "controller") | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sparkwing-full.componentSelectorLabels" (dict "root" . "component" "controller") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sparkwing-full.componentSelectorLabels" (dict "root" . "component" "controller") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sparkwing-full.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.volumePermissions.enabled }}
      initContainers:
        - name: volume-permissions
          image: {{ include "sparkwing-full.image" (dict "img" .Values.controller.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          command: ["/bin/chown"]
          args:
            - {{ printf "%d:%d" (int .Values.podSecurityContext.runAsUser) (int .Values.podSecurityContext.fsGroup) | quote }}
            - "/data"
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: controller
          image: {{ include "sparkwing-full.image" (dict "img" .Values.controller.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/usr/local/bin/sparkwing-controller"]
          args:
            - {{ printf "--addr=0.0.0.0:%d" (int .Values.controller.port) | quote }}
            {{- if .Values.controller.pool.enabled }}
            - "--pool"
            {{- if .Values.controller.pool.namespace }}
            - {{ printf "--pool-namespace=%s" .Values.controller.pool.namespace | quote }}
            {{- end }}
            - {{ printf "--warmer-service-account=%s" (include "sparkwing-full.warmerServiceAccountName" .) | quote }}
            {{- end }}
            {{- /*
              Announced so a client with no logs: surface of its own -- a
              laptop running `sparkwing run --profile prod` -- posts node
              log lines to the logs service. The controller serves no
              /api/v1/logs route, and without this a client falls back to
              the controller's URL and every append 404s. The in-cluster
              runner is unaffected: its Deployment passes --logs directly.
            */}}
            {{- $logsURL := include "sparkwing-full.web.logsURL" . }}
            {{- if $logsURL }}
            - {{ printf "--logs-url=%s" $logsURL | quote }}
            {{- end }}
          env:
            - name: SPARKWING_HOME
              value: /data
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.controller.githubWebhookSecret.name }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.githubWebhookSecret.name | quote }}
                  key: {{ .Values.controller.githubWebhookSecret.key | quote }}
            {{- end }}
            {{- if .Values.controller.githubStatusToken.name }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.githubStatusToken.name | quote }}
                  key: {{ .Values.controller.githubStatusToken.key | quote }}
            {{- end }}
            {{- if .Values.controller.dashboardURL }}
            - name: SPARKWING_DASHBOARD_URL
              value: {{ .Values.controller.dashboardURL | quote }}
            {{- end }}
            {{- if .Values.controller.secretsKey.name }}
            - name: SPARKWING_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.secretsKey.name | quote }}
                  key: {{ .Values.controller.secretsKey.key | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: "sparkwing-controller"
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.controller.port }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: data
          {{- if eq .Values.controller.storage.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "sparkwing-full.controller.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}

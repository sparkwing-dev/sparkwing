{{- $credentialSources := include "sparkwing-full.controller.credentialSources" . | trim -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sparkwing-full.controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sparkwing-full.componentLabels" (dict "root" . "component" "controller") | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sparkwing-full.componentSelectorLabels" (dict "root" . "component" "controller") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sparkwing-full.componentSelectorLabels" (dict "root" . "component" "controller") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sparkwing-full.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.volumePermissions.enabled }}
      initContainers:
        - name: volume-permissions
          image: {{ include "sparkwing-full.image" (dict "img" .Values.controller.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          command: ["/bin/chown"]
          args:
            - {{ printf "%d:%d" (int .Values.podSecurityContext.runAsUser) (int .Values.podSecurityContext.fsGroup) | quote }}
            - "/data"
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: controller
          image: {{ include "sparkwing-full.image" (dict "img" .Values.controller.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/usr/local/bin/sparkwing-controller"]
          args:
            - {{ printf "--addr=0.0.0.0:%d" (int .Values.controller.port) | quote }}
            {{- /*
              Announced so a client with no logs: surface of its own -- a
              laptop running `sparkwing run --profile prod` -- posts node
              log lines to the logs service. The controller accepts no log
              appends, and without this a client falls back to the
              controller's URL and every append 404s. The dashboard's log
              panes read through the same service. The in-cluster runner
              is unaffected: its Deployment passes --logs directly.
            */}}
            {{- $logsURL := include "sparkwing-full.controller.logsURL" . }}
            {{- if $logsURL }}
            - {{ printf "--logs-url=%s" $logsURL | quote }}
            {{- end }}
            {{- with .Values.controller.dashboardURL }}
            - {{ printf "--dashboard-url=%s" . | quote }}
            {{- end }}
            {{- with (include "sparkwing-full.controller.cacheURL" .) }}
            - {{ printf "--cache-url=%s" . | quote }}
            {{- end }}
            {{- with .Values.controller.argon2MemoryBudgetMB }}
            - {{ printf "--argon2-memory-budget-mb=%d" (int .) | quote }}
            {{- end }}
            {{- with .Values.controller.defaultPreferLabels }}
            - {{ printf "--default-prefer-labels=%s" (join "," .) | quote }}
            {{- end }}
            {{- with .Values.controller.placementHold }}
            - {{ printf "--placement-hold=%s" . | quote }}
            {{- end }}
            {{- with .Values.controller.placementLiveness }}
            - {{ printf "--placement-liveness=%s" . | quote }}
            {{- end }}
            {{- with .Values.controller.maxRunsPerPrincipalHour }}
            - {{ printf "--max-runs-per-principal-hour=%d" (int .) | quote }}
            {{- end }}
            {{- with .Values.controller.shedQueueDepth }}
            - {{ printf "--shed-queue-depth=%d" (int .) | quote }}
            {{- end }}
            {{- with .Values.controller.triggerDedupeWindow }}
            - {{ printf "--trigger-dedupe-window=%s" . | quote }}
            {{- end }}
            {{- with .Values.controller.claimsPerRunnerMinute }}
            - {{ printf "--claims-per-runner-minute=%d" (int .) | quote }}
            {{- end }}
            {{- with .Values.controller.heartbeatsPerRunnerMinute }}
            - {{ printf "--heartbeats-per-runner-minute=%d" (int .) | quote }}
            {{- end }}
            {{- with .Values.controller.requestsPerTokenMinute }}
            - {{ printf "--requests-per-token-minute=%d" (int .) | quote }}
            {{- end }}
            {{- with .Values.controller.requestsPerMinuteAlarm }}
            - {{ printf "--requests-per-minute-alarm=%d" (int .) | quote }}
            {{- end }}
            {{- with .Values.controller.idleClaimPoll }}
            - {{ printf "--idle-claim-poll=%s" . | quote }}
            {{- end }}
            {{- with .Values.controller.limitsProfile }}
            - {{ printf "--limits-profile=%s" . | quote }}
            {{- end }}
            {{- $bucket := .Values.controller.bucketCeiling | default dict }}
            {{- range $limit := list
                  (dict "flag" "--max-bucket-bytes" "value" $bucket.maxBytes)
                  (dict "flag" "--max-bucket-objects" "value" $bucket.maxObjects)
                  (dict "flag" "--warn-bucket-bytes" "value" $bucket.warnBytes)
                  (dict "flag" "--warn-bucket-objects" "value" $bucket.warnObjects)
                  (dict "flag" "--bucket-reconcile" "value" $bucket.reconcile)
                  (dict "flag" "--bucket-store" "value" $bucket.store)
                  (dict "flag" "--bucket-measure-pages" "value" $bucket.measurePages) }}
            {{- $value := $limit.value }}
            {{- if not (kindIs "invalid" $value) }}
            {{- if ne (toString $value) "" }}
            - {{ printf "%s=%s" $limit.flag (toString $value) | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if and .Values.ingress.enabled .Values.ingress.tls }}
            - "--hsts"
            {{- end }}
            {{- if and .Values.ingress.enabled (not .Values.ingress.tls) (kindIs "bool" .Values.ingress.allowInsecure) .Values.ingress.allowInsecure }}
            - "--insecure-cookies"
            {{- end }}
            {{- if gt (int .Values.controller.metricsPort) 0 }}
            - {{ printf "--metrics-addr=:%d" (int .Values.controller.metricsPort) | quote }}
            {{- end }}
            {{- if and .Values.controller.requireAuth (or .Values.controller.bootstrapAdminToken.name (ne .Values.controller.allowOpenBootstrap true)) }}
            - "--require-auth"
            {{- end }}
            {{- /*
              Every secret arrives as a file in one projected volume rather
              than an environment variable: an environment entry is readable
              through /proc and is inherited by anything the container execs.
            */}}
            {{- if $credentialSources }}
            - "--credentials-dir=/etc/sparkwing/credentials"
            {{- end }}
          env:
            - name: SPARKWING_HOME
              value: /data
            - name: OTEL_SERVICE_NAME
              value: "sparkwing-controller"
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.controller.port }}
            {{- if gt (int .Values.controller.metricsPort) 0 }}
            - name: metrics
              containerPort: {{ .Values.controller.metricsPort }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scratch
              mountPath: /tmp
            {{- if $credentialSources }}
            - name: credentials
              mountPath: /etc/sparkwing/credentials
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: data
          {{- if eq .Values.controller.storage.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "sparkwing-full.controller.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: scratch
          emptyDir: {}
        {{- if $credentialSources }}
        - name: credentials
          projected:
            defaultMode: 0400
            sources:
              {{- $credentialSources | nindent 14 }}
        {{- end }}

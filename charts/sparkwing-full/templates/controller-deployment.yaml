apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sparkwing-full.controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sparkwing-full.componentLabels" (dict "root" . "component" "controller") | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sparkwing-full.componentSelectorLabels" (dict "root" . "component" "controller") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sparkwing-full.componentSelectorLabels" (dict "root" . "component" "controller") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sparkwing-full.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.volumePermissions.enabled }}
      initContainers:
        - name: volume-permissions
          image: {{ include "sparkwing-full.image" (dict "img" .Values.controller.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          command: ["/bin/chown"]
          args:
            - {{ printf "%d:%d" (int .Values.podSecurityContext.runAsUser) (int .Values.podSecurityContext.fsGroup) | quote }}
            - "/data"
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: controller
          image: {{ include "sparkwing-full.image" (dict "img" .Values.controller.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/usr/local/bin/sparkwing-controller"]
          args:
            - {{ printf "--addr=0.0.0.0:%d" (int .Values.controller.port) | quote }}
            {{- if .Values.controller.pool.enabled }}
            - "--pool"
            {{- if .Values.controller.pool.namespace }}
            - {{ printf "--pool-namespace=%s" .Values.controller.pool.namespace | quote }}
            {{- end }}
            - {{ printf "--warmer-service-account=%s" (include "sparkwing-full.warmerServiceAccountName" .) | quote }}
            {{- end }}
            {{- /*
              Announced so a client with no logs: surface of its own -- a
              laptop running `sparkwing run --profile prod` -- posts node
              log lines to the logs service. The controller serves no
              /api/v1/logs route, and without this a client falls back to
              the controller's URL and every append 404s. The in-cluster
              runner is unaffected: its Deployment passes --logs directly.
            */}}
            {{- $logsURL := include "sparkwing-full.web.logsURL" . }}
            {{- if $logsURL }}
            - {{ printf "--logs-url=%s" $logsURL | quote }}
            {{- end }}
            {{- with .Values.controller.trustedProxyCIDRs }}
            - {{ printf "--trusted-proxy-cidrs=%s" (join "," .) | quote }}
            {{- end }}
            {{- with .Values.controller.argon2MemoryBudgetMB }}
            - {{ printf "--argon2-memory-budget-mb=%d" (int .) | quote }}
            {{- end }}
            {{- with .Values.controller.defaultPreferLabels }}
            - {{ printf "--default-prefer-labels=%s" (join "," .) | quote }}
            {{- end }}
            {{- with .Values.controller.placementHold }}
            - {{ printf "--placement-hold=%s" . | quote }}
            {{- end }}
            {{- with .Values.controller.placementLiveness }}
            - {{ printf "--placement-liveness=%s" . | quote }}
            {{- end }}
            {{- with .Values.controller.maxRunsPerPrincipalHour }}
            - {{ printf "--max-runs-per-principal-hour=%d" (int .) | quote }}
            {{- end }}
            {{- with .Values.controller.shedQueueDepth }}
            - {{ printf "--shed-queue-depth=%d" (int .) | quote }}
            {{- end }}
            {{- with .Values.controller.triggerDedupeWindow }}
            - {{ printf "--trigger-dedupe-window=%s" . | quote }}
            {{- end }}
            {{- with .Values.controller.claimsPerRunnerMinute }}
            - {{ printf "--claims-per-runner-minute=%d" (int .) | quote }}
            {{- end }}
            {{- with .Values.controller.heartbeatsPerRunnerMinute }}
            - {{ printf "--heartbeats-per-runner-minute=%d" (int .) | quote }}
            {{- end }}
            {{- with .Values.controller.idleClaimPoll }}
            - {{ printf "--idle-claim-poll=%s" . | quote }}
            {{- end }}
            {{- if gt (int .Values.controller.metricsPort) 0 }}
            - {{ printf "--metrics-addr=:%d" (int .Values.controller.metricsPort) | quote }}
            {{- end }}
            {{- if .Values.controller.requireAuth }}
            - "--require-auth"
            {{- end }}
            {{- /*
              The key and the first admin token arrive as mounted files
              rather than environment variables: an environment entry is
              readable through /proc and is inherited by anything the
              container execs, while a file is read once at startup.
            */}}
            {{- if .Values.controller.secretsKey.name }}
            - {{ printf "--secrets-key-file=%s/%s" (include "sparkwing-full.controller.secretsKeyDir" .) .Values.controller.secretsKey.key | quote }}
            {{- end }}
            {{- if .Values.controller.secretsPreviousKey.name }}
            - {{ printf "--secrets-previous-key-file=%s/%s" (include "sparkwing-full.controller.secretsPreviousKeyDir" .) .Values.controller.secretsPreviousKey.key | quote }}
            {{- end }}
            {{- if .Values.controller.bootstrapAdminToken.name }}
            - {{ printf "--bootstrap-admin-token-file=%s/%s" (include "sparkwing-full.controller.bootstrapAdminTokenDir" .) .Values.controller.bootstrapAdminToken.key | quote }}
            {{- end }}
          env:
            - name: SPARKWING_HOME
              value: /data
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.controller.githubWebhookSecret.name }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.githubWebhookSecret.name | quote }}
                  key: {{ .Values.controller.githubWebhookSecret.key | quote }}
            {{- end }}
            {{- if .Values.controller.githubStatusToken.name }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.githubStatusToken.name | quote }}
                  key: {{ .Values.controller.githubStatusToken.key | quote }}
            {{- end }}
            {{- if .Values.controller.dashboardURL }}
            - name: SPARKWING_DASHBOARD_URL
              value: {{ .Values.controller.dashboardURL | quote }}
            {{- end }}
            {{- with (include "sparkwing-full.controller.cacheURL" .) }}
            - name: SPARKWING_CACHE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- $bundle := index .Values "sparkwing-runner-bundle" }}
            {{- $bundleToken := index $bundle "controller" "tokenSecret" }}
            {{- if and (index $bundle "enabled") (index $bundle "cache" "enabled") (index $bundleToken "name") (index $bundleToken "key") }}
            - name: SPARKWING_CACHE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ index $bundleToken "name" | quote }}
                  key: {{ index $bundleToken "key" | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: "sparkwing-controller"
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.controller.port }}
            {{- if gt (int .Values.controller.metricsPort) 0 }}
            - name: metrics
              containerPort: {{ .Values.controller.metricsPort }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scratch
              mountPath: /tmp
            {{- if .Values.controller.secretsKey.name }}
            - name: secrets-key
              mountPath: {{ include "sparkwing-full.controller.secretsKeyDir" . | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.controller.secretsPreviousKey.name }}
            - name: secrets-previous-key
              mountPath: {{ include "sparkwing-full.controller.secretsPreviousKeyDir" . | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.controller.bootstrapAdminToken.name }}
            - name: bootstrap-admin-token
              mountPath: {{ include "sparkwing-full.controller.bootstrapAdminTokenDir" . | quote }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: data
          {{- if eq .Values.controller.storage.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "sparkwing-full.controller.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: scratch
          emptyDir: {}
        {{- if .Values.controller.secretsKey.name }}
        - name: secrets-key
          secret:
            secretName: {{ .Values.controller.secretsKey.name | quote }}
        {{- end }}
        {{- if .Values.controller.secretsPreviousKey.name }}
        - name: secrets-previous-key
          secret:
            secretName: {{ .Values.controller.secretsPreviousKey.name | quote }}
        {{- end }}
        {{- if .Values.controller.bootstrapAdminToken.name }}
        - name: bootstrap-admin-token
          secret:
            secretName: {{ .Values.controller.bootstrapAdminToken.name | quote }}
        {{- end }}

# Apply before the Helm release. The aws-ssm ClusterSecretStore already exists.
# These are parameter paths, not secret values. Adjust paths and CRD version.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkwing-database
  namespace: sparkwing
spec:
  refreshInterval: 1h
  secretStoreRef: {name: aws-ssm, kind: ClusterSecretStore}
  target: {name: sparkwing-database}
  data:
    - secretKey: dsn
      remoteRef: {key: /sparkwing/cloud/database-dsn}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkwing-bootstrap-admin
  namespace: sparkwing
spec:
  refreshInterval: 1h
  secretStoreRef: {name: aws-ssm, kind: ClusterSecretStore}
  target: {name: sparkwing-bootstrap-admin}
  data:
    - secretKey: token
      remoteRef: {key: /sparkwing/cloud/bootstrap-admin-token}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkwing-secrets-key
  namespace: sparkwing
spec:
  refreshInterval: 1h
  secretStoreRef: {name: aws-ssm, kind: ClusterSecretStore}
  target: {name: sparkwing-secrets-key}
  data:
    - secretKey: key
      remoteRef: {key: /sparkwing/cloud/secrets-key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkwing-credentials
  namespace: sparkwing
spec:
  refreshInterval: 1h
  secretStoreRef: {name: aws-ssm, kind: ClusterSecretStore}
  target: {name: sparkwing-credentials}
  data:
    - secretKey: license
      remoteRef: {key: /sparkwing/cloud/license}
    - secretKey: github-client-secret
      remoteRef: {key: /sparkwing/cloud/github-client-secret}
    - secretKey: google-client-secret
      remoteRef: {key: /sparkwing/cloud/google-client-secret}
    - secretKey: github-app-key
      remoteRef: {key: /sparkwing/cloud/github-app-key}
    - secretKey: github-app-webhook-secret
      remoteRef: {key: /sparkwing/cloud/github-app-webhook-secret}
    - secretKey: cloudfront-key
      remoteRef: {key: /sparkwing/cloud/cloudfront-key}
    - secretKey: oidc-key
      remoteRef: {key: /sparkwing/cloud/oidc-key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkwing-launcher-token
  namespace: sparkwing
spec:
  refreshInterval: 1h
  secretStoreRef: {name: aws-ssm, kind: ClusterSecretStore}
  target: {name: sparkwing-launcher-token}
  data:
    - secretKey: token
      remoteRef: {key: /sparkwing/cloud/launcher-token}

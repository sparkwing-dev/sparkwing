# Get the team hash with sparkwing operator teams show --team <team> -o json.
# This pool requires an existing EC2NodeClass named sparkwing-jobs.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: sparkwing-jobs-small
spec:
  # consolidateAfter must exceed the 3-minute award lease, or a node emptied by
  # a launcher restart can be removed before its job is re-awarded.
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
  template:
    metadata:
      labels:
        node-restriction.kubernetes.io/sparkwing-team-node: sha256-REPLACE_WITH_TEAM_HASH
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: sparkwing-jobs
      taints:
        - key: sparkwing.dev/cpu-band
          value: small
          effect: NoSchedule
        - key: node-restriction.kubernetes.io/sparkwing-team-node
          value: sha256-REPLACE_WITH_TEAM_HASH
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: kubernetes.io/arch
          operator: In
          values: [amd64, arm64]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]

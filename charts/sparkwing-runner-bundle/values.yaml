# Default values for sparkwing-runner-bundle.
#
# Override anything below with `helm install ... --set key=value` or
# `-f my-values.yaml`. This chart version has no compatible public image
# default. In addition to controller.url, explicitly set repository and
# tag for every enabled image to a mutually compatible build or mirror
# until a corrected release is published.
#
# Sections, in roughly the order operators care about:
#   1. controller.*          -- where to claim work from
#   2. runner.*              -- the work-claiming pool
#   4. serviceAccount.*      -- shared SA for runner pods
#   5. secrets.*             -- references to pre-created Secrets
#   6. image / imagePullSecrets -- shared image policy

# -----------------------------------------------------------------------
# 1. Controller (the orchestrator this runner pool claims work from).
# -----------------------------------------------------------------------
controller:
  # REQUIRED. URL the runner uses to claim triggers / nodes. Must be
  # reachable from inside the cluster. Typical values:
  #   https://api.sparkwing.dev                (Sparkwing Cloud)
  #   http://sparkwing-controller.sparkwing.svc.cluster.local
  #     (in-cluster controller, e.g. enterprise self-host)
  url: ""

  # Set by the sparkwing-full parent chart so an empty URL resolves
  # to that release's in-cluster controller Service. Standalone
  # installs should leave this false and set url explicitly.
  bundled: false

  # Machine root credential for controller claims. Node log uploads use
  # the awarded claim authority. Reference an existing Secret created
  # out of band so it can rotate independently of Helm.
  tokenSecret:
    # Name of the Secret in the install namespace.
    name: ""
    # Key inside the Secret holding the bearer token.
    key: token

# Cloud launcher. Jobs use a separate identity and digest-pinned images.
launcher:
  enabled: false
  serviceAccountName: ""
  # Cloud Jobs run in this dedicated namespace, <release namespace>-cloud-jobs
  # when empty. Its admission policies admit only launcher-created Pods and Jobs.
  # Keep other NetworkPolicies and Pod Security labels out of it.
  jobNamespace: ""
  # The chart owns the job namespace. Disable only when the namespace is
  # created elsewhere with privileged Pod Security and nothing else in it.
  createNamespace: true
  image:
    pullPolicy: IfNotPresent
  tokenSecret:
    name: ""
    key: token
  jobImage: {}
  # docker:<version>-dind, digest-pinned. It runs as root of the Job Pod's user
  # namespace with namespaced capabilities, never privileged.
  dockerImage: {}
  cpuCeiling: ""
  memoryCeiling: ""
  # Keep at or above the controller's --idle-claim-poll (5s by default), which
  # refuses faster idle polls under the Cloud limits profile.
  pollInterval: 5s
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Default-deny selects customer Jobs and measurement probes. Explicitly allow
  # required destinations through egress rules. Node-level enforcement is external.
  networkPolicy:
    egress: []

# -----------------------------------------------------------------------
# 2. Runner pool. Long-lived pods that poll the controller, claim
#    triggers + nodes, and execute pipeline DAGs.
# -----------------------------------------------------------------------
runner:
  enabled: true
  repos: []

  # Pool size. RollingUpdate strategy means a `helm upgrade` doesn't
  # drop all pods at once; one in-flight claim's worth of work may
  # need to retry but the pool stays available.
  replicas: 2

  image:
    # Set repository and tag from one compatible build. Both are required.
    pullPolicy: IfNotPresent

  # --label flags advertised to the controller for Requires matching.
  # Each label entry can be a bare tag ("cluster") or a key=value
  # ("arch=arm64"). Pipelines call .Requires("cluster") /
  # .Requires("arch=arm64") to pin to this pool.
  labels:
    - cluster

  # Maximum concurrent units per runner pod. Size for the CPU and memory
  # required by the pipeline workloads.
  maxConcurrent: 2

  # Poll interval for the controller claim loop. 500ms is the prod
  # default; raise to 2s+ if you have many pools and want to spread
  # request load.
  pollInterval: 500ms

  # --max-claims-before-restart: kubelet-restart the pod after N
  # successful claims to shed accumulated goroutines / drift / cached
  # state from previous jobs. 0 disables.
  maxClaimsBeforeRestart: 25

  # Runs this pool takes work from. Empty takes the controller default: a
  # pool that holds a secret reserved to it takes only verified pushes to the
  # repository's default branch, and any other pool takes any run.
  # "verified-default" or "any" overrides the default.
  trust: ""
  # Environment names a requester's run.submit_env_allow may deliver to this
  # pool's jobs. Go-toolchain and network names are refused regardless; empty
  # accepts no submitted values.
  submitEnvAllow: []
  # When true, this pool also claims TRIGGERS (the webhook-side
  # workflow that turns a push into a Run). Single-pool deployments
  # want this on. Multi-pool deployments typically dedicate one pool
  # to trigger-claiming and leave the others node-only.
  alsoClaimTriggers: true

  # The runner claims through the controller and needs no Kubernetes API token.
  automountServiceAccountToken: false

  # Optional metrics scrape port. The Prometheus client registry on
  # the runner serves /metrics here. Disable by setting to 0.
  metricsPort: 9090

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  # Go build and module caches reused by source compilation on this runner.
  goCache:
    # Modules the runner downloads into GOMODCACHE at startup, passed as
    # --warm-module. Empty warms the Sparkwing SDK at the runner image's
    # own version, which is most of a pipeline's dependency graph. Each
    # entry may carry an @version ("example.com/mod@v1.2.3", and
    # similar); a bare path resolves at download time. ["off"] starts the
    # pool with no warm.
    warmModules: []

    persistence:
      # true mounts a PersistentVolumeClaim over GOCACHE and GOMODCACHE,
      # so the caches outlive the pod that filled them.
      # runner.maxClaimsBeforeRestart restarts a pod often, and every
      # restart that reschedules it starts from empty caches without
      # this. Off by default: it needs a StorageClass, and a claim no
      # class can bind leaves the whole pool Pending.
      enabled: false
      # Mount this pre-created claim instead of one the chart creates.
      existingClaim: ""
      size: 20Gi
      # Empty = the cluster default StorageClass.
      storageClassName: ""
      # Every runner replica mounts the one claim, so the class must
      # serve ReadWriteMany whenever runner.replicas is above 1; the
      # chart refuses to render otherwise. The go command locks both
      # caches, so replicas can share them and one pod's compile warms
      # the pool. Every job on the pool can write them, so a pool that
      # serves untrusted branches should not share a claim with one that
      # holds deployment secrets.
      accessModes:
        - ReadWriteMany
      # helm uninstall keeps the claim (annotation
      # helm.sh/resource-policy=keep). false deletes it with the release.
      keepOnUninstall: true

  # Optional Pod-level scheduling controls. Empty = no constraints.
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Extra env passed to the runner container. Useful for forwarding
  # AWS_REGION, GOPRIVATE, DOCKER_HOST, etc. An entry here also
  # supplies the named environment value to the runner.
  extraEnv: []
  # - name: GOPRIVATE
  #   value: github.com/your-org

  # Extra volume mounts (e.g. ssh keys, custom CA bundles).
  extraVolumes: []
  extraVolumeMounts: []

# -----------------------------------------------------------------------
# 4. ServiceAccount. Runners use controller HTTP without Kubernetes permissions.
# -----------------------------------------------------------------------
serviceAccount:
  # Create one (true) or use an existing SA you've already RBAC'd.
  create: true
  # Names the runner SA; empty + create=true => generated from
  # .Release.Name.
  name: ""
  # Annotations on the SA. Common case: IRSA (EKS) role binding for
  # ECR / S3 access on the runner side.
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123:role/sparkwing-runner
  annotations: {}

# -----------------------------------------------------------------------
# 5. Image pull secrets for the runner.
# -----------------------------------------------------------------------
imagePullSecrets: []
# - name: ghcr-pull-secret

volumePermissions:
  enabled: true

# -----------------------------------------------------------------------
# 6. Runner pod security defaults.
# -----------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
  # Required by the Pod Security "restricted" profile. Drop this only
  # for a workload that needs syscalls the runtime's default profile
  # blocks; the pods this chart runs do not.
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  # Set false only for an image that writes outside the mounted scratch,
  # Sparkwing home and Go cache paths.
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# -----------------------------------------------------------------------
# 7. Namespace resource guards. A LimitRange bounds one container,
#    a ResourceQuota bounds the
#    namespace total. Both are off by default because an install that
#    already sizes its pods elsewhere would start failing admission the
#    moment a quota appears.
# -----------------------------------------------------------------------
limitRange:
  # true creates the LimitRange below. Every container in the namespace,
  # including Jobs from a launcher using this namespace, is then held
  # to it: a pod asking for more than max is rejected at admission.
  enabled: false
  # Size the ceiling above the runner pods' own limits.
  max:
    cpu: "16"
    memory: 64Gi
  # Floor for one container. A pod asking for less is rejected, which is
  # what stops a pipeline pinning a sliver of a core that no quota counts.
  # Empty leaves containers free to ask for anything.
  min:
    cpu: 10m
    memory: 16Mi
  # Limits given to a container that declares none.
  default:
    cpu: "2"
    memory: 2Gi
  # Requests given to a container that declares none.
  defaultRequest:
    cpu: 100m
    memory: 128Mi

resourceQuota:
  # true creates the ResourceQuota below. Once it exists, every pod in
  # the namespace must declare the requests and limits it counts, so
  # this requires limitRange.enabled=true for its default and
  # defaultRequest; the chart refuses to render without it.
  enabled: false
  # Namespace totals, passed through verbatim as spec.hard. Add object
  # counts (pods, persistentvolumeclaims) here when you want them.
  hard:
    requests.cpu: "32"
    requests.memory: 64Gi
    limits.cpu: "64"
    limits.memory: 128Gi

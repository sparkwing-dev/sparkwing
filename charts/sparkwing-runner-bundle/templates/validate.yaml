{{- if and .Values.controller.tokenSecret.name (not .Values.controller.tokenSecret.key) -}}
{{- fail "sparkwing-runner-bundle: controller.tokenSecret.key is required when controller.tokenSecret.name is set" -}}
{{- end -}}
{{- if and .Values.cache.enabled (not .Values.controller.tokenSecret.name) (not .Values.cache.allowUnauthenticated) -}}
{{- fail "sparkwing-runner-bundle: cache.enabled=true requires controller.tokenSecret.name, the Secret the cache reads SPARKWING_API_TOKEN from and the runner reads SPARKWING_CACHE_TOKEN from. Set cache.allowUnauthenticated=true to serve the cache to anyone who can reach it instead" -}}
{{- end -}}
{{- if and .Values.cache.enabled (ne .Values.cache.service.type "ClusterIP") (or .Values.cache.allowUnauthenticated (not .Values.controller.tokenSecret.name)) -}}
{{- fail (printf "sparkwing-runner-bundle: cache.service.type=%s publishes the cache outside the cluster with no bearer token on its routes. Set cache.service.type=ClusterIP, or set controller.tokenSecret.name and leave cache.allowUnauthenticated=false" .Values.cache.service.type) -}}
{{- end -}}
{{- if and .Values.logs.enabled (not .Values.controller.tokenSecret.name) (not .Values.logs.allowUnauthenticated) -}}
{{- fail "sparkwing-runner-bundle: logs.enabled=true requires controller.tokenSecret.name, the Secret whose bearer the logs service resolves against the controller before it serves a log route. Set logs.allowUnauthenticated=true to let anyone who can reach the Service read, forge, and delete every run's logs instead" -}}
{{- end -}}
{{- $externalGitcache := false -}}
{{- range .Values.runner.extraEnv -}}
{{- if eq (default "" .name) "SPARKWING_GITCACHE_URL" -}}
{{- if or (and (hasKey . "value") (not (empty .value))) (and (hasKey . "valueFrom") (not (empty .valueFrom))) -}}
{{- $externalGitcache = true -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and .Values.runner.alsoClaimTriggers (not .Values.cache.enabled) (not $externalGitcache) -}}
{{- fail "sparkwing-runner-bundle: runner.alsoClaimTriggers=true requires cache.enabled=true or runner.extraEnv SPARKWING_GITCACHE_URL with an external gitcache URL" -}}
{{- end -}}
{{- if not (has .Values.runner.triggerRunner.kind (list "inprocess" "k8s" "warm")) -}}
{{- fail "sparkwing-runner-bundle: runner.triggerRunner.kind must be inprocess, k8s, or warm" -}}
{{- end -}}
{{- if and (ne .Values.runner.triggerRunner.kind "inprocess") (not .Values.runner.alsoClaimTriggers) -}}
{{- fail "sparkwing-runner-bundle: runner.triggerRunner.kind k8s or warm requires runner.alsoClaimTriggers=true" -}}
{{- end -}}
{{- if and .Values.runner.alsoClaimTriggers (ne .Values.runner.triggerRunner.kind "inprocess") (not .Values.runner.automountServiceAccountToken) -}}
{{- fail "sparkwing-runner-bundle: runner.triggerRunner.kind k8s or warm requires runner.automountServiceAccountToken=true so the trigger worker can create and inspect fallback Jobs" -}}
{{- end -}}
{{- if and (not .Values.serviceAccount.create) (not .Values.serviceAccount.shareAcrossComponents) -}}
{{- fail "sparkwing-runner-bundle: serviceAccount.create=false puts the runner, cache, and logs pods on one ServiceAccount; set serviceAccount.shareAcrossComponents=true to accept that, or leave create=true for one account per component" -}}
{{- end -}}

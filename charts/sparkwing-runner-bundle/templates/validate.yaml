{{- if and .Values.controller.tokenSecret.name (not .Values.controller.tokenSecret.key) -}}
{{- fail "sparkwing-runner-bundle: controller.tokenSecret.key is required when controller.tokenSecret.name is set" -}}
{{- end -}}
{{- if .Values.logs -}}
{{- fail "sparkwing-runner-bundle: logs was removed with the sparkwing-logs Deployment; runners upload node logs to the controller now. Unset logs and follow the migration guide section \"The logs service is removed\"" -}}
{{- end -}}
{{- if and .Values.resourceQuota.enabled (not .Values.limitRange.enabled) -}}
{{- fail "sparkwing-runner-bundle: resourceQuota.enabled=true requires limitRange.enabled=true, whose default and defaultRequest give a pod that declares no resources something for the quota to count. Without it the API server rejects every such pod in the namespace" -}}
{{- end -}}
{{- if and .Values.runner.enabled (not .Values.launcher.enabled) .Values.runner.goCache.persistence.enabled (gt (int .Values.runner.replicas) 1) (not (has "ReadWriteMany" .Values.runner.goCache.persistence.accessModes)) -}}
{{- fail (printf "sparkwing-runner-bundle: runner.goCache.persistence with runner.replicas=%d needs ReadWriteMany in runner.goCache.persistence.accessModes, because every replica mounts the one claim. Set runner.replicas=1 to keep a ReadWriteOnce volume" (int .Values.runner.replicas)) -}}
{{- end -}}

{{- if and .Values.controller.tokenSecret.name (not .Values.controller.tokenSecret.key) -}}
{{- fail "sparkwing-runner-bundle: controller.tokenSecret.key is required when controller.tokenSecret.name is set" -}}
{{- end -}}
{{- if and .Values.cache.tokenSecret.name (not .Values.cache.tokenSecret.key) -}}
{{- fail "sparkwing-runner-bundle: cache.tokenSecret.key is required when cache.tokenSecret.name is set" -}}
{{- end -}}
{{- if and .Values.cache.grantKeySecret.name (not .Values.cache.grantKeySecret.key) -}}
{{- fail "sparkwing-runner-bundle: cache.grantKeySecret.key is required when cache.grantKeySecret.name is set" -}}
{{- end -}}
{{- if and .Values.cache.enabled (not .Values.cache.tokenSecret.name) (not .Values.cache.allowUnauthenticated) -}}
{{- fail "sparkwing-runner-bundle: cache.enabled=true requires cache.tokenSecret.name, the Secret the cache reads its operator token (SPARKWING_API_TOKEN) from. Set cache.allowUnauthenticated=true to serve the cache to anyone who can reach it instead" -}}
{{- end -}}
{{- if and .Values.cache.enabled (ne .Values.cache.service.type "ClusterIP") (or .Values.cache.allowUnauthenticated (not .Values.cache.tokenSecret.name)) -}}
{{- fail (printf "sparkwing-runner-bundle: cache.service.type=%s publishes the cache outside the cluster with no bearer token on its routes. Set cache.service.type=ClusterIP, or set cache.tokenSecret.name and leave cache.allowUnauthenticated=false" .Values.cache.service.type) -}}
{{- end -}}
{{- if and .Values.cache.enabled (ne .Values.cache.service.type "ClusterIP") .Values.cache.dependencyProxy.enabled -}}
{{- fail (printf "sparkwing-runner-bundle: cache.service.type=%s publishes the cache outside the cluster, and its registry proxy takes no credential. Set cache.dependencyProxy.enabled=false to serve no proxy, or keep cache.service.type=ClusterIP" .Values.cache.service.type) -}}
{{- end -}}
{{- $cacheSecrets := list
      (dict "value" "controller.tokenSecret" "ref" .Values.controller.tokenSecret)
      (dict "value" "cache.tokenSecret" "ref" .Values.cache.tokenSecret)
      (dict "value" "cache.grantKeySecret" "ref" .Values.cache.grantKeySecret) -}}
{{- range $i, $a := $cacheSecrets -}}
{{- range $j, $b := $cacheSecrets -}}
{{- if and (lt $i $j) $a.ref.name (eq $a.ref.name $b.ref.name) (eq (toString $a.ref.key) (toString $b.ref.key)) -}}
{{- fail (printf "sparkwing-runner-bundle: %s and %s both read Secret %s key %s. Each must name a different Secret key: pipeline code can read the runner's token, the cache's operator token opens every team's tree, and the grant key signs access to any team's tree" $a.value $b.value $a.ref.name (toString $a.ref.key)) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and .Values.logs.enabled (not .Values.controller.tokenSecret.name) (not .Values.logs.allowUnauthenticated) -}}
{{- fail "sparkwing-runner-bundle: logs.enabled=true requires controller.tokenSecret.name, the Secret whose bearer the logs service resolves against the controller before it serves a log route. Set logs.allowUnauthenticated=true to let anyone who can reach the Service read, forge, and delete every run's logs instead" -}}
{{- end -}}
{{- if not (has .Values.runner.triggerRunner.kind (list "inprocess" "k8s" "warm")) -}}
{{- fail "sparkwing-runner-bundle: runner.triggerRunner.kind must be inprocess, k8s, or warm" -}}
{{- end -}}
{{- if and (ne .Values.runner.triggerRunner.kind "inprocess") (not .Values.runner.alsoClaimTriggers) -}}
{{- fail "sparkwing-runner-bundle: runner.triggerRunner.kind k8s or warm requires runner.alsoClaimTriggers=true" -}}
{{- end -}}
{{- if and .Values.runner.alsoClaimTriggers (ne .Values.runner.triggerRunner.kind "inprocess") (not .Values.runner.automountServiceAccountToken) -}}
{{- fail "sparkwing-runner-bundle: runner.triggerRunner.kind k8s or warm requires runner.automountServiceAccountToken=true so the trigger worker can create and inspect fallback Jobs" -}}
{{- end -}}
{{- if and (not .Values.serviceAccount.create) (not .Values.serviceAccount.shareAcrossComponents) -}}
{{- fail "sparkwing-runner-bundle: serviceAccount.create=false puts the runner, cache, and logs pods on one ServiceAccount; set serviceAccount.shareAcrossComponents=true to accept that, or leave create=true for one account per component" -}}
{{- end -}}
{{- if and .Values.resourceQuota.enabled (not .Values.limitRange.enabled) -}}
{{- fail "sparkwing-runner-bundle: resourceQuota.enabled=true requires limitRange.enabled=true, whose default and defaultRequest give a pod that declares no resources something for the quota to count. Without it the API server rejects every such pod in the namespace" -}}
{{- end -}}
{{- if and .Values.runner.goCache.persistence.enabled (gt (int .Values.runner.replicas) 1) (not (has "ReadWriteMany" .Values.runner.goCache.persistence.accessModes)) -}}
{{- fail (printf "sparkwing-runner-bundle: runner.goCache.persistence with runner.replicas=%d needs ReadWriteMany in runner.goCache.persistence.accessModes, because every replica mounts the one claim. Set runner.replicas=1 to keep a ReadWriteOnce volume" (int .Values.runner.replicas)) -}}
{{- end -}}

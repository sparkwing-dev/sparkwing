{{- if .Values.launcher.serviceAccountName }}
{{- $name := printf "sparkwing-cloud-exemption-%s" .Release.Namespace }}
{{- $excluded := printf "has(s.matchExpressions) && s.matchExpressions.exists(e, e.key == 'kubernetes.io/metadata.name' && e.operator == 'NotIn' && %q in e.values)" .Release.Namespace }}
{{- $webhookExclusion := printf "has(w.namespaceSelector) && [w.namespaceSelector].exists(s, %s)" $excluded }}
{{- $bindingExclusion := printf "has(object.spec.matchResources) && has(object.spec.matchResources.namespaceSelector) && [object.spec.matchResources.namespaceSelector].exists(s, %s)" $excluded }}
{{- $touches := "w.rules.exists(r, r.operations.exists(o, o in ['*', 'CREATE', 'UPDATE']) && r.apiGroups.exists(g, g in ['', 'batch', '*']) && r.resources.exists(x, x.split('/')[0] in ['*', 'jobs', 'pods']))" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name | quote }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - operations: ["CREATE", "UPDATE"]
        scope: "*"
        apiGroups: ["", "admissionregistration.k8s.io"]
        apiVersions: ["*"]
        resources: ["namespaces", "namespaces/*", "limitranges", "mutatingwebhookconfigurations", "mutatingadmissionpolicybindings"]
  validations:
    - expression: >-
        request.resource.resource != 'namespaces' || object.metadata.name != {{ .Release.Namespace | quote }} || (has(object.metadata.labels) && 'kubernetes.io/metadata.name' in object.metadata.labels && object.metadata.labels['kubernetes.io/metadata.name'] == {{ .Release.Namespace | quote }})
    - expression: >-
        request.resource.resource != 'limitranges' || request.namespace != {{ .Release.Namespace | quote }}
    - expression: >-
        request.resource.resource != 'mutatingwebhookconfigurations' || object.webhooks.all(w, !has(w.rules) || !({{ $touches }}) || ({{ $webhookExclusion }}))
    - expression: >-
        request.resource.resource != 'mutatingadmissionpolicybindings' || ({{ $bindingExclusion }})
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name | quote }}
spec:
  policyName: {{ $name | quote }}
  validationActions: ["Deny"]
{{- end }}

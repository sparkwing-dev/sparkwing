{{- if or .Values.launcher.enabled .Values.launcher.serviceAccountName }}
{{- $jobs := include "sparkwing-runner-bundle.jobNamespace" . }}
{{- if .Values.launcher.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $jobs | quote }}
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sparkwing-runner-bundle.launcher.serviceAccountName" . | quote }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sparkwing-customer-job
  namespace: {{ $jobs | quote }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sparkwing-runner-bundle.runner.fullname" . }}-launcher
  namespace: {{ $jobs | quote }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["list", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sparkwing-runner-bundle.runner.fullname" . }}-launcher
  namespace: {{ $jobs | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sparkwing-runner-bundle.launcher.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sparkwing-runner-bundle.runner.fullname" . }}-launcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-%s-api-endpoints" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: default
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-%s-api-endpoints" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: default
subjects:
  - kind: ServiceAccount
    name: {{ include "sparkwing-runner-bundle.launcher.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-%s-api-endpoints" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "sparkwing-runner-bundle.runner.fullname" . }}-boundary
rules:
  - apiGroups: ["karpenter.sh"]
    resources: ["nodeclaims"]
    verbs: ["get", "delete"]
  - apiGroups: ["karpenter.sh"]
    resources: ["nodepools"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    resourceNames: [{{ printf "sparkwing-cloud-pods-%s" $jobs | quote }}, {{ printf "sparkwing-cloud-jobs-%s" $jobs | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "sparkwing-runner-bundle.runner.fullname" . }}-boundary
subjects:
  - kind: ServiceAccount
    name: {{ include "sparkwing-runner-bundle.launcher.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ include "sparkwing-runner-bundle.runner.fullname" . }}-boundary
{{- end }}

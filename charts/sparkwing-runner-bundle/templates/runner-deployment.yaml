{{- if and .Values.runner.enabled (not (include "sparkwing-runner-bundle.poolLauncher" .)) }}
{{- $controllerURL := include "sparkwing-runner-bundle.controllerURL" . -}}
{{- $runnerImage := include "sparkwing-runner-bundle.image" (dict "img" .Values.runner.image "root" .) -}}
{{- $goCache := .Values.runner.goCache.persistence.enabled -}}
{{- $agentToken := and .Values.controller.tokenSecret.name .Values.controller.tokenSecret.key -}}
{{- $goCacheMounts := list (dict "name" "go-cache" "mountPath" "/tmp/sparkwing/gocache" "subPath" "gocache") (dict "name" "go-cache" "mountPath" "/tmp/sparkwing/gomodcache" "subPath" "gomodcache") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sparkwing-runner-bundle.runner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sparkwing-runner-bundle.componentLabels" (dict "root" . "component" "runner") | nindent 4 }}
spec:
  replicas: {{ .Values.runner.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "sparkwing-runner-bundle.componentSelectorLabels" (dict "root" . "component" "runner") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sparkwing-runner-bundle.componentSelectorLabels" (dict "root" . "component" "runner") | nindent 8 }}
        app: sparkwing-runner
    spec:
      serviceAccountName: {{ include "sparkwing-runner-bundle.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.runner.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.runner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.volumePermissions.enabled }}
      initContainers:
        - name: volume-permissions
          image: {{ $runnerImage | quote }}
          imagePullPolicy: {{ .Values.runner.image.pullPolicy }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          command: ["/bin/chown"]
          args:
            - {{ printf "%d:%d" (int .Values.podSecurityContext.runAsUser) (int .Values.podSecurityContext.fsGroup) | quote }}
            - "/tmp/sparkwing"
            {{- if $goCache }}
            {{- range $goCacheMounts }}
            - {{ .mountPath | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: sparkwing-home
              mountPath: /tmp/sparkwing
            {{- if $goCache }}
            {{- toYaml $goCacheMounts | nindent 12 }}
            {{- end }}
      {{- end }}
      containers:
        - name: runner
          image: {{ $runnerImage | quote }}
          imagePullPolicy: {{ .Values.runner.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            - /usr/local/bin/sparkwing-runner
          args:
            - warm
            {{- if $controllerURL }}
            - {{ printf "--controller=%s" $controllerURL | quote }}
            {{- end }}
            {{- if $agentToken }}
            - --credentials-dir=/etc/sparkwing/credentials
            {{- end }}
            - {{ printf "--max-concurrent=%d" (int .Values.runner.maxConcurrent) | quote }}
            - {{ printf "--poll=%s" .Values.runner.pollInterval | quote }}
            {{- range .Values.runner.repos }}
            - {{ printf "--repos=%s" . | quote }}
            {{- end }}
            {{- range .Values.runner.submitEnvAllow }}
            - {{ printf "--submit-env-allow=%s" . | quote }}
            {{- end }}
            {{- include "sparkwing-runner-bundle.runnerLabelArgs" . | nindent 12 }}
            {{- if gt (int .Values.runner.metricsPort) 0 }}
            - {{ printf "--metrics-addr=:%d" (int .Values.runner.metricsPort) | quote }}
            {{- else }}
            - --metrics-addr=
            {{- end }}
            {{- if .Values.runner.alsoClaimTriggers }}
            - --also-claim-triggers
            {{- else }}
            - --also-claim-triggers=false
            {{- end }}
            {{- if gt (int .Values.runner.maxClaimsBeforeRestart) 0 }}
            - {{ printf "--max-claims-before-restart=%d" (int .Values.runner.maxClaimsBeforeRestart) | quote }}
            {{- end }}
            {{- with .Values.runner.goCache.warmModules }}
            - {{ printf "--warm-module=%s" (join "," .) | quote }}
            {{- end }}
          {{- if gt (int .Values.runner.metricsPort) 0 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.runner.metricsPort }}
          {{- end }}
          env:
            - name: HOME
              value: /tmp/sparkwing
            - name: SPARKWING_HOME
              value: /tmp/sparkwing
            - name: GOCACHE
              value: /tmp/sparkwing/gocache
            - name: GOMODCACHE
              value: /tmp/sparkwing/gomodcache
            {{- with .Values.runner.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
          volumeMounts:
            - name: scratch
              mountPath: /tmp
            - name: sparkwing-home
              mountPath: /tmp/sparkwing
            {{- if $agentToken }}
            - name: credentials
              mountPath: /etc/sparkwing/credentials
              readOnly: true
            {{- end }}
            {{- if $goCache }}
            {{- toYaml $goCacheMounts | nindent 12 }}
            {{- end }}
            {{- with .Values.runner.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: scratch
          emptyDir: {}
        - name: sparkwing-home
          emptyDir: {}
        {{- if $agentToken }}
        - name: credentials
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: {{ .Values.controller.tokenSecret.name | quote }}
                  items:
                    - key: {{ .Values.controller.tokenSecret.key | quote }}
                      path: agent-token
        {{- end }}
        {{- if $goCache }}
        - name: go-cache
          persistentVolumeClaim:
            claimName: {{ include "sparkwing-runner-bundle.runner.goCacheClaim" . }}
        {{- end }}
        {{- with .Values.runner.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

{{- end }}

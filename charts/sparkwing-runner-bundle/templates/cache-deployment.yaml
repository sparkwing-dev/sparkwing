{{- if .Values.cache.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sparkwing-runner-bundle.cache.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sparkwing-runner-bundle.componentLabels" (dict "root" . "component" "cache") | nindent 4 }}
spec:
  replicas: {{ .Values.cache.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sparkwing-runner-bundle.componentSelectorLabels" (dict "root" . "component" "cache") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sparkwing-runner-bundle.componentSelectorLabels" (dict "root" . "component" "cache") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sparkwing-runner-bundle.cacheServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.cache.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cache.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cache.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cache
          image: {{ include "sparkwing-runner-bundle.image" (dict "img" .Values.cache.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.cache.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            {{- if .Values.cache.allowUnauthenticated }}
            - --allow-unauthenticated
            {{- end }}
            {{- if not .Values.cache.dependencyProxy.enabled }}
            - --disable-proxy
            {{- end }}
            {{- $limits := .Values.cache.limits | default dict }}
            {{- range $limit := list
                  (dict "flag" "--max-artifact-bytes" "value" $limits.maxArtifactBytes)
                  (dict "flag" "--max-cache-archive-bytes" "value" $limits.maxCacheArchiveBytes)
                  (dict "flag" "--max-store-bytes" "value" $limits.maxStoreBytes)
                  (dict "flag" "--max-store-objects" "value" $limits.maxStoreObjects)
                  (dict "flag" "--warn-store-bytes" "value" $limits.warnStoreBytes)
                  (dict "flag" "--warn-store-objects" "value" $limits.warnStoreObjects)
                  (dict "flag" "--store-reconcile" "value" $limits.storeReconcile) }}
            {{- $value := $limit.value }}
            {{- if not (kindIs "invalid" $value) }}
            {{- if ne (toString $value) "" }}
            - {{ $limit.flag }}
            - {{ $value | toString | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          env:
            - name: HOME
              value: /tmp
            {{- with (include "sparkwing-runner-bundle.cachePublicURL" .) }}
            - name: SPARKWING_CACHE_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.cache.repos }}
            - name: GITCACHE_REPOS
              value: {{ .Values.cache.repos | quote }}
            {{- end }}
            {{- with .Values.cache.tokenSecret }}
            {{- if and .name .key }}
            - name: SPARKWING_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ .key | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.cache.grantKeySecret }}
            {{- if and .name .key }}
            - name: SPARKWING_CACHE_GRANT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ .key | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.cache.service.targetPort }}
          volumeMounts:
            {{- if .Values.cache.sshKeySecret.name }}
            - name: ssh-key
              mountPath: /etc/ssh-key
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /data
            - name: scratch
              mountPath: /tmp
          resources:
            {{- toYaml .Values.cache.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        {{- if .Values.cache.sshKeySecret.name }}
        - name: ssh-key
          secret:
            secretName: {{ .Values.cache.sshKeySecret.name | quote }}
            defaultMode: 0400
        {{- end }}
        - name: data
          {{- if .Values.cache.storage.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "sparkwing-runner-bundle.cache.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: scratch
          emptyDir: {}
{{- end }}

{{- /* Generated from launcher.AdmissionPolicies: GOWORK=off go test ./charts -run TestLauncherAdmissionTemplateIsGenerated -update */}}
{{- if or .Values.launcher.enabled .Values.launcher.serviceAccountName }}
{{- $jobs := include "sparkwing-runner-bundle.jobNamespace" . }}
{{- $launcher := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "sparkwing-runner-bundle.launcher.serviceAccountName" .) }}
{{- $runner := include "sparkwing-runner-bundle.digestImage" .Values.launcher.jobImage }}
{{- $docker := include "sparkwing-runner-bundle.digestImage" .Values.launcher.dockerImage }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sparkwing-cloud-pods-{{ $jobs }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: '{{ $jobs }}'
    objectSelector: {}
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
      - pods/ephemeralcontainers
      - pods/resize
      scope: Namespaced
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CONNECT
      resources:
      - pods/exec
      - pods/attach
      - pods/portforward
      - pods/proxy
      scope: Namespaced
  validations:
  - expression: request.operation != 'CONNECT'
    message: exec, attach, port-forward and proxy are not allowed in the Sparkwing
      job namespace
  - expression: '!variables.create || (variables.shape == ''job'' ? request.userInfo.username
      == ''system:serviceaccount:kube-system:job-controller'' : request.userInfo.username
      == variables.launcher)'
    message: only the launcher and the Job controller create Pods here
  - expression: request.operation != 'UPDATE' || size(variables.spec.?ephemeralContainers.orValue([]))
      == 0
    message: ephemeral containers are not allowed
  - expression: request.operation != 'UPDATE' || object.spec == oldObject.spec &&
      variables.labels == oldObject.metadata.?labels.orValue({})
    message: Pod specs and labels are immutable here
  - expression: request.operation != 'UPDATE' || variables.owners == oldObject.metadata.?ownerReferences.orValue([])
      || request.userInfo.username in ['system:serviceaccount:kube-system:job-controller',
      'system:serviceaccount:kube-system:generic-garbage-collector']
    message: only the Job controller and garbage collector change Pod ownership
  - expression: '!variables.create || variables.shape != ''probe'' || (variables.spec.containers[0].name
      == ''control'' && variables.spec.containers[0].?command.orValue([]) == ["/bin/bash",
      "-ceu", "exec nc -lk 18888"] || variables.spec.containers[0].name == ''measure''
      && variables.spec.containers[0].?command.orValue([]) == ["/bin/bash", "-ceu",
      "command -v nc >/dev/null\ncontrol_host=\"$1\"; control_port=\"$2\"; shift 2\nrequired_host=\"$1\";
      required_port=\"$2\"; shift 2\nnc -z -w 3 \"$required_host\" \"$required_port\"\nif
      nc -z -w 3 \"$control_host\" \"$control_port\"; then echo \"Cloud default-deny
      egress is not enforced\" >&2; exit 1; fi\nwhile (( $# )); do\n host=\"$1\";
      port=\"$2\"; shift 2\n if nc -z -w 3 \"$host\" \"$port\"; then echo \"Cloud
      pod egress escaped to $host:$port\" >&2; exit 1; fi\ndone", "boundary-probe"]
      || variables.spec.containers[0].name == ''peer'' && variables.spec.containers[0].?command.orValue([])
      == ["/bin/bash", "-ceu", "exec nc -lk 18888"] || variables.spec.containers[0].name
      == ''witness'' && variables.spec.containers[0].?command.orValue([]) == ["/bin/bash",
      "-ceu", "nc -z -w 3 \"$1\" 18888\nif nc -z -w 3 \"$2\" 18888; then echo \"Cloud
      Job ingress is not denied\" >&2; exit 1; fi", "boundary-control"])'
    message: boundary probes run only the launcher's measurement commands
  - expression: '!variables.create || variables.shape != ''other'''
    message: only Cloud Job, capacity and boundary probe Pods run in the Sparkwing
      job namespace
  - expression: '!variables.create || variables.spec.?serviceAccountName.orValue('''')
      == ''sparkwing-customer-job'' && !variables.spec.?automountServiceAccountToken.orValue(true)'
    message: Pods use the customer job service account without an API token
  - expression: '!variables.create || !variables.spec.?hostNetwork.orValue(false)
      && !variables.spec.?hostIPC.orValue(false) && !variables.spec.?hostPID.orValue(false)
      && variables.containers.all(c, c.?ports.orValue([]).all(p, p.?hostPort.orValue(0)
      == 0))'
    message: Pods cannot share host namespaces or ports
  - expression: '!variables.create || variables.spec.?volumes.orValue([]).all(v, variables.shape
      == ''job'' && (v.name == ''scratch'' && has(v.emptyDir) || v.name == ''bootstrap''
      && has(v.secret) && v.secret.?secretName.orValue('''') == variables.labels[?''sparkwing.dev/job''].orValue('''')))'
    message: Pods mount only their scratch emptyDir and own bootstrap Secret
  - expression: '!variables.create || (variables.shape == ''job'' ? size(variables.spec.containers)
      == 1 && variables.spec.containers[0].name == ''run-node'' && variables.spec.containers[0].image
      == variables.runnerImage && size(variables.inits) == 2 && variables.inits[0].name
      == ''docker'' && variables.inits[0].image == variables.dockerImage && variables.inits[1].name
      == ''fetch-source'' && variables.inits[1].image == variables.runnerImage : size(variables.spec.containers)
      == 1 && variables.spec.containers[0].image == variables.runnerImage && size(variables.inits)
      == 0)'
    message: Pods run only the launcher's container set and pinned images
  - expression: '!variables.create || variables.containers.all(c, !c.?securityContext.?privileged.orValue(false))'
    message: no container runs privileged
  - expression: '!variables.create || variables.shape != ''job'' || !variables.spec.?hostUsers.orValue(true)'
    message: Job Pods run in their own user namespace
  - expression: '!variables.create || !has(variables.spec.runtimeClassName) && !variables.spec.?shareProcessNamespace.orValue(false)
      && size(variables.spec.?resourceClaims.orValue([])) == 0 && variables.containers.all(c,
      size(c.?resources.?claims.orValue([])) == 0 && [c.?livenessProbe, c.?readinessProbe,
      c.?startupProbe].all(p, !p.hasValue() || (!has(p.value().httpGet) || !has(p.value().httpGet.host))
      && (!has(p.value().tcpSocket) || !has(p.value().tcpSocket.host))))'
    message: Pods use the default runtime class, private process namespaces, no resource
      claims and probes against their own address
  - expression: '!variables.create || !has(variables.spec.dnsConfig) && !has(variables.spec.hostAliases)
      && variables.spec.?schedulerName.orValue(''default-scheduler'') == ''default-scheduler''
      && !variables.spec.?enableServiceLinks.orValue(true) && !variables.spec.?priorityClassName.orValue('''').startsWith(''system-'')'
    message: Pods keep cluster DNS, the default scheduler, no service links and no
      system priority class
  - expression: '!variables.create || variables.shape != ''job'' || size(variables.inits)
      != 2 || variables.inits[1].?command.orValue([]) == ["sparkwing-runner"] && !has(variables.inits[1].restartPolicy)
      && (size(variables.inits[1].?args.orValue([])) == 13 || size(variables.inits[1].?args.orValue([]))
      == 15 && variables.inits[1].args[13] == ''--job'') && variables.inits[1].args[0]
      == "fetch-source" && variables.inits[1].args[1] == "--controller" && variables.inits[1].args[3]
      == "--run" && variables.inits[1].args[5] == "--generation" && variables.inits[1].args[7]
      == "--source-dir" && variables.inits[1].args[8] == "/tmp/source" && variables.inits[1].args[9]
      == "--module-cache" && variables.inits[1].args[10] == "/tmp/modules" && variables.inits[1].args[11]
      == "--bootstrap-file" && variables.inits[1].args[12] == "/etc/sparkwing/bootstrap/bootstrap"
      && variables.spec.containers[0].?command.orValue([]) == ["sparkwing-runner"]
      && !has(variables.spec.containers[0].restartPolicy) && (size(variables.spec.containers[0].?args.orValue([]))
      == 13 || size(variables.spec.containers[0].?args.orValue([])) == 15 && variables.spec.containers[0].args[13]
      == ''--job'') && variables.spec.containers[0].args[0] == "run-node" && variables.spec.containers[0].args[1]
      == "--controller" && variables.spec.containers[0].args[3] == "--run" && variables.spec.containers[0].args[5]
      == "--generation" && variables.spec.containers[0].args[7] == "--source-dir"
      && variables.spec.containers[0].args[8] == "/tmp/source" && variables.spec.containers[0].args[9]
      == "--module-cache" && variables.spec.containers[0].args[10] == "/tmp/modules"
      && variables.spec.containers[0].args[11] == "--bootstrap-file" && variables.spec.containers[0].args[12]
      == "/etc/sparkwing/bootstrap/bootstrap"'
    message: the workload containers run only the launcher's sparkwing-runner commands
  - expression: '!variables.create || variables.shape == ''job'' ? has(variables.spec.securityContext)
      && (!has(variables.spec.securityContext.seLinuxOptions) && !has(variables.spec.securityContext.windowsOptions)
      && has(variables.spec.securityContext.runAsUser) && variables.spec.securityContext.runAsUser
      == 0 && has(variables.spec.securityContext.runAsGroup) && variables.spec.securityContext.runAsGroup
      == 0 && has(variables.spec.securityContext.runAsNonRoot) && variables.spec.securityContext.runAsNonRoot
      == false && !has(variables.spec.securityContext.supplementalGroups) && !has(variables.spec.securityContext.supplementalGroupsPolicy)
      && !has(variables.spec.securityContext.fsGroup) && !has(variables.spec.securityContext.sysctls)
      && !has(variables.spec.securityContext.fsGroupChangePolicy) && has(variables.spec.securityContext.seccompProfile)
      && (has(variables.spec.securityContext.seccompProfile.type) && variables.spec.securityContext.seccompProfile.type
      == "RuntimeDefault" && !has(variables.spec.securityContext.seccompProfile.localhostProfile))
      && !has(variables.spec.securityContext.appArmorProfile) && !has(variables.spec.securityContext.seLinuxChangePolicy))
      && variables.containers.all(c, c.name == ''docker'' ? has(c.securityContext)
      && (has(c.securityContext.capabilities) && (has(c.securityContext.capabilities.add)
      && c.securityContext.capabilities.add == ["SYS_ADMIN", "NET_ADMIN", "SYS_PTRACE"]
      && !has(c.securityContext.capabilities.drop)) && !has(c.securityContext.privileged)
      && !has(c.securityContext.seLinuxOptions) && !has(c.securityContext.windowsOptions)
      && !has(c.securityContext.runAsUser) && !has(c.securityContext.runAsGroup) &&
      !has(c.securityContext.runAsNonRoot) && !has(c.securityContext.readOnlyRootFilesystem)
      && !has(c.securityContext.allowPrivilegeEscalation) && has(c.securityContext.procMount)
      && c.securityContext.procMount == "Unmasked" && has(c.securityContext.seccompProfile)
      && (has(c.securityContext.seccompProfile.type) && c.securityContext.seccompProfile.type
      == "Localhost" && has(c.securityContext.seccompProfile.localhostProfile) &&
      c.securityContext.seccompProfile.localhostProfile == "profiles/sparkwing-dind.json")
      && has(c.securityContext.appArmorProfile) && (has(c.securityContext.appArmorProfile.type)
      && c.securityContext.appArmorProfile.type == "Unconfined" && !has(c.securityContext.appArmorProfile.localhostProfile)))
      : has(c.securityContext) && (!has(c.securityContext.capabilities) && !has(c.securityContext.privileged)
      && !has(c.securityContext.seLinuxOptions) && !has(c.securityContext.windowsOptions)
      && !has(c.securityContext.runAsUser) && !has(c.securityContext.runAsGroup) &&
      !has(c.securityContext.runAsNonRoot) && !has(c.securityContext.readOnlyRootFilesystem)
      && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation
      == false && !has(c.securityContext.procMount) && !has(c.securityContext.seccompProfile)
      && !has(c.securityContext.appArmorProfile))) : variables.shape == ''capacity''
      ? has(variables.spec.securityContext) && (!has(variables.spec.securityContext.seLinuxOptions)
      && !has(variables.spec.securityContext.windowsOptions) && has(variables.spec.securityContext.runAsUser)
      && variables.spec.securityContext.runAsUser == 65534 && has(variables.spec.securityContext.runAsGroup)
      && variables.spec.securityContext.runAsGroup == 65534 && has(variables.spec.securityContext.runAsNonRoot)
      && variables.spec.securityContext.runAsNonRoot == true && !has(variables.spec.securityContext.supplementalGroups)
      && !has(variables.spec.securityContext.supplementalGroupsPolicy) && !has(variables.spec.securityContext.fsGroup)
      && !has(variables.spec.securityContext.sysctls) && !has(variables.spec.securityContext.fsGroupChangePolicy)
      && has(variables.spec.securityContext.seccompProfile) && (has(variables.spec.securityContext.seccompProfile.type)
      && variables.spec.securityContext.seccompProfile.type == "RuntimeDefault" &&
      !has(variables.spec.securityContext.seccompProfile.localhostProfile)) && !has(variables.spec.securityContext.appArmorProfile)
      && !has(variables.spec.securityContext.seLinuxChangePolicy)) && variables.containers.all(c,
      has(c.securityContext) && (has(c.securityContext.capabilities) && (!has(c.securityContext.capabilities.add)
      && has(c.securityContext.capabilities.drop) && c.securityContext.capabilities.drop
      == ["ALL"]) && !has(c.securityContext.privileged) && !has(c.securityContext.seLinuxOptions)
      && !has(c.securityContext.windowsOptions) && !has(c.securityContext.runAsUser)
      && !has(c.securityContext.runAsGroup) && !has(c.securityContext.runAsNonRoot)
      && has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem
      == true && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation
      == false && !has(c.securityContext.procMount) && !has(c.securityContext.seccompProfile)
      && !has(c.securityContext.appArmorProfile))) : has(variables.spec.securityContext)
      && (!has(variables.spec.securityContext.seLinuxOptions) && !has(variables.spec.securityContext.windowsOptions)
      && has(variables.spec.securityContext.runAsUser) && variables.spec.securityContext.runAsUser
      == 65534 && has(variables.spec.securityContext.runAsGroup) && variables.spec.securityContext.runAsGroup
      == 65534 && has(variables.spec.securityContext.runAsNonRoot) && variables.spec.securityContext.runAsNonRoot
      == true && !has(variables.spec.securityContext.supplementalGroups) && !has(variables.spec.securityContext.supplementalGroupsPolicy)
      && !has(variables.spec.securityContext.fsGroup) && !has(variables.spec.securityContext.sysctls)
      && !has(variables.spec.securityContext.fsGroupChangePolicy) && has(variables.spec.securityContext.seccompProfile)
      && (has(variables.spec.securityContext.seccompProfile.type) && variables.spec.securityContext.seccompProfile.type
      == "RuntimeDefault" && !has(variables.spec.securityContext.seccompProfile.localhostProfile))
      && !has(variables.spec.securityContext.appArmorProfile) && !has(variables.spec.securityContext.seLinuxChangePolicy))
      && variables.containers.all(c, has(c.securityContext) && (has(c.securityContext.capabilities)
      && (!has(c.securityContext.capabilities.add) && has(c.securityContext.capabilities.drop)
      && c.securityContext.capabilities.drop == ["ALL"]) && !has(c.securityContext.privileged)
      && !has(c.securityContext.seLinuxOptions) && !has(c.securityContext.windowsOptions)
      && !has(c.securityContext.runAsUser) && !has(c.securityContext.runAsGroup) &&
      !has(c.securityContext.runAsNonRoot) && !has(c.securityContext.readOnlyRootFilesystem)
      && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation
      == false && !has(c.securityContext.procMount) && !has(c.securityContext.seccompProfile)
      && !has(c.securityContext.appArmorProfile)))'
    message: each container runs exactly its shape's security context, with no SELinux,
      Windows or other override
  - expression: '!variables.create || variables.containers.all(c, !has(c.lifecycle)
      && [c.?livenessProbe, c.?readinessProbe, c.?startupProbe].all(p, !p.hasValue()
      || !has(p.value().exec) || variables.shape == ''probe'' && c.name == ''peer''
      && p == c.?readinessProbe && p.value().exec.?command.orValue([]) == ["nc", "-z",
      "127.0.0.1", "18888"]))'
    message: containers run no lifecycle hooks or exec probes beyond the peer listener's
      loopback readiness check
  - expression: '!variables.create || variables.shape != ''job'' || size(variables.inits)
      == 0 || variables.inits[0].?command.orValue([]) == ["dockerd-entrypoint.sh"]
      && variables.inits[0].?args.orValue([]) == ["dockerd", "--host=unix:///tmp/docker.sock",
      "--data-root=/tmp/docker", "--exec-root=/tmp/docker-exec", "--pidfile=/tmp/docker.pid",
      "--tls=false"]'
    message: the Docker sidecar runs only the launcher's dockerd command
  - expression: '!variables.create || variables.containers.all(c, size(c.?envFrom.orValue([]))
      == 0 && c.?env.orValue([]).all(e, variables.shape == ''job'' && e.name in [''HOME'',
      ''DOCKER_HOST'', ''AWS_REGION'', ''AWS_DEFAULT_REGION'', ''AWS_STS_REGIONAL_ENDPOINTS'']
      && !has(e.valueFrom)))'
    message: containers carry only the launcher's environment and EKS region values,
      never AWS credentials
  - expression: '!variables.create || variables.team != '''' && variables.spec.?nodeSelector.orValue({})[?''node-restriction.kubernetes.io/sparkwing-team-node''].orValue('''')
      == variables.team && variables.spec.?tolerations.orValue([]).exists(t, t.?key.orValue('''')
      == ''node-restriction.kubernetes.io/sparkwing-team-node'' && t.?operator.orValue(''Equal'')
      == ''Equal'' && t.?value.orValue('''') == variables.team && t.?effect.orValue('''')
      == ''NoSchedule'')'
    message: Pods select and tolerate only their own team's nodes
  - expression: '!variables.create || (variables.shape == ''capacity'' ? variables.spec.?nodeName.orValue('''')
      == '''' : variables.spec.?nodeName.orValue('''') != '''')'
    message: Job and probe Pods are bound to their reserved node; capacity requests
      are not
  - expression: '!variables.create || (variables.shape == ''job'' ? variables.labels.all(k,
      k in [''app'', ''app.kubernetes.io/managed-by'', ''sparkwing.dev/job'', ''sparkwing.dev/team'',
      ''batch.kubernetes.io/controller-uid'', ''batch.kubernetes.io/job-name'', ''controller-uid'',
      ''job-name''] || k in variables.nodeTopology) && variables.labels[?''app''].orValue('''')
      == ''sparkwing-job'' && variables.labels[?''app.kubernetes.io/managed-by''].orValue('''')
      == ''sparkwing-launcher'' && variables.labels[?''sparkwing.dev/job''].orValue('''')
      != '''' : variables.shape == ''capacity'' ? variables.labels.all(k, k in [''app'',
      ''app.kubernetes.io/managed-by'', ''sparkwing.dev/capacity-request'', ''sparkwing.dev/team''])
      && variables.labels[?''app''].orValue('''') == ''sparkwing-job'' && variables.labels[?''app.kubernetes.io/managed-by''].orValue('''')
      == ''sparkwing-launcher'' && variables.labels[?''sparkwing.dev/capacity-request''].orValue('''')
      == ''true'' : variables.labels.all(k, k in [''sparkwing.dev/boundary-control'',
      ''app'', ''app.kubernetes.io/managed-by'', ''sparkwing.dev/job'', ''sparkwing.dev/team'']
      || k in variables.nodeTopology))'
    message: Pods carry exactly the launcher's labels
  - expression: '!variables.create || variables.spec.?readinessGates.orValue([]).all(g,
      g.conditionType.startsWith(''target-health.elbv2.k8s.aws/''))'
    message: only AWS load balancer readiness gates are allowed
  variables:
  - expression: request.operation == 'CREATE'
    name: create
  - expression: '''{{ $launcher }}'''
    name: launcher
  - expression: '''{{ $runner }}'''
    name: runnerImage
  - expression: '''{{ $docker }}'''
    name: dockerImage
  - expression: object.metadata.?labels.orValue({})
    name: labels
  - expression: variables.labels[?'sparkwing.dev/team'].orValue('')
    name: team
  - expression: object.spec
    name: spec
  - expression: variables.spec.?initContainers.orValue([])
    name: inits
  - expression: variables.spec.containers + variables.inits
    name: containers
  - expression: object.metadata.?ownerReferences.orValue([])
    name: owners
  - expression: 'size(variables.owners) == 1 && variables.owners[0].apiVersion ==
      ''batch/v1'' && variables.owners[0].kind == ''Job'' && variables.owners[0].?controller.orValue(false)
      && variables.owners[0].name == variables.labels[?''sparkwing.dev/job''].orValue('''')
      ? ''job'' : size(variables.owners) == 0 && object.metadata.name.startsWith(''sw-capacity-'')
      ? ''capacity'' : size(variables.owners) == 0 && object.metadata.name.startsWith(''sw-boundary-'')
      ? ''probe'' : ''other'''
    name: shape
  - expression: '["topology.kubernetes.io/region", "topology.kubernetes.io/zone"]'
    name: nodeTopology
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sparkwing-cloud-pods-{{ $jobs }}
spec:
  matchResources:
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: '{{ $jobs }}'
    objectSelector: {}
  policyName: sparkwing-cloud-pods-{{ $jobs }}
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sparkwing-cloud-jobs-{{ $jobs }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: '{{ $jobs }}'
    objectSelector: {}
    resourceRules:
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - jobs
      scope: Namespaced
  validations:
  - expression: '!variables.create || request.userInfo.username == variables.launcher'
    message: only the launcher creates Jobs here
  - expression: '!variables.create || object.metadata.name == variables.labels[?''sparkwing.dev/job''].orValue('''')'
    message: the Job template names its own Job
  - expression: object.spec.?parallelism.orValue(1) == 1 && object.spec.?completions.orValue(1)
      == 1 && object.spec.?backoffLimit.orValue(6) == 0 && !has(object.spec.podFailurePolicy)
      && !has(object.spec.successPolicy) && object.spec.?completionMode.orValue('NonIndexed')
      == 'NonIndexed'
    message: Jobs run exactly one Pod without retries
  - expression: request.operation != 'UPDATE' || object.spec.template == oldObject.spec.template
      && (request.userInfo.username == variables.launcher || object.spec == oldObject.spec
      && object.metadata.?annotations.orValue({}) == oldObject.metadata.?annotations.orValue({}))
    message: only the launcher changes a Job, and never its template
  - expression: '!variables.create || variables.shape != ''other'''
    message: only Cloud Job, capacity and boundary probe Pods run in the Sparkwing
      job namespace
  - expression: '!variables.create || variables.spec.?serviceAccountName.orValue('''')
      == ''sparkwing-customer-job'' && !variables.spec.?automountServiceAccountToken.orValue(true)'
    message: Pods use the customer job service account without an API token
  - expression: '!variables.create || !variables.spec.?hostNetwork.orValue(false)
      && !variables.spec.?hostIPC.orValue(false) && !variables.spec.?hostPID.orValue(false)
      && variables.containers.all(c, c.?ports.orValue([]).all(p, p.?hostPort.orValue(0)
      == 0))'
    message: Pods cannot share host namespaces or ports
  - expression: '!variables.create || variables.spec.?volumes.orValue([]).all(v, variables.shape
      == ''job'' && (v.name == ''scratch'' && has(v.emptyDir) || v.name == ''bootstrap''
      && has(v.secret) && v.secret.?secretName.orValue('''') == variables.labels[?''sparkwing.dev/job''].orValue('''')))'
    message: Pods mount only their scratch emptyDir and own bootstrap Secret
  - expression: '!variables.create || (variables.shape == ''job'' ? size(variables.spec.containers)
      == 1 && variables.spec.containers[0].name == ''run-node'' && variables.spec.containers[0].image
      == variables.runnerImage && size(variables.inits) == 2 && variables.inits[0].name
      == ''docker'' && variables.inits[0].image == variables.dockerImage && variables.inits[1].name
      == ''fetch-source'' && variables.inits[1].image == variables.runnerImage : size(variables.spec.containers)
      == 1 && variables.spec.containers[0].image == variables.runnerImage && size(variables.inits)
      == 0)'
    message: Pods run only the launcher's container set and pinned images
  - expression: '!variables.create || variables.containers.all(c, !c.?securityContext.?privileged.orValue(false))'
    message: no container runs privileged
  - expression: '!variables.create || variables.shape != ''job'' || !variables.spec.?hostUsers.orValue(true)'
    message: Job Pods run in their own user namespace

apiVersion: v2
name: sparkwing-runner-bundle
description: |
  Sparkwing runners for a customer-owned namespace. Runners connect to
  a controller for claims and signed data access. Source comes directly
  from its repository. The controller and dashboard ship in sparkwing-full.

# application: this chart deploys runnable workloads (Deployments,
# Services, PVCs). A library chart would be wrong here -- there is no
# parent chart consuming these templates as helpers.
type: application

# Chart version: SemVer for this chart's *templates / values surface*.
# Independent of the appVersion below. Bump on any user-facing
# values.yaml change or template structural change.
version: 0.1.11

# appVersion is retained as Helm metadata and the empty-tag fallback. The
# current value is not a compatible public image-set guarantee; operators
# must pin per-component repositories and tags until a corrected release.
appVersion: "0.1.0"

keywords:
  - sparkwing
  - ci
  - cd
  - runner
  - pipelines

home: https://github.com/sparkwing-dev/sparkwing
sources:
  - https://github.com/sparkwing-dev/sparkwing

maintainers:
  - name: sparkwing
    url: https://github.com/sparkwing-dev/sparkwing

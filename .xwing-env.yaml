project: sparkwing
profiles:
  - local
tools:
  sparkwing:
    install:
      - bash
      - bin/xwing-install.sh
    runtime: sparkwing
commands:
  install:
    argv: [env, GOWORK=auto, sh, -c, 'go mod download && go -C .sparkwing mod download && pnpm --dir web install --frozen-lockfile --prefer-offline --ignore-scripts && npm --prefix sdk/typescript ci --ignore-scripts --no-audit --no-fund']
    description: Prepare Go modules, dashboard dependencies and TypeScript SDK test dependencies
  build:
    argv: [env, GOWORK=auto, sh, -c, 'bash bin/build-web.sh && sparkwing run build "$@"', xwing-build]
    description: Build dashboard assets and compile every public Go binary
  test:
    argv: [env, GOWORK=auto, sparkwing, run, test]
    description: Run the repository Go test pipeline through machine admission
  test-frontend:
    argv: [pnpm, test, --]
    dir: web
    description: Run dashboard unit tests
  run:
    argv: [env, GOWORK=auto, go, run, ./cmd/sparkwing]
    description: Run the checkout CLI with arguments after --
  verify:
    argv: [env, GOWORK=auto, sparkwing, run, gate]
    description: Run the repository landing gate
landing:
  branch: main
  verify: verify
  push: true

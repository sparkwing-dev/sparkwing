version: "2"

# Architecture guards. Unlike .golangci.yml, this config judges the whole tree:
# it sets no new-from-merge-base, so a violation cannot hide because it predates
# origin/main. Today's violations live in .guards/*.allow, and
# `go run ./internal/guardcheck` fails both when a finding is missing from its
# allow-list and when an allow-list entry no longer matches a finding. See
# .guards/README.md for how to shrink a list.

run:
  timeout: 20m

linters:
  default: none
  enable:
    - depguard
    - forbidigo
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: "io/ioutil is deprecated since Go 1.16; use io and os."
            - pkg: github.com/pkg/errors
              desc: "use stdlib errors with %w wrapping; errors.Is/As replaces pkg/errors.Cause/As."
            - pkg: gopkg.in/yaml.v2
              desc: "use gopkg.in/yaml.v3; v2 is unmaintained and has known issues with anchor handling."
            - pkg: github.com/stretchr/testify/assert
              desc: "use testify/require instead so a failed assertion stops the test (assert keeps going and produces follow-on noise)."

        thin-binaries-no-dispatch:
          list-mode: lax
          files:
            - "**/cmd/sparkwing-controller/**"
            - "**/internal/backend/**"
            - "**/internal/web/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/orchestrator
              desc: "Thin binaries and the dashboard support packages must not import internal/orchestrator. Extract the symbol to its own leaf package first."

        # The SDK is every package under the module's sparkwing/ directory. A
        # **/sparkwing/** glob would also match a checkout whose root is named
        # sparkwing, so the scope is the tree minus the other top-level trees.
        sdk-no-internal:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/cmd/**"
            - "!**/internal/**"
            - "!**/pkg/**"
            - "!**/tests/**"
            - "!**/examples/**"
            - "!**/perf/**"
            - "!**/testdata/**"
            - "!**/.sparkwing/**"
            - "!**/sparkwingtest/**"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal
              desc: "The public SDK must not grow new internal imports. Anything the SDK needs at its surface belongs in the SDK or a leaf package; .guards/depguard-sdk-no-internal.allow lists the imports that predate this rule."
          allow:
            - $gostd
            - github.com/sparkwing-dev/sparkwing/internal/swtags

        store-allowed-internal:
          list-mode: lax
          files:
            - "**/internal/store/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal
              desc: "internal/store may import only the data-model packages it owns the authority over. Git resolution, token minting and wire DTOs belong to the controller."
          allow:
            - github.com/sparkwing-dev/sparkwing/internal/store
            - github.com/sparkwing-dev/sparkwing/internal/capability
            - github.com/sparkwing-dev/sparkwing/internal/blob
            - github.com/sparkwing-dev/sparkwing/internal/runspec
            - github.com/sparkwing-dev/sparkwing/internal/limits
            - github.com/sparkwing-dev/sparkwing/internal/apierr
            - github.com/sparkwing-dev/sparkwing/internal/nodeproto
            - github.com/sparkwing-dev/sparkwing/internal/settings
            - github.com/sparkwing-dev/sparkwing/internal/admission
            - github.com/sparkwing-dev/sparkwing/internal/cronspec
            - github.com/sparkwing-dev/sparkwing/internal/sourceurl
            - github.com/sparkwing-dev/sparkwing/internal/secrets
            - github.com/sparkwing-dev/sparkwing/internal/procenv

        wire-is-leaf:
          list-mode: lax
          files:
            - "**/internal/controllerwire/**"
            - "**/pkg/wingwire/**"
            - "**/internal/localhostwire/**"
            - "**/internal/runspec/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/store
              desc: "Wire and value packages are leaves; they must not reach the store."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/controller$
              desc: "Server implementation belongs behind the controller wire contract."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/controller/
              desc: "Wire and value packages are leaves; they must not reach the controller."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/engine
              desc: "Wire and value packages are leaves; move the shared value to a leaf package such as engineid."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/wingd
              desc: "Wire and value packages are leaves; they must not reach the local daemon."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/procgroup
              desc: "Wire and value packages are leaves; they must not reach process machinery."

        controller-not-daemon:
          list-mode: lax
          files:
            - "**/internal/controller/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/wingd
              desc: "The controller must not depend on the local daemon; move shared types to a wire package such as localhostwire."

        host-not-server:
          list-mode: lax
          files:
            - "**/internal/nodehost/**"
            - "**/internal/runners/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/controller$
              desc: "Server implementation belongs behind the controller wire contract."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/controller/
              desc: "Run hosts and runners talk to the controller through internal/controller/client, never the server package."
          allow:
            - github.com/sparkwing-dev/sparkwing/internal/controller/client

        client-not-store:
          list-mode: lax
          files:
            - "**/internal/controller/client/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/store
              desc: "The controller client must not link the store; use wire types."

        internal-not-sdk:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/sdkserve/**"
            - "!**/internal/nodeproto/conformance/gofixture/**"
            - "!**/testdata/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/sparkwing
              desc: "Internal packages must not depend on the author SDK; move the shared value to an internal leaf the SDK re-exports."

        no-testing-in-prod:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/*test/**"
            - "!**/internal/testleak/**"
            - "!**/internal/testhome/**"
            - "!**/internal/testshell/**"
            - "!**/internal/chaos/**"
          deny:
            - pkg: testing
              desc: "Production code must not import testing; move the hook to export_test.go or a test-only package."

        backends-no-impls:
          list-mode: lax
          files:
            - "**/pkg/backends/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/storage
              desc: "pkg/backends is config-type only; internal/storage consumes the config, not the reverse."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/store
              desc: "pkg/backends is config-type only."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/controller$
              desc: "Server implementation belongs behind the controller wire contract."
            - pkg: github.com/sparkwing-dev/sparkwing/internal/controller/
              desc: "pkg/backends declares the controller backend type only."
            - pkg: github.com/sparkwing-dev/sparkwing/pkg/logs
              desc: "pkg/backends declares log backend types only."

        cluster-runner-only:
          list-mode: lax
          files:
            - "$all"
            - "!**/cmd/sparkwing-runner/**"
            - "!**/internal/cluster/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/cluster
              desc: "internal/cluster is the warm-runner pool; only cmd/sparkwing-runner imports it."

        runners-dispatcher-only:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/cluster/**"
            - "!**/internal/runners/**"
            - "!**/internal/wingd/localcontroller/**"
            - "!**/cmd/sparkwing/**"
            - "!$test"
          deny:
            - pkg: github.com/sparkwing-dev/sparkwing/internal/runners
              desc: "internal/runners/* are the execution backends. Only internal/cluster, internal/wingd/localcontroller and cmd/sparkwing select one; service installers import internal/runners/service/unitfile, and award validation is the shared leaf internal/runners/award."
          allow:
            - github.com/sparkwing-dev/sparkwing/internal/runners/service/unitfile
            - github.com/sparkwing-dev/sparkwing/internal/runners/award

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^store\.Store\.(AsOperator|ForTeam|SetTestClock)$
          pkg: ^github\.com/sparkwing-dev/sparkwing/internal/store$
          msg: "F1: widening the store to a team or operator handle belongs to a composition root (cmd/*, internal/wingd/localcontroller). Take the narrowed port as a dependency instead."
        - pattern: \.TestOnly\w*$
          msg: "F1: TestOnly hooks are for tests; call them only from _test.go files."
        - pattern: ^runspec\.(AppProvenance|ScheduleProvenance|ActionsProvenance|AssertedProvenance|AssertedChildProvenance|Provenance\.ReadingDefault)$
          msg: "F2: only the intake transaction (internal/store/intake_provenance.go) seals the identity a run speaks for; a child or retry copies its parent's sealed value."
        - pattern: ^runspec\.(Git\.(Ref|SHA|App)|Request\.Pipeline)$
          msg: "F3: the store decides trust from runspec.SealedRequest.Provenance, never from the submitted ref, commit, pipeline or App facts."
        - pattern: ^license\.\*?License\.Allows$
          pkg: ^github\.com/sparkwing-dev/sparkwing/internal/license$
          msg: "F2: only internal/deployment asks what a license allows, once at startup, so the kind stays declared and fixed; read deployment.Config instead."
  exclusions:
    paths:
      - web/node_modules/
    rules:
      - path: _test\.go
        linters:
          - forbidigo
      - path: ^cmd/
        text: "F1: widening"
        linters:
          - forbidigo
      - path: ^internal/wingd/localcontroller/
        text: "F1: widening"
        linters:
          - forbidigo
      - path: ^(internal/runspec/|internal/store/intake_provenance\.go$|internal/store/teststore/)
        text: "F2: only the intake"
        linters:
          - forbidigo
      # F3 guards the store's trust decisions. The controller still reads Git.App to route
      # check reports and source tokens to an installation; that routing is not trust.
      - path-except: ^internal/store/
        text: "F3:"
        linters:
          - forbidigo
      # Intake and sealing build provenance from these facts. run_spec, latest_run and
      # binding_execution project or name the run's own pipeline; github_app_runner and
      # github_source_release route to the App installation that delivered the run.
      - path: ^internal/store/(intake_runtime|intake_provenance|app_intake|schedule_intake|schedule_transactions|run_spec|plan_seal|source_upload|github_app_runner|github_source_release|latest_run|binding_execution)\.go$
        text: "F3:"
        linters:
          - forbidigo
      - path: ^internal/deployment/
        text: "F2: only internal/deployment"
        linters:
          - forbidigo
      # teststore contains only internal fixture code.
      - path: ^internal/store/teststore/
        text: "F1: widening"
        linters:
          - forbidigo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

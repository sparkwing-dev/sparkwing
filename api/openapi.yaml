              schema:
                type: object
                required: [approvals]
                properties:
                  approvals:
                    type: array
                    items: {$ref: "#/components/schemas/Approval"}

  /api/v1/concurrency/{key}/acquire:
    parameters:
      - in: path
        name: key
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: admin
      tags: [concurrency]
      summary: Try to acquire a slot under a concurrency key.
      description: |
        Status code carries the outcome class:
        - **200** -- granted or cached.
        - **202** -- queued, coalesced, or `cancel_others` in progress.
        - **429** -- skipped or failed (terminal).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AcquireSlotRequest"}
      responses:
        "200":
          description: Granted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AcquireSlotResponse"}
        "202":
          description: Queued / coalesced / cancel_others.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AcquireSlotResponse"}
        "429":
          description: Skipped / failed (terminal).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AcquireSlotResponse"}

  /api/v1/concurrency/{key}/heartbeat:
    parameters:
      - in: path
        name: key
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: admin
      tags: [concurrency]
      summary: Extend a holder's lease.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holder_id]
              properties:
                holder_id: {type: string}
                lease_secs: {type: integer}
      responses:
        "200":
          description: New lease + supersede flag.
          content:
            application/json:
              schema:
                type: object
                required: [lease_expires_at, cancelled_by_newer]
                properties:
                  lease_expires_at: {type: string, format: date-time}
                  cancelled_by_newer: {type: boolean}
        "409": {description: Lock held by another runner.}

  /api/v1/concurrency/{key}/release:
    parameters:
      - in: path
        name: key
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: admin
      tags: [concurrency]
      summary: Release a slot. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holder_id, outcome]
              properties:
                holder_id: {type: string}
                outcome: {type: string}
                output_ref: {type: string}
                cache_key_hash: {type: string}
                cache_ttl_ns: {type: integer, format: int64}
      responses:
        "204": {description: Released.}

  /api/v1/concurrency/{key}/state:
    parameters:
      - in: path
        name: key
        required: true
        schema: {type: string}
    get:
      x-sparkwing-scope: runs.read
      tags: [concurrency]
      summary: Inspect capacity + holders + waiters under a key.
      responses:
        "200":
          description: State snapshot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConcurrencyState"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/concurrency/{key}/notify:
    parameters:
      - in: path
        name: key
        required: true
        schema: {type: string}
      - in: query
        name: run_id
        required: true
        schema: {type: string}
      - in: query
        name: node_id
        required: false
        schema: {type: string}
    get:
      x-sparkwing-scope: runs.read
      tags: [concurrency]
      summary: Server-sent event stream of waiter resolution events.
      description: |
        Streams Server-Sent Events for a single (run_id, node_id)
        waiter on this concurrency key. The server polls the
        concurrency state at 250ms cadence and emits exactly one
        terminal event per stream, then closes:

        - `event: ready` -- the caller is now a holder of the slot.
        - `event: superseded` -- the caller is no longer a waiter
          (slot acquired elsewhere, run cancelled, etc.).
        - `event: stream_end` -- fail-safe timeout (max 30 minutes
          per stream) or the concurrency key no longer exists; the
          event payload carries a `reason` field
          (`"max_wait"` or `"key_not_found"`).

        Every event payload also carries the `key` and `run_id`
        fields, plus `node_id` when one was supplied. The stream
        opens with a `: open` comment line so proxies don't buffer.
      responses:
        "200":
          description: |
            SSE stream of resolution events. The response is
            `text/event-stream`; clients consume it line-by-line
            until the terminal event arrives.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE frames. Each event has the form

                  ```
                  event: ready|superseded|stream_end
                  data: {"key":"...","run_id":"...","node_id":"...","reason":"..."}
                  ```

                  `node_id` is present when the request supplied one;
                  `reason` is present only on `stream_end`.
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/concurrency/{key}/holder:
    parameters: [{$ref: "#/components/parameters/ConcurrencyKey"}]
    get:
      x-sparkwing-scope: admin
      tags: [concurrency]
      summary: Read one holder's slot.
      parameters:
        - in: query
          name: holder_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The holder's slot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConcurrencyHolder"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/concurrency/{key}/resolve:
    parameters: [{$ref: "#/components/parameters/ConcurrencyKey"}]
    get:
      x-sparkwing-scope: admin
      tags: [concurrency]
      summary: Resolve one waiter's standing in a single read.
      description: |
        Answers where the caller sits in the queue and what the leader it
        coalesced behind produced. `bypass_read=true` skips the cache
        lookup. The polling counterpart to the `notify` stream.
      parameters:
        - in: query
          name: run_id
          required: true
          schema: {type: string}
        - in: query
          name: node_id
          schema: {type: string}
        - in: query
          name: cache_key_hash
          schema: {type: string}
        - in: query
          name: leader_run_id
          schema: {type: string}
        - in: query
          name: leader_node_id
          schema: {type: string}
        - in: query
          name: bypass_read
          schema: {type: boolean}
      responses:
        "200":
          description: The waiter's status, position, and leader outcome.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResolveWaiterResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/concurrency/{key}/cancel-waiter:
    parameters: [{$ref: "#/components/parameters/ConcurrencyKey"}]
    post:
      x-sparkwing-scope: admin
      tags: [concurrency]
      summary: Drop one waiter from a key's queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id]
              properties:
                run_id: {type: string}
                node_id: {type: string}
      responses:
        "200":
          description: Whether a waiter row was removed.
          content:
            application/json:
              schema:
                type: object
                required: [cancelled]
                properties:
                  cancelled: {type: boolean}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/concurrency/{key}/force-release:
    parameters: [{$ref: "#/components/parameters/ConcurrencyKey"}]
    post:
      x-sparkwing-scope: admin
      tags: [concurrency]
      summary: Drop superseded holders and promote the next waiters.
      description: |
        Releases every holder the store marked superseded, then promotes
        waiters into the slots that freed. The operator escape hatch for a
        key whose holders died without releasing.
      responses:
        "200":
          description: The holders that were dropped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dropped:
                    type: array
                    items: {$ref: "#/components/schemas/ConcurrencyHolder"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/queue/state:
    get:
      x-sparkwing-scope: runs.read
      tags: [concurrency]
      summary: Snapshot every concurrency key, holder, waiter, and runner.
      description: |
        One deployment-wide view for the queue dashboard: per-key capacity
        and cost held, the live holders, the waiting nodes with their
        positions, and the headroom each runner last reported.
      responses:
        "200":
          description: The queue snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      type: object
                      properties:
                        key: {type: string}
                        capacity: {type: number}
                        held: {type: number}
                  holders:
                    type: array
                    items:
                      type: object
                      properties:
                        run_id: {type: string}
                        semaphores:
                          type: array
                          items: {type: string}
                        elapsed_ms: {type: integer, format: int64}
                        origin: {type: string}
                  waiters:
                    type: array
                    items:
                      type: object
                      properties:
                        run_id: {type: string}
                        position: {type: integer}
                        waiting_on:
                          type: array
                          items: {type: string}
                        waiting_ms: {type: integer, format: int64}
                        origin: {type: string}
                  runners:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        cores: {type: number}
                        memory_bytes: {type: integer, format: int64}
                        queue_depth: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/nodes/claim:
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Claim the oldest ready, unclaimed node matching labels.
      description: |
        The claim binds to the claiming token -- its prefix segment and
        principal name -- as well as to `holder_id`. The per-node write
        routes and the execution view then admit that token alone while
        the lease is unexpired; another runner token gets `403` with
        `"error": "claim_required"`, even one carrying the same principal
        name. `lease_secs` is clamped to the server cap of 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holder_id]
              properties:
                holder_id: {type: string}
                lease_secs: {type: integer}
                labels:
                  type: array
                  items: {type: string}
      responses:
        "200":
          description: Claimed node.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Node"}
        "204": {description: Nothing to claim.}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/pool:
    get:
      x-sparkwing-scope: runs.read
      tags: [pool]
      summary: List warm-PVC pool. **cluster-only** (requires `AttachPool`).
      responses:
        "200":
          description: Pool snapshot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PoolListResponse"}
        "503": {description: Pool not ready.}

  /api/v1/pool/checkout:
    post:
      x-sparkwing-scope: admin
      tags: [pool]
      summary: Check out a clean PVC. **cluster-only**.
      parameters:
        - in: query
          name: job_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Checked-out PVC name.
          content:
            application/json:
              schema:
                type: object
                required: [pvc]
                properties:
                  pvc: {type: string}
        "409": {description: No clean PVC available -- fall back to cache-less build.}

  /api/v1/pool/return:
    post:
      x-sparkwing-scope: admin
      tags: [pool]
      summary: Return a PVC to the pool (marks it dirty). **cluster-only**.
      parameters:
        - in: query
          name: pvc
          required: true
          schema: {type: string}
      responses:
        "204": {description: Returned.}

  /api/v1/pool/heartbeat:
    post:
      x-sparkwing-scope: admin
      tags: [pool]
      summary: Keep ownership of an in-use PVC alive. **cluster-only**.
      parameters:
        - in: query
          name: pvc
          required: true
          schema: {type: string}
        - in: query
          name: job_id
          required: true
          schema: {type: string}
      responses:
        "204": {description: Renewed.}
        "409": {description: Heartbeat lost (job_id mismatch or PVC expired).}

  /api/v1/artifacts/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema: {type: string}
        description: Content-addressed artifact key.
    get:
      x-sparkwing-scope: runs.read
      tags: [artifacts]
      summary: Stream an artifact's bytes. **laptop-only** (requires `WithArtifactStore`).
      responses:
        "200":
          description: Artifact bytes.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/tokens:
    post:
      x-sparkwing-scope: admin
      tags: [tokens]
      summary: Mint a new bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateTokenRequest"}
      responses:
        "201":
          description: New token (raw value is included **once** in this response).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreateTokenResponse"}
        "400":
          description: >-
            Invalid request: missing principal or kind, or a scope the controller does not honor (the message names the offending scope and the valid set).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    get:
      x-sparkwing-scope: admin
      tags: [tokens]
      summary: List all tokens (no raw values).
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: {$ref: "#/components/schemas/Token"}

  /api/v1/tokens/{prefix}:
    parameters:
      - in: path
        name: prefix
        required: true
        schema: {type: string, description: The 12-char prefix returned at mint.}
    get:
      x-sparkwing-scope: admin
      tags: [tokens]
      summary: Lookup a token by prefix.
      responses:
        "200":
          description: Token (no raw value).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Token"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      x-sparkwing-scope: admin
      tags: [tokens]
      summary: Revoke a token by prefix.
      responses:
        "204": {description: Revoked.}

  /api/v1/tokens/{prefix}/rotate:
    parameters:
      - in: path
        name: prefix
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: admin
      tags: [tokens]
      summary: Mint a replacement; mark the prior token revoked + replaced_by.
      responses:
        "200":
          description: New token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreateTokenResponse"}

  /api/v1/users:
    get:
      x-sparkwing-scope: admin
      tags: [users]
      summary: List local-account users.
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: {$ref: "#/components/schemas/User"}
    post:
      x-sparkwing-scope: admin
      tags: [users]
      summary: Create a user, or bootstrap the first administrator.
      description: |
        Answers without a credential while the users table is empty, and
        goes back to demanding the route's scope once any user exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: {type: string}
                password: {type: string}
                scopes:
                  type: array
                  description: >-
                    Scopes this account's dashboard sessions carry. Omit to grant admin. Ignored on the bootstrap path, which always creates an admin.
                  items: {type: string}
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "409": {description: Bootstrap race lost.}

  /api/v1/users/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: {type: string}
    delete:
      x-sparkwing-scope: admin
      tags: [users]
      summary: Delete a user.
      responses:
        "204": {description: Deleted.}

  /api/v1/auth/login:
    post:
      x-sparkwing-scope: public
      tags: [auth]
      summary: Exchange username + password for a session id + CSRF token.
      description: Unauthenticated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                type: object
                required: [session_id, csrf_token, principal, scopes, expires_at]
                properties:
                  session_id: {type: string}
                  csrf_token: {type: string}
                  principal: {type: string}
                  scopes:
                    type: array
                    items: {type: string}
                  expires_at: {type: integer, format: int64, description: Unix seconds.}

  /api/v1/auth/logout:
    post:
      x-sparkwing-scope: public
      tags: [auth]
      summary: Delete a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: {type: string}
      responses:
        "204": {description: Logged out.}

  /api/v1/auth/session:
    get:
      x-sparkwing-scope: public
      tags: [auth]
      summary: "Resolve a session id (sent via `Authorization: Session <id>`) to the principal."
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Session info.
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal: {type: string}
                  scopes:
                    type: array
                    items: {type: string}
                  expires_at: {type: integer, format: int64}

  /api/v1/auth/whoami:
    get:
      x-sparkwing-scope: authenticated
      tags: [auth]
      summary: Resolve the bearer token to the principal.
      responses:
        "200":
          description: Principal info.
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal: {type: string}
                  scopes:
                    type: array
                    items: {type: string}
                  kind: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/auth/bootstrap-needed:
    get:
      x-sparkwing-scope: public
      tags: [auth]
      summary: Whether the users table is empty (first-run probe).
      security: []
      responses:
        "200":
          description: "Cached check (one-way: once false, stays false)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  needed: {type: boolean}

  /api/v1/secrets:
    post:
      x-sparkwing-scope: admin
      tags: [secrets]
      summary: Create or replace a secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              properties:
                name: {type: string}
                value: {type: string}
                masked: {type: boolean}
      responses:
        "201": {description: Created.}
    get:
      x-sparkwing-scope: admin
      tags: [secrets]
      summary: List secrets (metadata only; values are never returned in list).
      responses:
        "200":
          description: Secrets list.
          content:
            application/json:
              schema:
                type: object
                required: [secrets]
                properties:
                  secrets:
                    type: array
                    items: {$ref: "#/components/schemas/Secret"}

  /api/v1/secrets/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: {type: string}
    get:
      x-sparkwing-scope: secrets.read
      tags: [secrets]
      summary: Read one secret (value included).
      responses:
        "200":
          description: Secret.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Secret"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      x-sparkwing-scope: admin
      tags: [secrets]
      summary: Delete a secret.
      responses:
        "204": {description: Deleted.}

  /api/v1/agents:
    get:
      x-sparkwing-scope: runs.read
      tags: [agents]
      summary: List recently-heartbeating runners.
      responses:
        "200":
          description: Agents.
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: {$ref: "#/components/schemas/Agent"}

  /api/v1/trends:
    get:
      x-sparkwing-scope: runs.read
      tags: [trends]
      summary: Aggregate counts for the dashboard's overview chart.
      description: |
        Returns one `TrendPoint` per time bucket over the requested
        window. `hours` defaults to 24 and is capped at 14 days
        (336 hours). When `pipeline` is supplied, only runs of that
        pipeline are included and the response echoes the filter
        back in the top-level `pipeline` field.
      parameters:
        - in: query
          name: hours
          schema: {type: integer, minimum: 1, maximum: 336, default: 24}
        - in: query
          name: pipeline
          schema: {type: string}
      responses:
        "200":
          description: Trend data.
          content:
            application/json:
              schema:
                type: object
                required: [points]
                properties:
                  points:
                    type: array
                    items: {$ref: "#/components/schemas/TrendPoint"}
                  pipeline:
                    type: string
                    description: Echoed back only when the request filtered by pipeline.

  /api/v1/pipelines/{name}/latest:
    parameters:
      - in: path
        name: name
        required: true
        schema: {type: string}
    get:
      x-sparkwing-scope: runs.read
      tags: [pipelines]
      summary: The latest matching run for a pipeline (cross-pipeline-ref read).
      parameters:
        - in: query
          name: status
          schema: {type: string}
          description: csv of statuses (default `success`).
        - in: query
          name: max_age
          schema: {type: string, format: duration}
      responses:
        "200":
          description: Latest run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/pipelines/{name}/profile:
    parameters: [{$ref: "#/components/parameters/PipelineName"}]
    get:
      x-sparkwing-scope: nodes.claim
      tags: [pipelines]
      summary: Read a pipeline's measured resource profile.
      description: |
        Returns the cores and memory sparkwing measured for past runs, plus
        any operator pin. `?node=` narrows it to one node; omitting it
        answers the pipeline-wide profile. A runner reads this to size the
        work it is about to admit.
      parameters:
        - in: query
          name: node
          schema: {type: string}
      responses:
        "200":
          description: The stored profile.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: No profile recorded for this pipeline or node.}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/pipelines/{name}/profile/pin:
    parameters: [{$ref: "#/components/parameters/PipelineName"}]
    put:
      x-sparkwing-scope: runs.state
      tags: [pipelines]
      summary: Pin or clear a pipeline's resource profile.
      description: |
        A pin overrides what sparkwing measured. A body whose `cores` and
        `memory_bytes` are both zero or negative clears the pin instead of
        setting one.
      parameters:
        - in: query
          name: node
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cores: {type: number}
                memory_bytes: {type: integer, format: int64}
      responses:
        "204": {description: Pin written or cleared. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/gitcache/refresh:
    post:
      x-sparkwing-scope: runs.write
      tags: [gitcache]
      summary: Refresh the cache's mirror of a repository.
      description: |
        Proxied to the cache's `/git/refresh`. `repo` is validated with the
        clone-URL rules, so it cannot name a local path, a loopback or
        private address, or a URL carrying embedded credentials.
      parameters:
        - {$ref: "#/components/parameters/GitcacheRepo"}
      responses:
        "200": {description: "The cache's answer, forwarded verbatim."}
        "400": {description: Missing or rejected repo URL.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "502": {description: The cache is unreachable or answered badly.}
        "503": {description: No cache is configured on this controller.}

  /api/v1/gitcache/seed:
    post:
      x-sparkwing-scope: admin
      tags: [gitcache]
      summary: Push a pack of objects into the cache's mirror.
      description: |
        Proxied to the cache's `/sync/seed` with a 500 MiB body cap.
        `workspace=1` seeds an uncommitted working-tree snapshot instead of
        a committed ref.
      parameters:
        - {$ref: "#/components/parameters/GitcacheRepo"}
        - in: query
          name: sha
          required: true
          schema: {type: string, pattern: "^[0-9a-f]{40,64}$"}
          description: Hex object id the pack tips at.
        - in: query
          name: workspace
          schema: {type: string, enum: ["1"]}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200": {description: "The cache's answer, forwarded verbatim."}
        "400": {description: "Missing or rejected repo URL, sha, or workspace flag."}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "502": {description: The cache is unreachable or answered badly.}
        "503": {description: No cache is configured on this controller.}

  /api/v1/gitcache/git/register:
    post:
      x-sparkwing-scope: admin
      tags: [gitcache]
      summary: Map a short cache name onto a repository URL.
      parameters:
        - in: query
          name: name
          required: true
          schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,64}$"}
        - {$ref: "#/components/parameters/GitcacheRepo"}
      responses:
        "200": {description: "The cache's answer, forwarded verbatim."}
        "400": {description: Rejected name or repo URL.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "502": {description: The cache is unreachable or answered badly.}
        "503": {description: No cache is configured on this controller.}

  /api/v1/gitcache/git/{path}:
    parameters:
      - in: path
        name: path
        required: true
        schema: {type: string}
        description: |
          `<registered-name>/info/refs` or `<registered-name>/git-upload-pack`.
          Registered by `POST /api/v1/gitcache/git/register`.
    get:
      x-sparkwing-scope: admin
      tags: [gitcache]
      summary: Advertise a mirror's refs to a Git client.
      description: |
        Forwards `info/refs?service=git-upload-pack` to the cache. Any other
        suffix or service answers `405`, so the proxy carries reads only.
        The controller drops the caller's bearer and presents its own cache
        token, and caps how many Git streams one caller may hold open.
      parameters:
        - in: query
          name: service
          required: true
          schema: {type: string, enum: [git-upload-pack]}
      responses:
        "200": {description: Git smart-protocol ref advertisement.}
        "400": {description: The path does not name a registered mirror.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "405": {description: Anything but an upload-pack ref advertisement.}
        "502": {description: The cache is unreachable or answered badly.}
        "503": {description: No cache is configured on this controller.}
    post:
      x-sparkwing-scope: admin
      tags: [gitcache]
      summary: Serve a Git fetch negotiation from a mirror.
      description: |
        Forwards `git-upload-pack` to the cache. Any other suffix answers
        `405`, so a caller cannot push through this proxy.
      requestBody:
        required: true
        content:
          application/x-git-upload-pack-request:
            schema: {type: string, format: binary}
      responses:
        "200": {description: Git smart-protocol packfile response.}
        "400": {description: The path does not name a registered mirror.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "405": {description: Anything but an upload-pack fetch.}
        "502": {description: The cache is unreachable or answered badly.}
        "503": {description: No cache is configured on this controller.}

  /webhooks/github/{pipeline}:
    parameters:
      - in: path
        name: pipeline
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: public
      tags: [webhooks]
      summary: GitHub webhook intake. HMAC-verified; no bearer auth.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub webhook payload (push, pull_request, ...).
      responses:
        "202": {description: Accepted; trigger queued.}
        "400": {description: Missing X-GitHub-Delivery header or undecodable payload.}
        "401": {description: "Invalid HMAC signature, or no secret covers the named repository."}
        "404": {description: The repository is not bound to this pipeline.}
        "409": {description: This body was already accepted; the run it produced is in run_id.}
        "503": {description: GitHub webhook secret not configured anywhere.}

  /api/v1/services:
    get:
      x-sparkwing-scope: authenticated
      tags: [health]
      summary: Announce the cache and logs URLs a runner should use.
      description: |
        Any valid bearer satisfies this route, and every client that reads
        it already holds one. A field is absent when the controller was
        started without the matching flag; a co-located laptop deployment
        announces neither, because there the controller URL is already the
        right answer.
      responses:
        "200":
          description: The announced URLs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cache_pod: {type: string}
                  logs: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: This controller announces no services.}

  /api/v1/health:
    get:
      x-sparkwing-scope: public
      tags: [health]
      summary: Process liveness probe.
      security: []
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ok]}

  /metrics:
    get:
      x-sparkwing-scope: public
      tags: [health]
      summary: Prometheus scrape endpoint.
      security: []
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema: {type: string}

  /api/v1/runs/{id}/gitcache/git/register:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: nodes.claim
      summary: Registered route awaiting a description.
      description: Seeded by internal/apispec from the route table. Replace this text with what the route does, what it accepts, and what it answers.
      responses:
        default: {description: Undescribed.}

  /api/v1/runs/{id}/gitcache/git/{path}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: path
        name: path
        required: true
        schema: {type: string}
    get:
      x-sparkwing-scope: nodes.claim
      summary: Registered route awaiting a description.
      description: Seeded by internal/apispec from the route table. Replace this text with what the route does, what it accepts, and what it answers.
      responses:
        default: {description: Undescribed.}
    post:
      x-sparkwing-scope: nodes.claim
      summary: Registered route awaiting a description.
      description: Seeded by internal/apispec from the route table. Replace this text with what the route does, what it accepts, and what it answers.
      responses:
        default: {description: Undescribed.}

  /api/v1/maintenance/reconcile-orphans:
    post:
      x-sparkwing-scope: admin
      tags: [runs]
      summary: Close runs whose orchestrator process died.
      description: |
        Finishes every run still marked running whose run and node heartbeats
        are all older than `threshold_nanos`, cascading its pending nodes to
        cancelled, and answers how many runs it closed. The threshold must be
        positive: zero would treat every running run as orphaned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [threshold_nanos]
              properties:
                threshold_nanos: {type: integer, format: int64}
      responses:
        "200":
          description: Sweep complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reconciled: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/pipelines/{name}/profile/contention:
    parameters: [{$ref: "#/components/parameters/PipelineName"}]
    post:
      x-sparkwing-scope: runs.state
      tags: [pipelines]
      summary: Count one contended run against a pipeline.
      description: |
        Records that a run of this pipeline was throttled by host contention,
        which admission reads when deciding how much headroom to leave. Takes
        no body.
      responses:
        "204": {description: Contention counted. Empty body.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/pipelines/{name}/profile/observations:
    parameters: [{$ref: "#/components/parameters/PipelineName"}]
    post:
      x-sparkwing-scope: runs.state
      tags: [pipelines]
      summary: Fold one run's measurement into a pipeline's profile.
      description: |
        The measured cost of a finished run, which becomes what later runs of
        this pipeline are charged. An empty `node` targets the pipeline
        rollup. A `contended` observation feeds the demand floor only, and
        carries `floor_cores` and `floor_memory_bytes` rather than peaks.
      parameters:
        - in: query
          name: node
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                duration_nanos: {type: integer, format: int64}
                peak_cores: {type: number}
                peak_memory_bytes: {type: integer, format: int64}
                sustained_cores: {type: number}
                cpu_measured: {type: boolean}
                plan_hash: {type: string}
                contended: {type: boolean}
                floor_cores: {type: number}
                floor_memory_bytes: {type: integer, format: int64}
      responses:
        "204": {description: Observation folded. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/pipelines/{name}/profile/waits:
    parameters: [{$ref: "#/components/parameters/PipelineName"}]
    post:
      x-sparkwing-scope: runs.state
      tags: [pipelines]
      summary: Record how long a run queued for admission.
      description: |
        The wall time between submitting a run for admission and being
        admitted, which the queue view reports as this pipeline's typical
        wait.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wait_nanos]
              properties:
                wait_nanos: {type: integer, format: int64}
      responses:
        "204": {description: Wait recorded. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/nodes/{nodeID}/usage:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Fold a finished process's accounting into a node row.
      description: |
        Exact CPU time, peak RSS, and wall time read from a node process after
        it was reaped. Separate from finishing the node because the figures do
        not exist until the process exits, and the process that wrote the
        node's outcome is not the one that can read them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cpu_time_nanos: {type: integer, format: int64}
                max_rss_bytes: {type: integer, format: int64}
                wall_nanos: {type: integer, format: int64}
      responses:
        "204": {description: Usage folded. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/triggers/pending-for-parent:
    get:
      x-sparkwing-scope: triggers.read
      summary: List a parent run's unclaimed child triggers.
      description: |
        Trigger ids spawned by `parent_run_id` that no consumer holds, oldest
        first. The parent filter is what keeps two runs on one machine from
        dispatching each other's children.
      parameters:
        - in: query
          name: parent_run_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Candidate trigger ids.
          content:
            application/json:
              schema:
                type: object
                properties:
                  trigger_ids: {type: array, items: {type: string}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/triggers/{id}/claim:
    parameters: [{$ref: "#/components/parameters/TriggerID"}]
    post:
      x-sparkwing-scope: triggers.claim
      summary: Claim one named trigger.
      description: |
        Takes the lease on a trigger the caller already chose, unlike
        `/api/v1/triggers/claim` which picks the next queued one. 404 means
        the trigger is gone or another consumer holds it, so the caller moves
        on to its next candidate.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lease_nanos: {type: integer, format: int64}
      responses:
        "200":
          description: The claimed trigger.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Trigger"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <token>` with a `sw*_`-prefixed token
        issued by `POST /api/v1/tokens`. The token's scopes (e.g.
        `runs.read`, `nodes.claim`, `admin`) gate per-route access.
    sessionAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        `Authorization: Session <session-id>`. Used only by the
        dashboard's browser flow after `POST /api/v1/auth/login`.
  parameters:
    RunID:
      in: path
      name: id
      required: true
      schema: {type: string}
      description: Run id (e.g. `run-20260519-150405-a1b2`).
    NodeID:
      in: path
      name: nodeID
      required: true
      schema: {type: string}
    TriggerID:
      in: path
      name: id
      required: true
      schema: {type: string}
    PipelineName:
      in: path
      name: name
      required: true
      schema: {type: string}
      description: Pipeline name as declared in `.sparkwing/sparkwing.yaml`.
    ConcurrencyKey:
      in: path
      name: key
      required: true
      schema: {type: string}
      description: Concurrency group key, global across the deployment.
    GitcacheRepo:
      in: query
      name: repo
      required: true
      schema: {type: string}
      description: |
        Clone URL. Validated before proxying: a local path, a loopback or
        private address, and a URL carrying embedded credentials are all
        refused.
  responses:
    BadRequest:
      description: Invalid request (missing field, malformed JSON).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AuthError"}
    Forbidden:
      description: Token does not carry the scope this route requires.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AuthError"}
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InternalError:
      description: Unhandled server error.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      description: Canonical error shape for non-2xx responses.
      required: [error]
      properties:
        error: {type: string}
    AuthError:
      type: object
      description: Error returned by the auth middleware. Carries a missing-scope hint when applicable.
      required: [error]
      properties:
        error: {type: string}
        missing_scope: {type: string}
    Run:
      type: object
      description: One pipeline invocation row. Mirrors `pkg/store.Run`.
      required: [id, pipeline, status, started_at]
      properties:
        id: {type: string}
        pipeline: {type: string}
        status:
          type: string
          description: e.g. `pending`, `running`, `success`, `failed`, `cancelled`, `timed_out`.
        trigger_source: {type: string}
        git_branch: {type: string}
        git_sha: {type: string}
        args:
          type: object
          description: >-
            Arguments the run was started with. Values of arguments the pipeline declared `secret:"true"` are replaced with `***`; `invocation.secret_args` names them. Runs started before that classification existed carry no `secret_args` and are returned unredacted.
          additionalProperties: {type: string}
        error: {type: string}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}
        parent_run_id: {type: string}
        repo: {type: string}
        repo_url: {type: string}
        github_owner: {type: string}
        github_repo: {type: string}
        retry_of: {type: string}
        retried_as: {type: string}
        retry_source:
          type: string
          enum: ["", manual, auto]
        replay_of_run_id: {type: string}
        replay_of_node_id: {type: string}
        invocation:
          type: object
          description: >-
            Free-form snapshot of run-start context (flags, args, binary_source, cwd, ...). `secret_args` lists the argument names the pipeline declared secret; their values are replaced with `***` in `invocation.args` and in the `invocation.reproducer` command line before the response is written.
          additionalProperties: true
        annotation_count: {type: integer}
        top_annotation: {type: string}
        annotations:
          type: array
          items: {type: string}
    Node:
      type: object
      description: One DAG node row. Mirrors `pkg/store.Node`.
      required: [id, status, deps]
      properties:
        run_id: {type: string}
        id: {type: string, description: Node id within the run.}
        status:
          type: string
          description: e.g. `pending`, `running`, `done`, `approval_pending`.
        outcome: {type: string}
        deps:
          type: array
          items: {type: string}
        error: {type: string}
        output:
          type: string
          format: byte
          description: Raw JSON of the job's run output. Opaque to the controller.
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        ready_at: {type: string, format: date-time, nullable: true}
        claimed_by: {type: string}
        lease_expires_at: {type: string, format: date-time, nullable: true}
        needs_labels:
          type: array
          items: {type: string}
        status_detail: {type: string}
        last_heartbeat: {type: string, format: date-time, nullable: true}
        failure_reason: {type: string}
        exit_code: {type: integer, nullable: true}
        annotations:
          type: array
          items: {type: string}
        summary: {type: string}
    NodeStep:
      type: object
      description: One step inside a node's inner DAG. Mirrors `pkg/store.NodeStep`.
      required: [node_id, step_id, status]
      properties:
        run_id: {type: string}
        node_id: {type: string}
        step_id: {type: string}
        status:
          type: string
          enum: [running, passed, failed, skipped]
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        annotations:
          type: array
          items: {type: string}
        summary: {type: string}
    Event:
      type: object
      description: One ordered event in a run's audit stream. Mirrors `pkg/store.Event`.
      required: [run_id, seq, kind, ts]
      properties:
        run_id: {type: string}
        seq: {type: integer, format: int64}
        node_id: {type: string}
        kind: {type: string}
        ts: {type: string, format: date-time}
        payload:
          description: Either a structured JSON object or a raw string (escaped).
    NodeDispatch:
      type: object
      description: >-
        One dispatch-frame snapshot for a node attempt. Mirrors `pkg/store.NodeDispatch`. The byte-typed members carry base64-encoded JSON.
      properties:
        run_id: {type: string}
        node_id: {type: string}
        seq: {type: integer}
        dispatched_at: {type: string, format: date-time}
        code_version: {type: string}
        binary_hash: {type: string}
        runner_labels:
          type: string
          format: byte
          description: JSON `[]string` of the labels the dispatch required.
        env_json:
          type: string
          format: byte
          description: >-
            JSON `map[string]string` of the captured environment. Present only for an `admin` principal; a `runs.read` principal gets the row with this member absent.
        redacted_keys:
          type: string
          format: byte
          description: >-
            JSON `[]string` naming the variables the snapshot dropped as credential-shaped. Served to every reader of the row.
        workdir: {type: string}
        input_envelope_json:
          type: string
          format: byte
          description: JSON dispatch envelope; over-cap rows store a truncation stub.
        input_size_bytes: {type: integer, format: int64}
        secret_redactions: {type: integer}
    MetricSample:
      type: object
      description: One metric data point attached to a node.
      properties:
        ts: {type: string, format: date-time}
        name: {type: string}
        value: {type: number}
        labels:
          type: object
          additionalProperties: {type: string}
    Trigger:
      type: object
      description: One queued or in-flight trigger. Mirrors `pkg/store.Trigger`.
      required: [id, pipeline, status, created_at]
      properties:
        id: {type: string}
        pipeline: {type: string}
        args:
          type: object
          additionalProperties: {type: string}
        trigger_source: {type: string}
        trigger_user: {type: string}
        trigger_env:
          type: object
          additionalProperties: {type: string}
        git_branch: {type: string}
        git_sha: {type: string}
        status:
          type: string
          enum: [pending, claimed, done]
        created_at: {type: string, format: date-time}
        claimed_at: {type: string, format: date-time, nullable: true}
        lease_expires_at: {type: string, format: date-time, nullable: true}
        parent_run_id: {type: string}
        repo: {type: string}
        repo_url: {type: string}
        github_owner: {type: string}
        github_repo: {type: string}
        retry_of: {type: string}
        retry_source:
          type: string
          enum: ["", manual, auto]
        parent_node_id: {type: string}
        full: {type: boolean}
    TriggerRequest:
      type: object
      description: Body of `POST /api/v1/triggers`. `trigger.source` is required.
      required: [pipeline, trigger]
      properties:
        pipeline: {type: string}
        args:
          type: object
          additionalProperties: {type: string}
        trigger:
          type: object
          required: [source]
          properties:
            source: {type: string}
            user: {type: string}
            env:
              type: object
              additionalProperties: {type: string}
        git:
          type: object
          properties:
            branch: {type: string}
            sha: {type: string}
            repo: {type: string}
            repo_url: {type: string}
            github_owner: {type: string}
            github_repo: {type: string}
        parent_run_id: {type: string}
        parent_node_id: {type: string}
        retry_of: {type: string}
        plan_admission: {$ref: "#/components/schemas/TriggerPlanAdmission"}
    TriggerPlanAdmission:
      type: object
      description: Inherited plan-admission holders forwarded from an ancestor run.
      properties:
        key:
          type: string
          description: Primary inherited concurrency key.
        holder_id:
          type: string
          description: Holder id for `key`.
        admissions:
          type: object
          description: Full inherited admission set keyed by concurrency key.
          additionalProperties: {type: string}
        host_admission:
          type: boolean
          description: Whether one inherited holder owns host execution admission.
        host_admission_key:
          type: string
          description: Key in `admissions` whose holder owns host execution admission.
    Approval:
      type: object
      description: One human-gate row. Mirrors `pkg/store.Approval`.
      required: [run_id, node_id, requested_at]
      properties:
        run_id: {type: string}
        node_id: {type: string}
        requested_at: {type: string, format: date-time}
        message: {type: string}
        timeout_ms: {type: integer, format: int64}
        on_timeout:
          type: string
          enum: [fail, deny, approve]
        approver: {type: string}
        resolved_at: {type: string, format: date-time, nullable: true}
        resolution:
          type: string
          enum: ["", approved, denied, timed_out]
        comment: {type: string}
    DebugPause:
      type: object
      description: Operator-induced node pause.
      required: [run_id, node_id, reason, paused_at, expires_at]
      properties:
        run_id: {type: string}
        node_id: {type: string}
        reason: {type: string}
        paused_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        released_at: {type: string, format: date-time, nullable: true}
        released_by: {type: string}
        release_kind: {type: string}
    Token:
      type: object
      description: One bearer-token row (raw value redacted; only `prefix` is shown after mint).
      properties:
        prefix: {type: string}
        principal: {type: string}
        kind: {type: string}
        scopes:
          type: array
          items: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, nullable: true}
        last_used_at: {type: string, format: date-time, nullable: true}
        revoked_at: {type: string, format: date-time, nullable: true}
        replaced_by: {type: string}
    CreateTokenRequest:
      type: object
      required: [principal, scopes]
      properties:
        principal: {type: string}
        kind: {type: string}
        scopes:
          type: array
          items: {type: string}
        expires_at: {type: string, format: date-time}
    CreateTokenResponse:
      type: object
      description: Returned only at mint time. The raw `token` is never re-served.
      required: [token, prefix]
      properties:
        token:
          type: string
          description: Full bearer token. Copy now; the controller never re-shows it.
        prefix: {type: string}
        token_metadata: {$ref: "#/components/schemas/Token"}
    Secret:
      type: object
      description: One stored secret. List endpoints redact `value`.
      required: [name]
      properties:
        name: {type: string}
        value: {type: string}
        principal: {type: string}
        masked: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    User:
      type: object
      required: [name, created_at]
      properties:
        name: {type: string}
        scopes:
          type: array
          description: Scopes this account's dashboard sessions carry.
          items: {type: string}
        created_at:
          type: integer
          format: int64
          description: Unix seconds.
        last_login_at:
          type: integer
          format: int64
          nullable: true
    Agent:
      type: object
      description: Heartbeating runner.
      properties:
        id: {type: string}
        labels:
          type: array
          items: {type: string}
        last_heartbeat: {type: string, format: date-time}
        in_flight_node:
          type: object
          properties:
            run_id: {type: string}
            node_id: {type: string}
    TrendPoint:
      type: object
      description: |
        One time bucket of the dashboard's overview chart. Bucket
        width is one hour for windows <=48h, three hours for
        windows <=7 days, otherwise one day. Cached counts a run
        when every node finished with outcome `cached` or
        `satisfied`.
      required: [bucket, total, passed, failed, cached, avg_dur_ms, p95_dur_ms, avg_wait_ms]
      properties:
        bucket:
          type: string
          format: date-time
          description: RFC3339 timestamp at the bucket boundary (UTC).
        total: {type: integer, description: Runs started in this bucket.}
        passed: {type: integer, description: Runs with status `success` and at least one non-cached node.}
        failed: {type: integer, description: Runs with status `failed`.}
        cached: {type: integer, description: Runs where every node was `cached` / `satisfied`.}
        avg_dur_ms:
          type: integer
          format: int64
          description: Mean duration of finished runs in this bucket (ms).
        p95_dur_ms:
          type: integer
          format: int64
          description: 95th-percentile duration of finished runs in this bucket (ms).
        avg_wait_ms:
          type: integer
          format: int64
          description: |
            Mean intake-to-start latency (`started_at -
            created_at`) in milliseconds across the bucket's runs.
            Runs with a zero `created_at` (legacy sentinel from
            before the column was added) or with `created_at >
            started_at` (clock skew) are excluded from the
            average; a bucket containing only such runs reports
            zero.
    Receipt:
      type: object
      description: |
        Per-run audit + cost receipt. Recomputed from nodes,
        dispatches, and the controller's cost rate (when configured).
      properties:
        run_id: {type: string}
        pipeline: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}
        compute_cents: {type: integer}
        cost_rate_source: {type: string}
        nodes:
          type: array
          description: Per-node line items.
          items:
            type: object
            additionalProperties: true
    AcquireSlotRequest:
      type: object
      required: [holder_id, run_id]
      properties:
        holder_id: {type: string}
        run_id: {type: string}
        node_id: {type: string}
        max:
          type: integer
          description: Capacity for this key. Set on every acquire; latest write wins per the store's drift-handling rule.
        policy:
          type: string
          description: e.g. `queue`, `cancel_others`, `skip`, `coalesce`.
        cache_key_hash: {type: string}
        cache_ttl_ns: {type: integer, format: int64}
        cancel_timeout_ns: {type: integer, format: int64}
        lease_secs: {type: integer}
    AcquireSlotResponse:
      type: object
      required: [kind, granted]
      properties:
        granted: {type: boolean}
        kind:
          type: string
          enum: [granted, cached, queued, coalesced, cancelling_others, skipped, failed]
        holder_id: {type: string}
        lease_expires_at: {type: string, format: date-time}
        leader_run_id: {type: string}
        leader_node_id: {type: string}
        output_ref: {type: string}
        origin_run_id: {type: string}
        origin_node_id: {type: string}
        superseded_ids:
          type: array
          items: {type: string}
        previous_capacity: {type: integer}
        drift_note: {type: string}
    ConcurrencyHolder:
      type: object
      description: One live or superseded holder of a concurrency slot.
      properties:
        holder_id: {type: string}
        run_id: {type: string}
        node_id: {type: string}
        claimed_at: {type: string, format: date-time}
        lease_expires_at: {type: string, format: date-time}
        superseded: {type: boolean}
    ResolveWaiterResponse:
      type: object
      description: One waiter's standing in a concurrency key's queue.
      required: [status]
      properties:
        status: {type: string}
        holder_id: {type: string}
        holder_lease_expires: {type: string, format: date-time}
        output_ref: {type: string}
        origin_run_id: {type: string}
        origin_node_id: {type: string}
        leader_run_id: {type: string}
        leader_node_id: {type: string}
        leader_outcome: {type: string}
        leader_failure_reason: {type: string}
        position: {type: integer}
        queue_length: {type: integer}
        holders:
          type: array
          items: {$ref: "#/components/schemas/ConcurrencyHolder"}
    NodeBounce:
      type: object
      description: A request that a running node restart its process.
      properties:
        run_id: {type: string}
        node_id: {type: string}
        seq: {type: integer, format: int64}
        requested_by: {type: string}
        requested_at: {type: string, format: date-time}
        outcome: {type: string}
    ConcurrencyState:
      type: object
      required: [key, capacity, holders, waiters]
      properties:
        key: {type: string}
        capacity: {type: integer}
        holders:
          type: array
          items:
            type: object
            properties:
              holder_id: {type: string}
              run_id: {type: string}
              node_id: {type: string}
              claimed_at: {type: string, format: date-time}
              lease_expires_at: {type: string, format: date-time}
              superseded: {type: boolean}
        waiters:
          type: array
          items:
            type: object
            properties:
              run_id: {type: string}
              node_id: {type: string}
              arrived_at: {type: string, format: date-time}
              policy: {type: string}
              cache_key_hash: {type: string}
              leader_run_id: {type: string}
              leader_node_id: {type: string}
              cancel_timeout: {type: string}
    FinishRunRequest:
      type: object
      required: [status]
      properties:
        status: {type: string}
        error: {type: string}
    FinishNodeRequest:
      type: object
      required: [outcome]
      properties:
        outcome: {type: string}
        error: {type: string}
        output:
          type: string
          format: byte
          description: JSON-encoded raw output bytes.
        failure_reason: {type: string}
        exit_code: {type: integer, nullable: true}
    PoolListResponse:
      type: object
      description: Snapshot of the warm-PVC pool (cluster-only).
      properties:
        pool_size: {type: integer}
        pvc_size: {type: string}
        pvcs:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: {type: string}
              state:
                type: string
                enum: [clean, in-use, dirty, warming, unknown]
              warmed_at: {type: string}
              checked_out_by: {type: string}
              checked_out_at: {type: string}

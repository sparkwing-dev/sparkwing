                  kind: {type: string, enum: [github_app, ssh, https]}
                  host: {type: string, description: "The host the credential is bound to; the runner refuses to present it to any other."}
                  token: {type: string, description: "The App token, for kind github_app."}
                  expires_at: {type: integer, format: int64, description: Unix seconds the App token expires at.}
                  repository: {type: string, description: owner/name the App token reads.}

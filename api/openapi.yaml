        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: "The controller has no secrets key, or the team holds 50 credentials."}
        "502": {description: "The host's ssh host key could not be read."}


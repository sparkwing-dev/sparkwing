      summary: Exchange username + password for a session id + CSRF token.
      description: Unauthenticated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.loginReq
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.loginResp
                type: object
                required: [session_id, csrf_token, principal, scopes, expires_at]
                properties:
                  session_id: {type: string}
                  csrf_token: {type: string}
                  principal: {type: string}
                  scopes:
                    type: array
                    items: {type: string}
                  expires_at: {type: integer, format: int64, description: Unix seconds.}

  /api/v1/auth/logout:
    post:
      x-sparkwing-scope: public
      tags: [auth]
      summary: Delete a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.logoutReq
              type: object
              required: [session_id]
              properties:
                session_id: {type: string}
      responses:
        "204": {description: Logged out.}

  /api/v1/auth/session:
    get:
      x-sparkwing-scope: public
      tags: [auth]
      summary: "Resolve a session id (sent via `Authorization: Session <id>`) to the principal."
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Session info.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.sessionResp
                type: object
                properties:
                  principal: {type: string}
                  scopes:
                    type: array
                    items: {type: string}
                  csrf_token:
                    type: string
                    description: Token the dashboard echoes on each state-changing request.
                  expires_at: {type: integer, format: int64, description: Unix seconds.}
                  team:
                    type: string
                    description: Team the session acts for. `default` for a password session.
                  role:
                    type: string
                    enum: [owner, editor, reader]
                    description: The signed-in user's role in `team`, read from the membership on this request. Absent for a password session or a user no longer in `team`.
                  user_id:
                    type: string
                    description: Signed-in user behind an identity-provider session. Absent for a password session.

  /api/v1/auth/whoami:
    get:
      x-sparkwing-scope: authenticated
      tags: [auth]
      summary: Resolve the bearer token to the principal.
      responses:
        "200":
          description: Principal info.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.whoamiResp
                type: object
                properties:
                  principal: {type: string}
                  scopes:
                    type: array
                    items: {type: string}
                  kind: {type: string}
                  token_prefix:
                    type: string
                    description: Prefix of the bearer token that answered, absent for a session or anonymous principal.
                  team:
                    type: string
                    description: Team the request acts for, from the token or the session. Absent for an anonymous principal.
                  role:
                    type: string
                    enum: [owner, editor, reader]
                    description: The signed-in user's role in `team`. Absent for a token or a password session.
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/auth/bootstrap-needed:
    get:
      x-sparkwing-scope: public
      tags: [auth]
      summary: Whether the users table is empty (first-run probe).
      security: []
      responses:
        "200":
          description: "Cached check (one-way: once false, stays false)."
          content:
            application/json:
              schema:
                x-sparkwing-go-type: none
                type: object
                properties:
                  needed: {type: boolean}

  /api/v1/secrets:
    post:
      x-sparkwing-scope: admin or team.admin
      tags: [secrets]
      summary: Create or replace a secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.secretSetReq
              type: object
              required: [name, value]
              properties:
                name: {type: string}
                value: {type: string}
                pipeline:
                  type: string
                  description: Bind the secret to this pipeline. Omit for a principal-wide secret.
                masked:
                  type: boolean
                  description: Omit to store the value masked; only an explicit `false` stores plain config.
                shared:
                  type: boolean
                  description: Let an unscoped secret answer a run. Admin only.
      responses:
        "201": {description: Created.}
    get:
      x-sparkwing-scope: runs.read or team.admin
      tags: [secrets]
      summary: List secrets and variables.
      description: |
        Lists every row in the caller's team. A masked row (a secret) lists
        with its metadata only; its value is never returned here. An unmasked
        row (a variable) lists with its value, so any member who reads runs
        sees the team's variables.
      responses:
        "200":
          description: Secrets list.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: none
                type: object
                required: [secrets]
                properties:
                  secrets:
                    type: array
                    items: {$ref: "#/components/schemas/Secret"}

  /api/v1/secrets/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: {type: string}
    get:
      x-sparkwing-scope: secrets.read or team.admin
      tags: [secrets]
      summary: Read one secret (value included).
      description: |
        A masked row's value goes only to the operator's bearer token and to
        a runner reading through the run it has claimed. Every other caller,
        a dashboard session or a team owner's token included, gets `403`
        with error `write_only`; it may still read an unmasked variable.
        Every secrets response carries `Cache-Control: no-store`.
      responses:
        "200":
          description: Secret.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Secret"}
        "403": {description: The caller may not read this value.}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      x-sparkwing-scope: admin or team.admin
      tags: [secrets]
      summary: Delete a secret.
      responses:
        "204": {description: Deleted.}

  /api/v1/agents:
    get:
      x-sparkwing-scope: runs.read
      tags: [agents]
      summary: List recently-heartbeating runners.
      responses:
        "200":
          description: Agents.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: none
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: {$ref: "#/components/schemas/Agent"}

  /api/v1/trends:
    get:
      x-sparkwing-scope: runs.read
      tags: [trends]
      summary: Aggregate counts for the dashboard's overview chart.
      description: |
        Returns one `TrendPoint` per time bucket over the requested
        window. `hours` defaults to 24 and is capped at 14 days
        (336 hours). When `pipeline` is supplied, only runs of that
        pipeline are included and the response echoes the filter
        back in the top-level `pipeline` field.
      parameters:
        - in: query
          name: hours
          schema: {type: integer, minimum: 1, maximum: 336, default: 24}
        - in: query
          name: pipeline
          schema: {type: string}
      responses:
        "200":
          description: Trend data.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: none
                type: object
                required: [points]
                properties:
                  points:
                    type: array
                    items: {$ref: "#/components/schemas/TrendPoint"}
                  pipeline:
                    type: string
                    description: Echoed back only when the request filtered by pipeline.

  /api/v1/pipelines:
    get:
      x-sparkwing-scope: runs.read
      tags: [pipelines]
      summary: List the caller's team's pipelines, most recently active first.
      description: |
        A pipeline appears once the caller's team has a run, a trigger or a
        declared schedule for it. Each entry carries the pipeline's newest run
        by start time; a pipeline that has only been queued or scheduled has
        none. The team is the caller's, never one named in the request.
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 200}
          description: Most pipelines to return; values above 200 read as 200.
      responses:
        "200":
          description: The team's pipelines.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PipelinesList"}
        "400": {description: limit is not a positive integer.}
        "403": {description: The credential lacks the scope or acts for no team.}

  /api/v1/pipelines/{name}/latest:
    parameters:
      - in: path
        name: name
        required: true
        schema: {type: string}
    get:
      x-sparkwing-scope: runs.read
      tags: [pipelines]
      summary: The latest matching run for a pipeline (cross-pipeline-ref read).
      parameters:
        - in: query
          name: status
          schema: {type: string}
          description: csv of statuses (default `success`).
        - in: query
          name: max_age
          schema: {type: string, format: duration}
      responses:
        "200":
          description: Latest run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/pipelines/{name}/profile:
    parameters: [{$ref: "#/components/parameters/PipelineName"}]
    get:
      x-sparkwing-scope: nodes.claim
      tags: [pipelines]
      summary: Read a pipeline's measured resource profile.
      description: |
        Returns the cores and memory sparkwing measured for past runs, plus
        any operator pin. `?node=` narrows it to one node; omitting it
        answers the pipeline-wide profile. A runner reads this to size the
        work it is about to admit.
      parameters:
        - in: query
          name: node
          schema: {type: string}
      responses:
        "200":
          description: The stored profile.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: No profile recorded for this pipeline or node.}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/pipelines/{name}/profile/pin:
    parameters: [{$ref: "#/components/parameters/PipelineName"}]
    put:
      x-sparkwing-scope: runs.state
      tags: [pipelines]
      summary: Pin or clear a pipeline's resource profile.
      description: |
        A pin overrides what sparkwing measured. A body whose `cores` and
        `memory_bytes` are both zero or negative clears the pin instead of
        setting one.
      parameters:
        - in: query
          name: node
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.setPinReq
              type: object
              properties:
                cores: {type: number}
                memory_bytes: {type: integer, format: int64}
      responses:
        "204": {description: Pin written or cleared. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/gitcache/refresh:
    post:
      x-sparkwing-scope: admin
      tags: [gitcache]
      summary: Refresh the cache's mirror of a repository.
      description: |
        Proxied to the cache's `/git/refresh`. `repo` is validated with the
        clone-URL rules, so it cannot name a local path, a loopback or
        private address, or a URL carrying embedded credentials.
      parameters:
        - {$ref: "#/components/parameters/GitcacheRepo"}
      responses:
        "200": {description: "The cache's answer, forwarded verbatim."}
        "400": {description: Missing or rejected repo URL.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "502": {description: The cache is unreachable or answered badly.}
        "503": {description: No cache is configured on this controller.}

  /api/v1/gitcache/seed:
    post:
      x-sparkwing-scope: admin
      tags: [gitcache]
      summary: Push a pack of objects into the cache's mirror.
      description: |
        Proxied to the cache's `/sync/seed` with a 500 MiB body cap.
        `workspace=1` seeds an uncommitted working-tree snapshot instead of
        a committed ref.
      parameters:
        - {$ref: "#/components/parameters/GitcacheRepo"}
        - in: query
          name: sha
          required: true
          schema: {type: string, pattern: "^[0-9a-f]{40,64}$"}
          description: Hex object id the pack tips at.
        - in: query
          name: workspace
          schema: {type: string, enum: ["1"]}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200": {description: "The cache's answer, forwarded verbatim."}
        "400": {description: "Missing or rejected repo URL, sha, or workspace flag."}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "502": {description: The cache is unreachable or answered badly.}
        "503": {description: No cache is configured on this controller.}

  /api/v1/gitcache/git/register:
    post:
      x-sparkwing-scope: admin
      tags: [gitcache]
      summary: Map a short cache name onto a repository URL.
      parameters:
        - in: query
          name: name
          required: true
          schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,64}$"}
        - {$ref: "#/components/parameters/GitcacheRepo"}
      responses:
        "200": {description: "The cache's answer, forwarded verbatim."}
        "400": {description: Rejected name or repo URL.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "502": {description: The cache is unreachable or answered badly.}
        "503": {description: No cache is configured on this controller.}

  /api/v1/gitcache/git/{path}:
    parameters:
      - in: path
        name: path
        required: true
        schema: {type: string}
        description: |
          `<registered-name>/info/refs` or `<registered-name>/git-upload-pack`.
          Registered by `POST /api/v1/gitcache/git/register`.
    get:
      x-sparkwing-scope: admin
      tags: [gitcache]
      summary: Advertise a mirror's refs to a Git client.
      description: |
        Forwards `info/refs?service=git-upload-pack` to the cache. Any other
        suffix or service answers `405`, so the proxy carries reads only.
        The controller drops the caller's bearer and presents its own cache
        token, and caps how many Git streams one caller may hold open.
      parameters:
        - in: query
          name: service
          required: true
          schema: {type: string, enum: [git-upload-pack]}
      responses:
        "200": {description: Git smart-protocol ref advertisement.}
        "400": {description: The path does not name a registered mirror.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "405": {description: Anything but an upload-pack ref advertisement.}
        "502": {description: The cache is unreachable or answered badly.}
        "503": {description: No cache is configured on this controller.}
    post:
      x-sparkwing-scope: admin
      tags: [gitcache]
      summary: Serve a Git fetch negotiation from a mirror.
      description: |
        Forwards `git-upload-pack` to the cache. Any other suffix answers
        `405`, so a caller cannot push through this proxy.
      requestBody:
        required: true
        content:
          application/x-git-upload-pack-request:
            schema: {type: string, format: binary}
      responses:
        "200": {description: Git smart-protocol packfile response.}
        "400": {description: The path does not name a registered mirror.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "405": {description: Anything but an upload-pack fetch.}
        "502": {description: The cache is unreachable or answered badly.}
        "503": {description: No cache is configured on this controller.}

  /webhooks/github/{pipeline}:
    parameters:
      - in: path
        name: pipeline
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: public
      tags: [webhooks]
      summary: GitHub webhook intake. HMAC-verified; no bearer auth.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub webhook payload (push, pull_request, ...).
      responses:
        "202": {description: Accepted; trigger queued.}
        "400": {description: Missing X-GitHub-Delivery header or undecodable payload.}
        "401": {description: "Invalid HMAC signature, or no secret covers the named repository."}
        "404": {description: The repository is not bound to this pipeline.}
        "409": {description: This body was already accepted; the run it produced is in run_id.}
        "503": {description: GitHub webhook secret not configured anywhere.}

  /api/v1/services:
    get:
      x-sparkwing-scope: authenticated
      tags: [health]
      summary: Announce the cache, logs, and dashboard URLs a client should use.
      description: |
        Any valid bearer satisfies this route, and every client that reads
        it already holds one. A field is absent when the controller was
        started without the matching flag; a co-located laptop deployment
        announces none of them, because there the controller URL is already
        the right answer. `multi_team` is true on a controller that may hold
        more than one team, which answers 200 even with no URL announced.
      responses:
        "200":
          description: The announced URLs.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.ServicesResponse
                type: object
                properties:
                  cache_pod: {type: string}
                  logs: {type: string}
                  dashboard: {type: string}
                  multi_team: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: This controller announces no services.}

  /api/v1/health:
    get:
      x-sparkwing-scope: public
      tags: [health]
      summary: Process liveness probe.
      security: []
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: none
                type: object
                properties:
                  status: {type: string, enum: [ok]}

  /metrics:
    get:
      x-sparkwing-scope: public
      tags: [health]
      summary: Prometheus scrape endpoint.
      security: []
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema: {type: string}

  /api/v1/runs/{id}/gitcache/git/register:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [gitcache]
      summary: Map the claimed run's source repository into the cache.
      description: |
        Run-scoped counterpart of `/api/v1/gitcache/git/register`. A
        claim-only caller must hold this run, and `name` plus `repo` must
        identify the run's recorded source. The controller forwards neither
        the caller's bearer nor arbitrary repository credentials to the cache.
      parameters:
        - in: query
          name: name
          required: true
          schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,64}$"}
        - {$ref: "#/components/parameters/GitcacheRepo"}
      responses:
        "200": {description: "The cache's answer, forwarded verbatim."}
        "400": {description: Rejected name or repository URL.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller does not hold the run or the repository is not its source.}
        "502": {description: The cache is unreachable or answered badly.}
        "503": {description: No cache is configured on this controller.}

  /api/v1/runs/{id}/gitcache/git/{path}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: path
        name: path
        required: true
        schema: {type: string}
    get:
      x-sparkwing-scope: nodes.claim
      tags: [gitcache]
      summary: Advertise the claimed run's cached source refs.
      description: |
        Forwards only `<registered-name>/info/refs?service=git-upload-pack`.
        A claim-only caller must hold this run, and the registered name must
        identify its recorded source repository.
      parameters:
        - in: query
          name: service
          required: true
          schema: {type: string, enum: [git-upload-pack]}
      responses:
        "200": {description: Git smart-protocol ref advertisement.}
        "400": {description: The path does not name a valid registered mirror.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller does not hold the run or the mirror is not its source.}
        "405": {description: Anything but an upload-pack ref advertisement.}
        "502": {description: The cache is unreachable or answered badly.}
        "503": {description: No cache is configured on this controller.}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [gitcache]
      summary: Fetch from the claimed run's cached source mirror.
      description: |
        Forwards only `<registered-name>/git-upload-pack`. A claim-only caller
        must hold this run, and the registered name must identify its recorded
        source repository. Push requests cannot cross this proxy.
      requestBody:
        required: true
        content:
          application/x-git-upload-pack-request:
            schema: {type: string, format: binary}
      responses:
        "200": {description: Git smart-protocol packfile response.}
        "400": {description: The path does not name a valid registered mirror.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller does not hold the run or the mirror is not its source.}
        "405": {description: Anything but an upload-pack fetch.}
        "502": {description: The cache is unreachable or answered badly.}
        "503": {description: No cache is configured on this controller.}

  /api/v1/maintenance/reconcile-orphans:
    post:
      x-sparkwing-scope: admin
      tags: [runs]
      summary: Close runs whose orchestrator process died.
      description: |
        Finishes every run still marked running whose run and node heartbeats
        are all older than `threshold_nanos`, cascading its pending nodes to
        cancelled, and answers how many runs it closed. The threshold must be
        positive: zero would treat every running run as orphaned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.reconcileOrphansReq
              type: object
              required: [threshold_nanos]
              properties:
                threshold_nanos: {type: integer, format: int64}
      responses:
        "200":
          description: Sweep complete.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.reconcileOrphansResp
                type: object
                properties:
                  reconciled: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/pipelines/{name}/profile/contention:
    parameters: [{$ref: "#/components/parameters/PipelineName"}]
    post:
      x-sparkwing-scope: runs.state
      tags: [pipelines]
      summary: Count one contended run against a pipeline.
      description: |
        Records that a run of this pipeline was throttled by host contention,
        which admission reads when deciding how much headroom to leave. Takes
        no body.
      responses:
        "204": {description: Contention counted. Empty body.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/pipelines/{name}/profile/observations:
    parameters: [{$ref: "#/components/parameters/PipelineName"}]
    post:
      x-sparkwing-scope: runs.state
      tags: [pipelines]
      summary: Fold one run's measurement into a pipeline's profile.
      description: |
        The measured cost of a finished run, which becomes what later runs of
        this pipeline are charged. An empty `node` targets the pipeline
        rollup. A `contended` observation feeds the demand floor only, and
        carries `floor_cores` and `floor_memory_bytes` rather than peaks.
      parameters:
        - in: query
          name: node
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.profileObservationReq
              type: object
              properties:
                duration_nanos: {type: integer, format: int64}
                peak_cores: {type: number}
                peak_memory_bytes: {type: integer, format: int64}
                sustained_cores: {type: number}
                cpu_measured: {type: boolean}
                plan_hash: {type: string}
                contended: {type: boolean}
                floor_cores: {type: number}
                floor_memory_bytes: {type: integer, format: int64}
      responses:
        "204": {description: Observation folded. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/pipelines/{name}/profile/waits:
    parameters: [{$ref: "#/components/parameters/PipelineName"}]
    post:
      x-sparkwing-scope: runs.state
      tags: [pipelines]
      summary: Record how long a run queued for admission.
      description: |
        The wall time between submitting a run for admission and being
        admitted, which the queue view reports as this pipeline's typical
        wait.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.waitObservationReq
              type: object
              required: [wait_nanos]
              properties:
                wait_nanos: {type: integer, format: int64}
      responses:
        "204": {description: Wait recorded. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/nodes/{nodeID}/usage:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Fold a finished process's accounting into a node row.
      description: |
        Exact CPU time, peak RSS, and wall time read from a node process after
        it was reaped. Separate from finishing the node because the figures do
        not exist until the process exits, and the process that wrote the
        node's outcome is not the one that can read them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.nodeUsageReq
              type: object
              properties:
                cpu_time_nanos: {type: integer, format: int64}
                max_rss_bytes: {type: integer, format: int64}
                wall_nanos: {type: integer, format: int64}
      responses:
        "204": {description: Usage folded. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/triggers/{id}/claim:
    parameters: [{$ref: "#/components/parameters/TriggerID"}]
    post:
      x-sparkwing-scope: triggers.claim
      tags: [triggers]
      summary: Claim one named trigger.
      description: |
        Takes the lease on a trigger the caller already chose, unlike
        `/api/v1/triggers/claim` which picks the next queued one. The
        caller is recorded as the claimant, so the claim proves ownership of
        the run the trigger creates. 404 means the trigger is gone or another
        consumer holds it, so the caller moves on to its next candidate.
      requestBody:
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.claimSpecificTriggerReq
              type: object
              properties:
                lease_nanos: {type: integer, format: int64}
                node_runner:
                  type: string
                  enum: [inprocess, k8s, warm]
                  description: How the claimant runs the trigger's nodes; empty means inprocess. A metered credential claiming for inprocess nodes is refused with 403.
      responses:
        "200":
          description: The claimed trigger.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Trigger"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/agents/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: {type: string}
    put:
      x-sparkwing-scope: admin
      tags: [agents]
      summary: Enroll an executor under an exact runner credential.
      description: |
        Creates or updates the named executor. `token_prefix` must resolve to
        a live runner or service credential authorized to claim nodes; the raw bearer is
        never accepted here. Location is a trusted operator declaration, while
        capabilities describe placement features and cannot impersonate a
        location. Rebinding a name to another credential clears its liveness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.enrollAgentReq
              type: object
              required: [token_prefix, kind, max_concurrent]
              properties:
                token_prefix: {type: string, description: Non-secret prefix of the credential bound to this enrollment.}
                kind: {type: string, enum: [agent, gateway]}
                location: {type: string, enum: [local, cloud, unknown], default: unknown}
                capabilities:
                  type: array
                  items: {type: string}
                base_priority: {type: integer, minimum: 0, maximum: 100}
                priority_ceiling: {type: integer, minimum: 0, maximum: 100}
                max_concurrent: {type: integer, minimum: 1}
                budget:
                  x-sparkwing-go-type: pkg/controller.AgentResources
                  type: object
                  required: [cores, memory_bytes]
                  properties:
                    cores: {type: number, minimum: 0}
                    memory_bytes: {type: integer, format: int64, minimum: 0}
      responses:
        "204": {description: Executor enrolled. Empty body.}
        "400": {description: Invalid enrollment or credential prefix.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {description: Enrollment limit or name/credential conflict.}

  /api/v1/agents/{name}/heartbeat:
    parameters:
      - in: path
        name: name
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [agents]
      summary: Report an enrolled executor's available capacity.
      description: |
        The exact credential bound by enrollment must authenticate this call.
        The controller timestamps the observation itself; the runner cannot
        supply a clock value. Negative or non-finite capacity is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.agentHeartbeatReq
              type: object
              required: [headroom]
              properties:
                headroom:
                  x-sparkwing-go-type: pkg/controller.claimHeadroom
                  type: object
                  required: [cores, memory_bytes, queue_depth]
                  properties:
                    cores: {type: number, minimum: 0}
                    memory_bytes: {type: integer, format: int64, minimum: 0}
                    queue_depth: {type: integer, minimum: 0}
                runtime:
                  x-sparkwing-go-type: pkg/controller.agentRuntimeReportReq
                  type: object
                  description: >-
                    Supervisor host capabilities and observational build identity. This report does not attest any compiled workload.
                  required: [body_protocol_minimum, body_protocol_maximum, build_identity]
                  properties:
                    body_protocol_minimum: {type: integer, minimum: 0}
                    body_protocol_maximum: {type: integer, minimum: 0}
                    supervisor_requirements:
                      type: array
                      items: {type: string}
                    body_host_requirements:
                      type: array
                      items: {type: string}
                    build_identity:
                      x-sparkwing-go-type: internal/buildinfo.Identity
                      type: object
                      description: Observational runner identity; never compared for exact admission equality.
                      properties:
                        binary: {type: string}
                        version: {type: string}
                        commit: {type: string}
                        revision_time: {type: string}
                        modified: {type: boolean}
                        goos: {type: string}
                        goarch: {type: string}
      responses:
        "204": {description: Heartbeat recorded. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {description: Credential does not match this enrollment.}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/nodes/claim/prepare:
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Preview the next node eligible for an enrolled executor.
      description: |
        Evaluates the controller-owned resource digest and current membership
        snapshot without claiming the node or reserving capacity. A foreground
        Fleet authority restricts this lookup to its own run. A sealed
        compatible candidate returns `409 body_attestation_required` with its
        protected binding. No capacity is reserved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-partial: pkg/controller.claimNodeReq
              type: object
              required: [executor_name]
              properties:
                executor_name: {type: string}
      responses:
        "204": {description: No eligible node. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Credential does not match this enrollment.}
        "409":
          description: >-
            Typed upgrade, protocol-incompatibility, or compiled-body-attestation refusal. No capacity has been reserved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExecutionAdmissionError"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/nodes/{nodeID}/auto-retry/reset:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: path
        name: nodeID
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: runs.state
      tags: [nodes]
      summary: Reset an ordinarily failed node for its next in-place attempt.
      description: |
        Clears one terminal failed attempt back to pending while retaining its
        consumed-attempt count. The caller must present the run's exact live
        trigger generation unless controller-internal authorization applies.
        Agent-loss failures use the separate recovery
        path and cannot be reset here.
      responses:
        "204": {description: "Node reset, or already pending and unclaimed. Empty body."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller lacks the exact trigger claim identity.}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Stale generation or node state cannot be reset.}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/nodes/{nodeID}/claim/validate:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: path
        name: nodeID
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: logs.write
      tags: [nodes]
      summary: Validate a log writer's exact execution attempt.
      description: |
        Internal controller-to-log-service fence check. The request must carry
        either the four `X-Sparkwing-Claim-*` headers plus a positive
        `X-Sparkwing-Attempt-Ordinal`, or a positive
        `X-Sparkwing-Trigger-Generation` and, except for `_compile`, an attempt
        ordinal. Mixing node and trigger identities is rejected. The identity
        must still hold the claim that opened the named attempt; the attempt
        itself may already have finished, because a node writes its closing
        lines after closing the attempt. Trusted controller-internal calls
        bypass claim validation.
      responses:
        "204": {description: The claim that opened the attempt is live. Empty body.}
        "400": {description: Node and trigger identities were combined.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {description: "Missing, malformed, stale, or expired identity."}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/nodes/{nodeID}/execution-finish:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: path
        name: nodeID
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Finish one exact node execution attempt.
      description: |
        Completes the attempt ledger entry for the live claim fence. Success
        and cancellation carry no failure reason; failed attempts accept only
        Sparkwing's structured failure reasons. This does not finish the node
        row itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/store.ExecutionAttemptFinish
              type: object
              required: [holder_id, claim_generation, attempt_ordinal, outcome]
              properties:
                holder_id: {type: string}
                membership_id: {type: string}
                reservation_id: {type: string}
                claim_generation: {type: integer, format: int64, minimum: 1}
                attempt_ordinal: {type: integer, minimum: 1}
                outcome: {type: string, enum: [success, failed, cancelled]}
                failure_reason:
                  type: string
                  enum: [unknown, oom_killed, timeout, no_progress_timeout, verify, queue_timeout, logs_auth, logs_dropped]
                executor_kind:
                  type: string
                  enum: [local]
                  description: Closes an attempt opened for a node its dispatcher ran in its own process, which carries no claim identity. Only a host's own admission daemon or loopback controller accepts it.
      responses:
        "204": {description: Attempt finished. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Exact claim identity is missing.}
        "409": {description: Claim is stale or the attempt does not match current state.}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/nodes/{nodeID}/execution-start:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: path
        name: nodeID
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Start one exact node execution attempt.
      description: |
        Opens the next attempt-ledger entry under the caller's live claim fence,
        or, with `executor_kind: local`, for a node the calling process runs
        itself with no claim behind it. Repeating the same exact start is
        idempotent; another identity or ordinal conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/store.ExecutionStart
              type: object
              required: [holder_id, claim_generation, attempt_ordinal]
              properties:
                holder_id: {type: string}
                membership_id: {type: string}
                reservation_id: {type: string}
                claim_generation: {type: integer, format: int64, minimum: 1}
                attempt_ordinal: {type: integer, minimum: 1}
                executor_kind:
                  type: string
                  enum: [local]
                  description: Opens the attempt for a node its dispatcher runs in its own process. No claim identity is carried, executor_id is required, and only a host's own admission daemon or loopback controller accepts it.
                executor_id:
                  type: string
                  maxLength: 128
                  description: The host a locally executed node ran on. It is the attempt's executor id and its display name.
      responses:
        "204": {description: Attempt started. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Exact claim identity is missing.}
        "409": {description: Claim is stale or the ordinal is not the next attempt.}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/nodes/{nodeID}/finalize-ready:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: path
        name: nodeID
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: runs.state
      tags: [nodes]
      summary: Resolve an executor offer round or release coordinator fallback.
      description: |
        After the five-second offer window, atomically awards the best still
        eligible offer. If no live offer remains and placement permits the
        coordinator, clears readiness so the coordinator can execute locally.
        A still-open round or hard placement requirement reports `pending`.
      responses:
        "200":
          description: Resolution state.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: none
                type: object
                required: [revoked]
                properties:
                  revoked: {type: boolean, description: Readiness moved back to coordinator fallback.}
                  pending: {type: boolean, description: The offer window or a hard placement requirement remains unresolved.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/crons:
    get:
      x-sparkwing-scope: runs.read
      tags: [crons]
      summary: Read the controller's scheduler health and every schedule pushed to it.
      description: |
        The same shape the local dashboard serves, so one client renders a
        host's schedules and a controller's. `health.timer` describes the
        controller's own evaluation loop rather than an OS timer.
      responses:
        "200":
          description: Scheduler health and every stored schedule.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CronsOverview"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/crons/repos:
    put:
      x-sparkwing-scope: runs.control
      tags: [crons]
      summary: Replace one repository's controller schedules.
      description: |
        Upserts every schedule the body carries against `repo_url` and
        withdraws the ones it no longer lists. Each row keeps its pause state,
        cursor, history and override. `sha` pins every fire to one commit;
        `follow` clones the tip of `branch` instead and ignores `sha`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CronRepoRequest"}
      responses:
        "200":
          description: The repository's schedules as they now stand.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CronReposResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      x-sparkwing-scope: runs.control
      tags: [crons]
      summary: Remove every schedule pushed for one repository URL.
      parameters:
        - in: query
          name: repo_url
          required: true
          schema: {type: string}
      responses:
        "200":
          description: How many schedules the repository had.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CronRepoDeleteResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/crons/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    get:
      x-sparkwing-scope: runs.read
      tags: [crons]
      summary: Read one schedule, its recent fires, and the instants it matches next.
      description: |
        `id` is a schedule id or any name the listing prints: a
        `owner/repo/pipeline[/name]` display name, a `pipeline/name` pair, or a
        pipeline name unique across the controller.
      responses:
        "200":
          description: The schedule, its fires newest first, and its next instants.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CronDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/crons/{id}/pause:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: runs.control
      tags: [crons]
      summary: Stop a schedule firing, keeping it armed.
      description: |
        A paused schedule still advances its cursor on each tick, so resuming
        it fires the next due instant rather than replaying the ones that
        passed while it was paused.
      responses:
        "200":
          description: The schedule as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CronScheduleEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/crons/{id}/resume:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: runs.control
      tags: [crons]
      summary: Let a paused schedule fire again from its next due instant.
      responses:
        "200":
          description: The schedule as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CronScheduleEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/crons/{id}/run:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: runs.control
      tags: [crons]
      summary: Launch a schedule's pipeline now.
      description: |
        Creates the trigger and the pending run immediately, whatever the
        cadence says and whether or not the schedule is paused, and records the
        launch in its history. The cursor does not move, so the next due
        instant still fires on time.
      responses:
        "200":
          description: The run that started and the schedule as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CronRunEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/crons/{id}/disarm:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: runs.control
      tags: [crons]
      summary: Remove one schedule and its fire history.
      description: |
        Every sibling schedule of the same pipeline and repository stays armed.
        To stop a schedule without losing its history, pause it instead.
      responses:
        "200":
          description: The schedule as it stood when it went.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CronScheduleEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/crons/{id}/override:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    put:
      x-sparkwing-scope: runs.control
      tags: [crons]
      summary: Lay the controller's own cadence over what the repository declared.
      description: |
        A field the body leaves empty keeps the declared value, and a field
        named again replaces the previous override. `args` replaces the
        declared argument set whole. The result is validated the way a declared
        cadence is, so an override that would stop the schedule evaluating is
        refused here rather than at the next tick.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CronOverrideRequest"}
      responses:
        "200":
          description: The schedule as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CronScheduleEnvelope"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      x-sparkwing-scope: runs.control
      tags: [crons]
      summary: Return one schedule to what the repository declared.
      responses:
        "200":
          description: The schedule as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CronScheduleEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/nodes/{nodeID}/logs:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: path
        name: nodeID
        required: true
        schema: {type: string}
    get:
      x-sparkwing-scope: runs.read or logs.read or nodes.claim or triggers.claim
      tags: [nodes]
      summary: Read the tail of a running node's log from a byte offset.
      description: >
        Serves the controller's in-memory ring for one running node, which is the live view for a deployment whose durable logs surface has no live read of its own. Answers 404 once the node has finished and its ring has been released, which is the reader's signal to use the durable copy.

      parameters:
        - in: query
          name: since
          required: false
          schema: {type: integer, format: int64}
          description: Byte offset to read from. Omit for the whole buffer.
      responses:
        "200":
          description: The buffered bytes after the requested offset.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LiveLogRead"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      x-sparkwing-scope: runs.state
      tags: [nodes]
      summary: Add one batch of a running node's log lines to the live ring.
      description: >
        The node's own runner posts newline-delimited log text here so watchers see the run as it happens. The durable copy is the logs surface's job; this route only feeds the live view, and the controller drops the oldest bytes once the node's ring is full. Gated on the node's live claim, like every other node write.

      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: {type: string}
      responses:
        "204": {description: Accepted.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {description: The batch exceeds the per-request limit.}

  /api/v1/runs/{id}/nodes/{nodeID}/logs/stream:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: path
        name: nodeID
        required: true
        schema: {type: string}
    get:
      x-sparkwing-scope: runs.read or logs.read or nodes.claim or triggers.claim
      tags: [nodes]
      summary: Follow a running node's log as server-sent events.
      description: >
        Streams the controller's live ring for one node, one event per log line, from the offset in `since` or `Last-Event-ID`. Each event carries the next offset as its id, and the stream closes with an `event: stream_end` once the node finishes.

      parameters:
        - in: query
          name: since
          required: false
          schema: {type: integer, format: int64}
          description: Byte offset to resume from. Omit to start at the buffer's beginning.
      responses:
        "200":
          description: A server-sent-events stream of log lines.
          content:
            text/event-stream:
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/secrets/rotate:
    post:
      x-sparkwing-scope: admin
      tags: [secrets]
      summary: Re-encrypt every stored secret under the controller's current key.
      description: |
        Opens each stored value with the keys the controller holds -- the
        current one, then the previous one when one is configured -- and
        writes it back sealed and bound under the current key, in one
        transaction. A value the controller was holding as plaintext comes
        out encrypted. A value that opens under neither key keeps the bytes
        it had and is named in `skipped`, so one unreadable row costs the
        others nothing. The previous key can be dropped once a rotation
        answers with `skipped` empty.

        Answers `400` when no key is configured.
      responses:
        "200":
          description: Rotation complete.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.secretsRotateResponse
                type: object
                required: [rotated, skipped, git_credentials]
                properties:
                  rotated:
                    type: integer
                    description: Secret rows rewritten under the current key.
                  git_credentials:
                    type: integer
                    description: Team git credentials resealed under the current key. One that opens under no configured key fails the rotation with 500.
                  skipped:
                    type: array
                    description: Rows left as they were because they opened under no configured key.
                    items:
                      x-sparkwing-go-type: pkg/controller.secretsRotateSkip
                      type: object
                      required: [name]
                      properties:
                        name: {type: string}
                        pipeline:
                          type: string
                          description: Owning pipeline; absent on the unscoped row.
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/object-store/breaker:
    get:
      x-sparkwing-scope: admin
      tags: [cluster]
      summary: Read the controller's object-store request budget.
      description: |
        Reports the per-minute rate and per-day budget for each object-store
        request class (put, get, list, delete), how much of each window the
        process has spent, and which classes are refusing requests. Changes
        nothing.
      responses:
        "200":
          description: The budget as it stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ObjectStoreBreaker"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/object-store/reset-breaker:
    post:
      x-sparkwing-scope: admin
      tags: [cluster]
      summary: Clear a tripped object-store request budget.
      description: |
        Clears every tripped request class and resets both window counters,
        then returns the budget as it stands with `cleared` naming the classes
        that were refusing requests. Lifetime request and trip totals survive,
        so the metrics keep their history. Takes no body.
      responses:
        "200":
          description: The budget after the reset.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ObjectStoreBreaker"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/credits:
    get:
      x-sparkwing-scope: runs.read
      tags: [credits]
      summary: Read the prepaid credit balance, the rate, and the recent burn.
      description: |
        Cloud runner time is prepaid. One credit is one vCPU-second and
        20,000 credits is one dollar; amounts are micro-credits, 5,000 to the
        credit, so a ten dollar top-up is 200,000 credits. The balance is the sum of
        grants less the sum of charges, computed in SQL. `rate_micro_per_second`
        prices one cloud runner second, `grace_seconds` is how long a node runs
        past its claim reservation on an empty balance, and `burn_micro` is what the last
        `burn_window_seconds` cost. A controller that was never granted
        anything reads zero and charges nothing.
      responses:
        "200":
          description: Ledger state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreditState"}

  /api/v1/credits/grants:
    post:
      x-sparkwing-scope: credits.grant
      tags: [credits]
      summary: Add free or paid credits to the ledger, or reverse a paid grant.
      description: |
        Records who granted the credits, which kind they are, and the
        payment `reference` they came from. A grant that lifts the balance
        above zero lets metered runners claim again and stops the
        cancellation of nodes running on an empty balance.

        A non-empty `reference` is idempotent: a second request naming the
        same `kind` and `reference` returns the grant already written with
        200, so a payment webhook may redeliver. An empty reference writes
        a new grant every time.

        A `reversal` takes a refunded payment back out. It carries a
        negative `amount_micro`, its own `reference` (the refund id, so
        partial refunds each land), and `reverses` naming the paid grant's
        reference. A reversal whose `reverses` matches no paid grant is
        refused, as is one that with the reversals already written would take
        back more than the payment paid; one that takes the balance below
        zero stops new metered claims. A reversal may omit `team`: the
        payment it reverses was granted to exactly one team, and the
        reversal lands there.

        A replay must carry the terms it carried the first time: a request
        naming a `kind` and `reference` another grant holds under a different
        `amount_micro` or `reverses` is refused with 409.

        A new `free` grant that would lift the team's balance above $5,000
        is refused with 409 and `"code": "balance_cap"`, naming the balance,
        the amount and the cap. A `paid` grant is never refused by the cap,
        because its payment already went through and the cap was held when
        its checkout opened; it is at most one purchase, $500, and names the
        Checkout Session it settles in `checkout`. A replay of a grant
        already written is answered as usual, so a redelivered payment still
        succeeds.

        A caller holding only the checkout service's scope records `paid`
        grants and is answered 403 for any other kind; a `free` grant or a
        reversal is the operator's.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateGrantRequest"}
      responses:
        "200":
          description: The grant this reference already wrote.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreditGrant"}
        "201":
          description: The grant written.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreditGrant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409":
          description: >-
            Another grant holds this kind and reference under different terms, or the grant would lift the balance above the cap (`balance_cap`, with `balance_micro`, `cap_micro` and `amount_micro`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/credits/reversals:
    post:
      x-sparkwing-scope: credits.grant
      tags: [credits]
      summary: Take back what a payment still has on the ledger.
      description: |
        Writes one `reversal` of what the paid grant carrying `payment_id`
        still has, less what earlier reversals of it took back, in the team
        the payment funded. The balance may go below zero, which stops the
        team's new metered claims. `reference` names the reversal, such as
        `refund:<payment id>` for an operator's refund or the dispute id for
        a lost chargeback; a repeat under it answers 200 with the reversal
        already written, and a payment already taken back whole answers 200
        with no `grant`. The controller never moves money: an operator's
        refund is issued in the Stripe dashboard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.reversePaymentReq
              type: object
              required: [payment_id, reference]
              properties:
                payment_id: {type: string, description: The payment id the paid grant carries as its reference.}
                reference: {type: string, description: This reversal's own reference.}
      responses:
        "200":
          description: The reversal this reference already wrote, or nothing left to take back.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentReversal"}
        "201":
          description: The reversal written.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentReversal"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: No paid grant carries the payment id.}
        "409": {description: "The reference already names a reversal of another payment, or a dispute held for another payment (`dispute_conflict`)."}

  /api/v1/credits/freezes:
    post:
      x-sparkwing-scope: credits.grant
      tags: [credits]
      summary: Hold a team's cloud usage for a dispute, or release holds.
      description: |
        A hold is one per dispute, and a team is held while any of its holds
        stands: its metered claims are refused with 402 and
        `"code": "credits_frozen"`, so no new cloud work starts, while work
        already running finishes. A hold names the team by `payment_id`, a
        payment it made, or by `team`, and names the `dispute_id`. A dispute
        is bound to the payment and team its first hold named: holding it
        again for them, released or not, writes nothing, and holding it for
        another payment is refused with 409.
        `release` lifts the hold of `dispute_id`, or every hold on the team
        when no dispute is named. Naming a team and releasing are the
        operator's; the checkout service holds by payment and never releases.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.creditFreezeReq
              type: object
              properties:
                payment_id: {type: string}
                team: {type: string}
                dispute_id: {type: string, description: The dispute the hold is for.}
                reason: {type: string}
                release: {type: boolean, description: "Lift the dispute's hold, or every hold on the team."}
      responses:
        "200":
          description: The team's holds as they now stand.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.creditFreezeJSON
                type: object
                required: [team, frozen, disputes]
                properties:
                  team: {type: string}
                  frozen: {type: boolean}
                  disputes: {type: array, items: {type: string}, description: The disputes still holding the team.}
                  released: {type: integer, format: int64, description: How many holds a release lifted.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: "No paid grant carries the payment id, no hold names the dispute, or the team is not registered."}
        "409": {description: "The dispute is already held for another payment or team (`dispute_conflict`)."}

  /api/v1/credits/units:
    get:
      x-sparkwing-scope: credits.grant
      tags: [credits]
      summary: Read the units the ledger prices in.
      description: >-
        The checkout service reads these before its first grant and refuses to grant when a cent is not the micro-credits it computes with.
      responses:
        "200":
          description: The ledger's units.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.creditUnitsJSON
                type: object
                required: [micro_per_credit, credits_per_dollar, micro_per_cent]
                properties:
                  micro_per_credit: {type: integer, format: int64}
                  credits_per_dollar: {type: integer, format: int64}
                  micro_per_cent: {type: integer, format: int64}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/credits/history:
    get:
      x-sparkwing-scope: runs.read
      tags: [credits]
      summary: List credit grants and charges, newest first.
      description: |
        Each charge names the run, node, and token prefix it billed and the
        seconds it covered, so every movement of the ledger traces to the
        work that caused it. `limit` caps each list; the controller applies
        its own default when it is omitted.
      parameters:
        - in: query
          name: limit
          schema: {type: integer}
          description: Maximum rows of each kind.
      responses:
        "200":
          description: Grants and charges.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreditHistory"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/credits/settings:
    get:
      x-sparkwing-scope: runs.read
      tags: [credits]
      summary: Read the rate, the grace period, and the charge cap.
      description: |
        The three values the ledger prices work with.
        `rate_micro_per_second` is what one cloud runner second costs.
        `grace_seconds` is how long a node keeps running once it has consumed
        the reservation its claim paid for with the balance at zero; a node
        still inside that reservation is never cancelled, because the ledger
        already took payment for it. `max_charge_seconds` is the most seconds
        any one charge may bill, which forgives a controller outage or a
        stalled heartbeat loop rather than billing the gap. A controller that
        set none of them reads the defaults.
      responses:
        "200":
          description: The settings in force.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreditSettings"}
    put:
      x-sparkwing-scope: admin
      tags: [credits]
      summary: Set the rate, the grace period, or the charge cap.
      description: |
        Sets each setting the body names, in one transaction, and answers the
        full set as `GET` does. An omitted field leaves that setting as it was,
        so changing one value is a one-field body. A body that names nothing is
        refused with `400`, as is a rate outside one micro-credit to a million
        credits per second, a negative grace period, and a charge cap outside
        the band whose floor is one second past the longest node heartbeat
        cadence and whose ceiling is one day. The bounds keep the reservation a
        claim takes and a capped charge inside a signed 64-bit integer, and the
        floor keeps a cap from truncating every tick that arrives a little
        late. A refused body writes none of its fields. `grace_seconds` at zero
        cancels a metered node at the first heartbeat past the reservation its
        claim paid for, which bounds the unpaid overrun to one heartbeat
        interval per node. Charges already written keep the rate they were
        charged at.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetCreditSettings"}
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreditSettings"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/tokens/{prefix}/metered:
    parameters:
      - in: path
        name: prefix
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: admin
      tags: [tokens]
      summary: Mark an existing token as one whose node claims cost credits.
      description: |
        Metering is an operator decision recorded against the token, which
        is how a warm pool already running starts costing credits without a
        new credential. A runner's self-asserted labels never make its work
        billable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.setTokenMeteredReq
              type: object
              required: [metered]
              properties:
                metered: {type: boolean}
      responses:
        "200":
          description: The token after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Token"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/webhooks/github/bindings:
    delete:
      x-sparkwing-scope: admin
      tags: [webhooks]
      summary: Disconnect one repository from one pipeline.
      description: |
        Removes the stored binding, so deliveries from that repository are
        verified against the `GITHUB_WEBHOOK_BINDINGS` document and the
        shared secret again, and refused where neither covers them. Delete
        the webhook on GitHub first; `sparkwing cluster webhooks disconnect`
        does both in that order.
      parameters:
        - in: query
          name: pipeline
          required: true
          schema: {type: string}
          description: Pipeline the binding fires.
        - in: query
          name: repo
          required: true
          schema: {type: string}
          description: Repository slug, owner/name.
      responses:
        "200":
          description: Whether a binding was there to remove.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubWebhookDisconnectResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
    post:
      x-sparkwing-scope: admin
      tags: [webhooks]
      summary: Connect one repository to one pipeline.
      description: |
        Stores the secret deliveries from this repository to this pipeline
        are signed with, and adds the repository to that pipeline's
        allow-list. The binding takes precedence over the
        `GITHUB_WEBHOOK_BINDINGS` document for the same pipeline and
        repository, and adds to it everywhere else. Posting again replaces
        the secret, which is how a connect rotates it. The secret is sealed
        with the controller's secrets key when one is configured, and no
        route reads it back.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GitHubWebhookBindingRequest"}
      responses:
        "201":
          description: The stored binding and the URL GitHub must deliver to.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubWebhookBindingResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/storage:
    get:
      x-sparkwing-scope: runs.read
      tags: [storage]
      summary: Read the storage policy, the caller's quota, and this month's usage.
      description: |
        `settings` are the controller-wide retention windows and alarm size;
        every window is a whole number of days and zero is unbounded, which
        is what a controller that set none reads. `quota` is the allowance
        the calling token's team is held to, taken from its own row when it
        has one and from `default_tier` otherwise, and an unlimited quota
        refuses nothing. `usage` is what that team has stored over the
        current calendar month. `alarm` says whether the last size sample
        passed `database_alarm_bytes`.

        An operator caller also receives `database`, the last size sample the
        maintenance timer took, `quotas`, every team with a quota row, and
        `largest_teams`, the month's heaviest teams. Every other caller
        receives none of those.
      responses:
        "200":
          description: Storage policy, quota, and usage.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StorageState"}

  /api/v1/storage/quotas/{principal}:
    parameters:
      - in: path
        name: principal
        required: true
        schema: {type: string}
    put:
      x-sparkwing-scope: admin
      tags: [storage]
      summary: Set one team's storage allowance.
      description: |
        `principal` is the token principal the quota is filed under, 1 to 128
        characters of letters, digits, or `-_.:@`; anything else is refused.
        Naming a `tier` and leaving every limit zero takes that tier's
        limits, so a team moves between tiers without restating three
        numbers. A limit of zero is unbounded, so a quota may cap bytes
        without capping objects. This route does not take the retained-storage
        allowance and never changes it; its own route writes that. The answer
        is the stored quota.

        Run events are charged their payload bytes and a published artifact
        manifest is charged one object, each inside the transaction that
        writes it, so a refused write is never stored and never billed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetStorageQuota"}
      responses:
        "200":
          description: The stored quota.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StorageQuota"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/storage/quotas/{principal}/allowance:
    parameters:
      - in: path
        name: principal
        required: true
        schema: {type: string}
    put:
      x-sparkwing-scope: admin
      tags: [storage]
      summary: Set how many retained bytes one team keeps.
      description: |
        The allowance is how many retained bytes the team asked to keep. The
        hourly storage pass expires its oldest finished runs above the
        allowance, so the allowance is both what the team keeps and the most
        it pays for, and zero keeps everything. The other quota limits are
        left where they stand. The answer is the stored quota.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StorageAllowance"}
      responses:
        "200":
          description: The stored quota.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StorageQuota"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/storage/teams/{team}/free-slot:
    parameters:
      - in: path
        name: team
        required: true
        schema: {type: string}
    put:
      x-sparkwing-scope: admin
      tags: [storage]
      summary: Grant a team a free-tier slot.
      description: |
        Admits a team without credits to the free tier whether or not a slot
        is left, which is how an operator admits a team once every one of
        `--free-team-slots` is taken. The slot lasts until the team is
        deleted. The answer is the team's tier and the allowance its
        per-store shares are cut from.
      responses:
        "200":
          description: The team's storage tier.
          content:
            application/json:
              schema:
                type: object
                x-sparkwing-go-type: pkg/controller.StorageTierResponse
                properties:
                  team: {type: string}
                  tier: {type: string, enum: [funded, free, none]}
                  allowance_bytes: {type: integer, format: int64}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/storage/settings:
    put:
      x-sparkwing-scope: admin
      tags: [storage]
      summary: Set the retention windows, the alarm size, and the default tier.
      description: |
        Writes every field, so a caller reads `GET /api/v1/storage` first,
        changes what it means to change, and writes the result back. A
        retention window is a whole number of days and zero is unbounded; an
        hourly timer removes the events and per-node metric samples of
        finished runs once they pass their window, in bounded batches, and
        leaves a run that is still going untouched however old its rows.

        `database_alarm_bytes` of zero raises no alarm. Passing it logs a
        warning and sets `database.alarm` on `GET /api/v1/health`, which
        never changes the status that route reports. `default_tier` holds
        every principal without a quota row to that tier, and an empty
        default leaves them unlimited.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StorageSettings"}
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StorageSettings"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/admin/usage-metrics:
    get:
      x-sparkwing-scope: admin
      tags: [cluster]
      summary: Read the deployment's weekly usage for its operator.
      description: |
        Counts, per Monday-to-Monday UTC week, the teams with at least one
        run started, those runs split into cloud and connected-machine runs,
        how many runs each active team started, and the accounts and teams
        created. For teams created in the window it reports the time from
        the team's creation to the finish of its first successful run. Every
        figure comes from the controller's own tables and names no team,
        account or source. The default team never counts.
      parameters:
        - in: query
          name: weeks
          schema: {type: integer, minimum: 1, maximum: 104, default: 12}
          description: Whole weeks to report, ending with the week in progress.
        - in: query
          name: exclude_team
          schema: {type: array, items: {type: string}}
          style: form
          explode: true
          description: More teams to leave out, such as the operator's own test teams.
      responses:
        "200":
          description: The weekly usage.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UsageMetrics"}
        "400": {description: weeks is outside 1 to 104.}

  /api/v1/egress:
    get:
      x-sparkwing-scope: admin
      tags: [cluster]
      summary: Read the controller's egress budgets and top consumers.
      description: |
        Reports the per-principal monthly download budget, the global daily
        alarm threshold, what the process has sent today and this month,
        whether the alarm is up, and the principals that have downloaded the
        most this month. Changes nothing.
      responses:
        "200":
          description: The egress meter as it stands.
          content:
            application/json:
              schema:
                type: object
                x-sparkwing-go-type: "none"
                properties:
                  enabled: {type: boolean}
                  egress: {type: object}

  /api/v1/compute-limits:
    get:
      x-sparkwing-scope: runs.read
      tags: [credits]
      summary: Read every compute guard and the cloud runners in use.
      description: |
        Compute guards bound what the controller starts before the credit
        ledger bills it. Every guard is zero by default, which is unlimited.
        The runner guards count cloud runners, which are the claims a metered
        token holds; the node and hourly guards count one metered principal's
        runs, and their `max_global_*` counterparts count every run on the
        controller. `usage` reports the cloud runners claimed right now, in
        total and per principal, and whether the count reached `runner_alarm`.
        It also reports `derived_runner_cap`, the per-principal runner ceiling
        after `runner_scale_step_credits` of recent paid credit has raised
        `max_concurrent_runners`, together with the credit it was read from.
      responses:
        "200":
          description: Guards and current usage.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ComputeLimits"}
    put:
      x-sparkwing-scope: admin
      tags: [credits]
      summary: Set one or more compute guards.
      description: |
        Sets each named guard to its value and answers the full set as `GET`
        does. A value of zero removes that ceiling; a negative value or an
        unknown guard name is refused with `400`. Work a guard refuses answers
        `429` with `"code": "compute_limit"` and a `Retry-After`, and the run
        records a `compute_limit_blocked` event.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetComputeLimits"}
      responses:
        "200":
          description: Guards and current usage after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ComputeLimits"}

  /api/v1/runs/{id}/nodes/{nodeID}/claim:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: path
        name: nodeID
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Claim this one node, whatever its place in the queue.
      description: |
        A dispatcher that executes a node itself calls this so its own process
        holds the claim every node mutation is checked against, which is what
        the Kubernetes fallback Job needs before it runs a node no agent
        claimed. It passes over no candidate and reads no label: the caller
        already decided this node is its work.
        Naming a node skips the queue, so the scope alone is not enough. An
        unlabelled node the queue has already opened is awarded to any
        authorized caller. A node the queue has not opened, and a node that
        declares required runner labels, are awarded only to a caller holding
        the run's live trigger claim: a named claim advertises no labels, and
        this keeps a pipeline pod's token from taking work whose dependencies
        have not run or work its box cannot do. An operator token bypasses the
        check, as it does on every other claim-bound route.
        The claim binds to the calling token and `holder_id` exactly as
        `POST /api/v1/nodes/claim` does, and `lease_secs` is clamped to the
        server cap of 10 minutes. A metered token reserves its first minute
        here, so the node run bills through this claim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.claimNamedNodeReq
              type: object
              required: [holder_id]
              properties:
                holder_id: {type: string}
                lease_secs: {type: integer}
                sizes_to_class: {type: boolean, description: "The caller creates the node's executor at the cpu class the claim bills; without it a metered claim is held to the class the warm pool serves."}
      responses:
        "200":
          description: Claimed node.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Node"}
                  - x-sparkwing-go-partial: pkg/store.Node
                    type: object
                    description: >-
                      Exact claim fence returned only to the authenticated caller that won this claim.
                    properties:
                      claimed_by: {type: string}
                      claim_generation: {type: integer, format: int64}
                      claim_membership_id: {type: string}
                      reservation_id: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "402":
          description: >-
            The claiming token is metered and the credit balance does not cover a minute of its time. The node is not claimed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreditsRefused"}
        "403":
          description: >-
            The node is not ready, or requires runner labels, and the caller does not hold the run's live trigger claim.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthError"}
        "404": {description: No such node.}
        "409":
          description: >-
            Another claim holds the node, the node or its run finished, or its placement is pinned.

  /api/v1/capabilities:
    get:
      x-sparkwing-scope: public
      tags: [teams]
      summary: Report whether this controller hosts teams and which sign-in providers it offers.
      description: >-
        Unauthenticated, because a signed-out browser draws the sign-in page from it. `teams.enabled` is true only when the controller holds a valid multi-team license. `auth.providers` lists `google` only when that license is present and a Google client is configured.
      security: []
      responses:
        "200":
          description: Capabilities.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.capabilitiesResp
                type: object
                required: [teams, auth, claims]
                properties:
                  teams:
                    x-sparkwing-go-type: pkg/controller.capabilitiesTeams
                    type: object
                    required: [enabled]
                    properties:
                      enabled: {type: boolean}
                  auth:
                    x-sparkwing-go-type: pkg/controller.capabilitiesAuth
                    type: object
                    required: [providers]
                    properties:
                      providers:
                        type: array
                        items: {type: string, enum: [google, github]}
                  claims:
                    x-sparkwing-go-type: pkg/controller.capabilitiesClaims
                    type: object
                    required: [allow_repos]
                    properties:
                      allow_repos: {type: boolean, description: Trigger and node claims read allow_repos; a runner sends the list only when this is true.}
                  github_app:
                    x-sparkwing-go-type: pkg/controller.capabilitiesGitHubApp
                    type: object
                    description: Present only when the controller has a GitHub App configured.
                    required: [slug, source_tokens]
                    properties:
                      slug: {type: string, description: "The App's name in https://github.com/apps/<slug>."}
                      source_tokens: {type: boolean, description: "A runner holding a claim may ask POST /api/v1/runs/{id}/source-token for a fetch credential."}

  /api/v1/auth/oauth/google/start:
    post:
      x-sparkwing-scope: public
      tags: [auth]
      summary: Begin a Google sign-in and return the authorization URL with its state and PKCE verifier.
      description: >-
        The controller stores nothing. The caller keeps `state` and `verifier` in a short-lived `__Host-` cookie on the browser that started the flow and checks `state` against it at the callback. `redirect_uri` must be on the controller's `--oauth-redirect-uris` allowlist. Answers 404 unless Google sign-in is offered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.oauthStartReq
              type: object
              required: [redirect_uri]
              properties:
                redirect_uri: {type: string, description: "Dashboard callback URL, such as https://app.example.com/auth/google/callback."}
      responses:
        "200":
          description: Flow started.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.oauthStartResp
                type: object
                required: [authorize_url, state, verifier]
                properties:
                  authorize_url: {type: string}
                  state: {type: string}
                  verifier: {type: string, description: PKCE code verifier. The authorize URL carries only its S256 challenge.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/auth/oauth/google/exchange:
    post:
      x-sparkwing-scope: public
      tags: [auth]
      summary: Finish a Google sign-in and open a session.
      description: >-
        Redeems `code` with `verifier`, verifies the returned ID token (signature against Google's keys, issuer, audience, expiry, and `email_verified`), and resolves the user. A new identity joins an existing user only when both Google and that user hold the email verified and that user has no other Google identity. A user with no team gets a personal space: a team whose only member is its owner, slugged from the email's local part. A new user the sign-up gate waitlists gets none, and `waitlisted` says so. The session opens in the user's active team.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.oauthExchangeReq
              type: object
              required: [code, verifier, redirect_uri]
              properties:
                code: {type: string}
                verifier: {type: string}
                redirect_uri: {type: string}
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.oauthExchangeResp
                type: object
                required: [session_id, csrf_token, expires_at, user, active_team]
                properties:
                  session_id: {type: string, description: "Send as `Authorization: Session <id>`."}
                  csrf_token: {type: string}
                  expires_at: {type: integer, format: int64, description: Unix seconds.}
                  user: {$ref: "#/components/schemas/IdentityUser"}
                  active_team:
                    allOf: [{$ref: "#/components/schemas/TeamRef"}]
                    nullable: true
                    description: Null for a new user the sign-up gate placed on the waitlist.
                  waitlisted:
                    type: boolean
                    description: True while the user waits for admission; it holds no personal space and may only accept invitations.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Google has not verified the account's email address.
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {description: Google could not be reached.}

  /api/v1/me:
    get:
      x-sparkwing-scope: authenticated
      tags: [teams]
      summary: Describe the signed-in user, the active team, every membership, and open invitations.
      description: "Needs an identity-provider session (`Authorization: Session <id>`); a bearer token answers 401."
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.meResp
                type: object
                required: [user, active_team, memberships, invitations]
                properties:
                  user: {$ref: "#/components/schemas/IdentityUser"}
                  active_team:
                    allOf: [{$ref: "#/components/schemas/TeamRef"}]
                    nullable: true
                    description: Null when the user is no longer a member of the session's team, or belongs to no team while on the sign-up waitlist.
                  waitlisted:
                    type: boolean
                    description: True while the user waits for admission; it holds no personal space, cannot create a team, and may accept invitations.
                  memberships:
                    type: array
                    items: {$ref: "#/components/schemas/TeamRef"}
                  invitations:
                    type: array
                    items:
                      x-sparkwing-go-type: pkg/controller.invitationRefJSON
                      type: object
                      required: [id, team_slug, team_display_name, role]
                      properties:
                        id: {type: string}
                        team_slug: {type: string}
                        team_display_name: {type: string}
                        role: {type: string, enum: [owner, editor, reader]}
        "401": {$ref: "#/components/responses/Unauthorized"}
    delete:
      x-sparkwing-scope: authenticated
      tags: [teams]
      summary: Delete the signed-in user's account.
      description: >-
        Needs an identity-provider session signed in within the last 10 minutes, and `confirm_email` equal to the account's address. Removes the account, its sign-in identities, memberships and sessions, and revokes every token it minted in any team. Teams the account is the only member of, its personal space included, are queued for deletion with all their data. Rows that recorded the account in teams it shared (runs, triggers, approvals, schedules, bounces, pause releases, credit grants, node claims, secrets, egress usage, event payloads) stay with those teams and name `deleted user`. While the account is the last owner of a team that has other members the request answers 409 and lists those teams.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.deleteAccountReq
              type: object
              required: [confirm_email]
              properties:
                confirm_email: {type: string}
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.deletedAccountJSON
                type: object
                required: [account_id, deleted_teams]
                properties:
                  account_id: {type: string}
                  deleted_teams:
                    type: array
                    items: {type: string}
                    description: Teams the account was the only member of, now queued for deletion.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: "The session signed in more than 10 minutes ago (`error: reauth_required`); sign in again and retry."}
        "409":
          description: The account is the last owner of teams that have other members, or a team being deleted has a credit checkout in progress (wait for it to expire or complete) or is on hold over a disputed payment (contact support).
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.lastOwnerRefusalJSON
                type: object
                required: [error, teams]
                properties:
                  error: {type: string}
                  teams:
                    type: array
                    items: {$ref: "#/components/schemas/TeamRef"}

  /api/v1/me/team-deletions:
    get:
      x-sparkwing-scope: authenticated

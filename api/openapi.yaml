      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.appendEventReq
              type: object
              required: [kind]
              properties:
                node_id: {type: string}
                kind: {type: string}
                payload:
                  type: string
                  format: byte
                  description: Opaque bytes (caller chooses encoding).
      responses:
        "200":
          description: Assigned sequence number.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.appendEventResp
                type: object
                required: [seq]
                properties:
                  seq: {type: integer, format: int64}
        "402":
          description: >-
            Storage is priced and the credit balance is spent, so the payload would grow what the team retains with nothing to pay the rent on it. The event is not stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413":
          description: >-
            The payload would take the team past one of its storage limits. The reason names the limit, the team, what it has stored and what the write asked for.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/triggers:
    post:
      x-sparkwing-scope: runs.write
      tags: [triggers]
      summary: Submit a new trigger. Persists then notifies the dispatcher.
      description: |
        Returns 202 with a generated `run_id` even before the
        orchestrator picks the trigger up, so webhook callers can
        respond quickly. `trigger.source` is required. A claim-scoped request
        that names `parent_run_id` must carry the exact live node claim for
        `parent_run_id` plus `parent_node_id`, or the exact live trigger
        generation for `parent_run_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TriggerRequest"}
      responses:
        "202":
          description: Trigger accepted; orchestrator will run it.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.triggerResp
                type: object
                required: [run_id, status]
                properties:
                  run_id: {type: string}
                  status: {type: string, enum: [dispatched]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Parent claim is stale or no longer live.}
    get:
      x-sparkwing-scope: triggers.read
      tags: [triggers]
      summary: List triggers (operator view). Filter by `status`, `pipeline`.
      parameters:
        - in: query
          name: status
          schema: {type: string}
        - in: query
          name: pipeline
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer}
      responses:
        "200":
          description: Triggers wrapped under `triggers`.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: none
                type: object
                required: [triggers]
                properties:
                  triggers:
                    type: array
                    items: {$ref: "#/components/schemas/Trigger"}

  /api/v1/triggers/claim:
    post:
      x-sparkwing-scope: triggers.claim
      tags: [triggers]
      summary: Atomically claim the oldest pending trigger.
      description: |
        Empty body claims any pending trigger. 204 when the queue is
        empty.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.claimTriggerReq
              type: object
              properties:
                pipelines:
                  type: array
                  items: {type: string}
                trigger_sources:
                  type: array
                  items: {type: string}
                node_runner:
                  type: string
                  enum: [inprocess, k8s, warm]
                  description: How the claimant runs the trigger's nodes; empty means inprocess. A metered credential claiming for inprocess nodes is refused with 403.
                allow_repos:
                  type: array
                  items: {type: string}
                  description: >-
                    Repositories this runner's owner allows it to build, as host/path patterns where '*' matches within one path segment. A list that is present, even empty, confines the claim to runs from matching repositories; an absent list claims as before.
      responses:
        "200":
          description: Claimed trigger.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Trigger"}
        "204": {description: Queue empty.}

  /api/v1/triggers/{id}:
    parameters: [{$ref: "#/components/parameters/TriggerID"}]
    get:
      x-sparkwing-scope: triggers.read or nodes.claim or triggers.claim
      tags: [triggers]
      summary: Fetch a single trigger by ID.
      responses:
        "200":
          description: Trigger.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Trigger"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/triggers/{id}/heartbeat:
    parameters: [{$ref: "#/components/parameters/TriggerID"}]
    post:
      x-sparkwing-scope: triggers.claim
      tags: [triggers]
      summary: Extend the worker lease on a claimed trigger.
      description: >-
        Bound to the claimant the trigger row records, so only the worker that claimed the trigger may renew it.
      responses:
        "200":
          description: Heartbeat. Body signals whether cancel was requested.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.heartbeatResp
                type: object
                required: [cancel_requested]
                properties:
                  cancel_requested: {type: boolean}
        "403":
          description: >-
            Another principal holds the trigger's claim. The caller keeps working; it does not own this trigger.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthError"}
        "404":
          description: >-
            Trigger missing, or its claim was reaped or requeued and the row now records no claimant -- worker should stop.
        "409":
          description: The claimant presented a stale or invalid trigger generation.

  /api/v1/triggers/{id}/done:
    parameters: [{$ref: "#/components/parameters/TriggerID"}]
    post:
      x-sparkwing-scope: triggers.claim
      tags: [triggers]
      summary: Mark a trigger `done`. Idempotent.
      description: >-
        Bound to the claimant the trigger row records. The record survives the trigger's own completion, so the claimant's retry of a done whose response was lost still succeeds.
      responses:
        "204": {description: Done.}
        "403":
          description: Another principal holds the trigger's claim.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthError"}
        "404":
          description: >-
            Trigger missing, or its claim was reaped or requeued and the row now records no claimant.
        "409":
          description: The claimant presented a stale or invalid trigger generation.


x-sparkwing-error-codes:
  - code: bad_request
    http_status: 400
    purpose: Malformed or invalid request.
  - code: invalid_args
    http_status: 400
    purpose: Pipeline arguments do not validate.
  - code: unauthenticated
    http_status: 401
    purpose: No live credential for the route liveness class.
  - code: forbidden
    http_status: 403
    purpose: A live credential lacks authority; details.reason identifies the refusal.
  - code: not_found
    http_status: 404
    purpose: The authorized resource does not exist.
  - code: unsupported_route
    http_status: 404
    purpose: The server does not register this route.
  - code: method_not_allowed
    http_status: 405
    purpose: The path exists but does not accept this method.
  - code: lock_held
    http_status: 409
    purpose: A transaction lost its holder or generation fence.
  - code: illegal_transition
    http_status: 409
    purpose: The state edge or replay payload is not legal.
  - code: conflict
    http_status: 409
    purpose: An existing resource conflicts with the requested change.
  - code: spec_drift
    http_status: 409
    purpose: A sealed spec differs from the submitted spec.
  - code: plan_drift
    http_status: 409
    purpose: Reconstructed code differs from the persisted job specification.
  - code: payload_too_large
    http_status: 413
    purpose: The request exceeds the named size limit.
  - code: plan_invalid
    http_status: 422
    purpose: A plan or expansion violates its contract.
  - code: plan_failed
    http_status: 422
    purpose: Pipeline planning failed.
  - code: limit_exceeded
    http_status: 422
    purpose: An explicit setting exceeds its ceiling.
  - code: capability_unsupported
    http_status: 422
    purpose: The placement capability table refuses a declaration.
  - code: secret_in_identifier
    http_status: 422
    purpose: A stored identifier contains a registered secret value.
  - code: insufficient_credit
    http_status: 402
    purpose: The team cannot reserve the requested compute.
  - code: quota_exceeded
    http_status: 429
    purpose: An atomic shared quota reservation failed.
  - code: rate_limited
    http_status: 429
    purpose: The request may retry after the stated delay.
  - code: unavailable
    http_status: 503
    purpose: A required service is temporarily unavailable.
  - code: internal
    http_status: 500
    purpose: An internal failure occurred; private diagnostics stay server-side.
  - code: policy_missing
    http_status: 500
    purpose: A registered route has no policy row.
  - code: integrity_failure
    http_status: 422
    purpose: Transferred bytes fail size or digest verification.
  - code: blob_missing
    http_status: 404
    purpose: An authorized blob is absent or tombstoned.
  - code: protocol_mismatch
    http_status: 400
    purpose: Hello cannot agree on a protocol major.
  - code: protocol_error
    http_status: 400
    purpose: A protocol frame violates the negotiated contract.
  - code: unknown_op
    http_status: 400
    purpose: The protocol operation is not supported.
  - code: unknown_pipeline
    http_status: 404
    purpose: The SDK did not declare the requested pipeline.
  - code: unknown_job
    http_status: 404
    purpose: The SDK did not declare the requested job.
  - code: unknown_step
    http_status: 404
    purpose: The SDK did not declare the requested step.
  - code: unknown_closure
    http_status: 404
    purpose: The SDK did not declare the requested closure.
  - code: no_plan
    http_status: 409
    purpose: The process has not accepted a plan for this operation.
  - code: sdk_exited
    http_status: 502
    purpose: The SDK process exited before replying.
  - code: frames_closed
    http_status: 502
    purpose: The protocol stream closed before replying.
  - code: sdk_error
    http_status: 422
    purpose: An SDK or user function reported an unclassified failure.
  - code: cancelled
    http_status: 409
    purpose: The operation was cancelled.
  - code: deadline_exceeded
    http_status: 408
    purpose: The applicable execution, queue or approval deadline passed.
  - code: version_revoked
    http_status: 422
    purpose: Signed policy revoked the pinned engine; details give version and reason, hint names sparkwing upgrade.
  - code: version_unsupported
    http_status: 422
    purpose: An effective signed minimum refuses the engine or runner; details give the minimum, reason and update action.

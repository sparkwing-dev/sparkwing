        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      x-sparkwing-scope: team.admin
      tags: [teams]
      summary: Store, or replace, the team's git credential for a host.
      description: >-
        An owner. Kind ssh takes an unencrypted private_key; the controller reads the host's ssh host key now (on port, default 22, refusing an address inside its own network) and pins it, and the credential is released only after an owner confirms its fingerprint. Replacing an ssh key keeps a confirmation only while the host key is unchanged. Kind https takes a token and an optional username (default x-access-token) and is usable at once. The value is sealed under the controller's secrets key, and 409 secrets_key_required answers a controller without one. A team stores at most 50 credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.gitCredentialPutReq
              type: object
              required: [host, kind]
              properties:
                host: {type: string, description: "A hostname such as gitlab.com, with no scheme, port or path."}
                kind: {type: string, enum: [ssh, https]}
                port: {type: integer, description: "The ssh port the host key is read from; 22 when absent."}
                private_key: {type: string, description: "An unencrypted PEM or OpenSSH private key, for kind ssh."}
                username: {type: string, description: "The https username, for kind https."}
                token: {type: string, description: "The https token, for kind https."}

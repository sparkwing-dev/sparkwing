info:
  description: The shared policy defines HTTP and local API socket authorization. x-sparkwing-policy preserves each complete access alternative; every grant within one alternative is required. Bindings, liveness and external proofs remain mandatory. JSON schemas describe serialization shapes, while the shared validators enforce semantic constraints. Unmapped success bodies are marked explicitly. Native runtime conformance requires separate acceptance evidence.
  title: Sparkwing controller API
  version: "1"
openapi: 3.1.0
paths:
  /.well-known/jwks.json:
    get:
      description: Authorization is declared by the shared policy. A shared success-body contract is not documented for this operation.
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal.apierr.Envelope'
          description: Canonical API failure.
      summary: GET /.well-known/jwks.json
      x-sparkwing-policy:
        method: GET
        path: /.well-known/jwks.json
        audience: controller
        owner: none
        authentication: public
        access: []
        retry: safe
      x-sparkwing-wire: undocumented
  /.well-known/openid-configuration:
    get:
      description: Authorization is declared by the shared policy. A shared success-body contract is not documented for this operation.
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal.apierr.Envelope'
          description: Canonical API failure.
      summary: GET /.well-known/openid-configuration
      x-sparkwing-policy:
        method: GET
        path: /.well-known/openid-configuration
        audience: controller
        owner: none
        authentication: public
        access: []
        retry: safe
      x-sparkwing-wire: undocumented
  /api/v1/approvals:
    get:
      parameters:
        - in: query
          name: pending
          schema:
            type: boolean
      responses:
        2XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal.controllerwire.Approvals'
          description: Successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal.apierr.Envelope'
          description: Canonical API failure.
      summary: List pending approvals
      x-sparkwing-policy:
        method: GET
        path: /api/v1/approvals
        audience: controller
        owner: team
        authentication: capability
        access:
          - credential: unbound_member_or_local
            grants:
              - runs.read
            binding: none
            liveness: credential
        retry: safe
  /api/v1/auth/logout:
    post:
      description: Authorization is declared by the shared policy. A shared success-body contract is not documented for this operation.
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal.apierr.Envelope'
          description: Canonical API failure.
      summary: POST /api/v1/auth/logout
      x-sparkwing-policy:
        method: POST
        path: /api/v1/auth/logout
        audience: controller
        owner: account
        authentication: browser_flow_csrf_nonce
        access: []
        retry: never
      x-sparkwing-wire: undocumented
  /api/v1/auth/session:
    get:
      description: Authorization is declared by the shared policy. A shared success-body contract is not documented for this operation.
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal.apierr.Envelope'
          description: Canonical API failure.
      summary: GET /api/v1/auth/session
      x-sparkwing-policy:
        method: GET
        path: /api/v1/auth/session
        audience: controller
        owner: account
        authentication: browser_flow_csrf_nonce
        access: []
        retry: never
      x-sparkwing-wire: undocumented
  /api/v1/auth/whoami:
    get:
      description: Authorization is declared by the shared policy. A shared success-body contract is not documented for this operation.
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal.apierr.Envelope'
          description: Canonical API failure.
      summary: GET /api/v1/auth/whoami
      x-sparkwing-policy:
        method: GET
        path: /api/v1/auth/whoami
        audience: controller
        owner: none
        authentication: capability
        access:
          - credential: discovery
            grants: []
            binding: none
            liveness: credential
        retry: safe
      x-sparkwing-wire: undocumented
  /api/v1/capabilities:
    get:
      parameters:
        - in: query
          name: engine_version
          schema:
            type: string
      responses:
        2XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal.controllerwire.Compatibility'
          description: Successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal.apierr.Envelope'
          description: Canonical API failure.
      summary: Read engine compatibility
      x-sparkwing-policy:
        method: GET
        path: /api/v1/capabilities
        audience: controller
        owner: none
        authentication: public
        access: []
        retry: safe
  /api/v1/claims/{claim}/heartbeat:
    post:
      parameters:
        - in: path
          name: claim
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal.controllerwire.RenewalRequest'
        required: true
      responses:
        2XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal.controllerwire.RenewalResponse'
          description: Successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal.apierr.Envelope'
          description: Canonical API failure.
      summary: Renew a claim
      x-sparkwing-policy:
        method: POST
        path: /api/v1/claims/{claim}/heartbeat
        audience: controller
        owner: run
        authentication: capability
        access:
          - credential: awarded_or_delegated_claim
            grants:
              - node.report
            binding: ownClaim
            liveness: reporting
          - credential: eval_unit
            grants:
              - expansion.submit
            binding: ownEval
            liveness: expansion
        retry: safe
  /api/v1/claims/{claim}/log-manifest:
    post:
      description: Authorization is declared by the shared policy. A shared success-body contract is not documented for this operation.
      parameters:
        - in: path
          name: claim
          required: true
          schema:
            type: string
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal.apierr.Envelope'
          description: Canonical API failure.
      summary: POST /api/v1/claims/{claim}/log-manifest
      x-sparkwing-policy:
        method: POST
        path: /api/v1/claims/{claim}/log-manifest
        audience: controller
        owner: run
        authentication: capability
        access:
          - credential: awarded_or_delegated_claim
            grants:
              - log.tail
            binding: ownClaim
            liveness: logTail
          - credential: eval_unit
            grants:
              - expansion.submit
            binding: ownEval
            liveness: logTail
        retry: exact_body
      x-sparkwing-wire: undocumented
  /api/v1/claims/{claim}/log-segments:
    post:
      description: Authorization is declared by the shared policy. A shared success-body contract is not documented for this operation.
      parameters:
        - in: path
          name: claim
          required: true
          schema:
            type: string
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal.apierr.Envelope'
          description: Canonical API failure.
      summary: POST /api/v1/claims/{claim}/log-segments

  /api/v1/concurrency/{key}/acquire:
    parameters:
      - in: path
        name: key
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: runs.state
      tags: [concurrency]
      summary: Try to acquire a slot under a concurrency key.
      description: |
        Status code carries the outcome class:
        - **200** -- granted or cached.
        - **202** -- queued, coalesced, or `cancel_others` in progress.
        - **429** -- skipped or failed (terminal).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AcquireSlotRequest"}
      responses:
        "200":
          description: Granted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AcquireSlotResponse"}
        "202":
          description: Queued / coalesced / cancel_others.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AcquireSlotResponse"}
        "429":
          description: Skipped / failed (terminal).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AcquireSlotResponse"}

  /api/v1/concurrency/{key}/heartbeat:
    parameters:
      - in: path
        name: key
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: runs.state
      tags: [concurrency]
      summary: Extend a holder's lease.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.heartbeatSlotReq
              type: object
              required: [holder_id]
              properties:
                holder_id: {type: string}
                lease_secs: {type: integer}
      responses:
        "200":
          description: New lease + supersede flag.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.heartbeatSlotResp
                type: object
                required: [lease_expires_at, cancelled_by_newer]
                properties:
                  lease_expires_at: {type: string, format: date-time}
                  cancelled_by_newer: {type: boolean}
        "409": {description: Lock held by another runner.}

  /api/v1/concurrency/{key}/release:
    parameters:
      - in: path
        name: key
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: runs.state
      tags: [concurrency]
      summary: Release a slot. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.releaseSlotReq
              type: object
              required: [holder_id, outcome]
              properties:
                holder_id: {type: string}
                outcome: {type: string}
                output_ref: {type: string}
                cache_key_hash: {type: string}
                cache_ttl_ns: {type: integer, format: int64}
      responses:
        "204": {description: Released.}

  /api/v1/concurrency/{key}/state:
    parameters:
      - in: path
        name: key
        required: true
        schema: {type: string}
    get:
      x-sparkwing-scope: runs.read
      tags: [concurrency]
      summary: Inspect capacity + holders + waiters under a key.
      responses:
        "200":
          description: State snapshot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConcurrencyState"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/concurrency/{key}/notify:
    parameters:
      - in: path
        name: key
        required: true
        schema: {type: string}
      - in: query
        name: run_id
        required: true
        schema: {type: string}
      - in: query
        name: node_id
        required: false
        schema: {type: string}
    get:
      x-sparkwing-scope: runs.read
      tags: [concurrency]
      summary: Server-sent event stream of waiter resolution events.
      description: |
        Streams Server-Sent Events for a single (run_id, node_id)
        waiter on this concurrency key. The server polls the
        concurrency state at 250ms cadence and emits exactly one
        terminal event per stream, then closes:

        - `event: ready` -- the caller is now a holder of the slot.
        - `event: superseded` -- the caller is no longer a waiter
          (slot acquired elsewhere, run cancelled, etc.).
        - `event: stream_end` -- fail-safe timeout (max 30 minutes
          per stream) or the concurrency key no longer exists; the
          event payload carries a `reason` field
          (`"max_wait"` or `"key_not_found"`).

        Every event payload also carries the `key` and `run_id`
        fields, plus `node_id` when one was supplied. The stream
        opens with a `: open` comment line so proxies don't buffer.
      responses:
        "200":
          description: |
            SSE stream of resolution events. The response is
            `text/event-stream`; clients consume it line-by-line
            until the terminal event arrives.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE frames. Each event has the form

                  ```
                  event: ready|superseded|stream_end
                  data: {"key":"...","run_id":"...","node_id":"...","reason":"..."}
                  ```

                  `node_id` is present when the request supplied one;
                  `reason` is present only on `stream_end`.
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/concurrency/{key}/holder:
    parameters: [{$ref: "#/components/parameters/ConcurrencyKey"}]
    get:
      x-sparkwing-scope: runs.state
      tags: [concurrency]
      summary: Read one holder's slot.
      parameters:
        - in: query
          name: holder_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The holder's slot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConcurrencyHolder"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/concurrency/{key}/resolve:
    parameters: [{$ref: "#/components/parameters/ConcurrencyKey"}]
    get:
      x-sparkwing-scope: runs.state
      tags: [concurrency]
      summary: Resolve one waiter's standing in a single read.
      description: |
        Answers where the caller sits in the queue and what the leader it
        coalesced behind produced. `bypass_read=true` skips the cache
        lookup. The polling counterpart to the `notify` stream.
      parameters:
        - in: query
          name: run_id
          required: true
          schema: {type: string}
        - in: query
          name: node_id
          schema: {type: string}
        - in: query
          name: cache_key_hash
          schema: {type: string}
        - in: query
          name: leader_run_id
          schema: {type: string}
        - in: query
          name: leader_node_id
          schema: {type: string}
        - in: query
          name: bypass_read
          schema: {type: boolean}
      responses:
        "200":
          description: The waiter's status, position, and leader outcome.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResolveWaiterResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/concurrency/{key}/cancel-waiter:
    parameters: [{$ref: "#/components/parameters/ConcurrencyKey"}]
    post:
      x-sparkwing-scope: admin
      tags: [concurrency]
      summary: Drop one waiter from a key's queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.cancelWaiterReq
              type: object
              required: [run_id]
              properties:
                run_id: {type: string}
                node_id: {type: string}
      responses:
        "200":
          description: Whether a waiter row was removed.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.cancelWaiterResp
                type: object
                required: [cancelled]
                properties:
                  cancelled: {type: boolean}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/concurrency/{key}/force-release:
    parameters: [{$ref: "#/components/parameters/ConcurrencyKey"}]
    post:
      x-sparkwing-scope: admin
      tags: [concurrency]
      summary: Drop superseded holders and promote the next waiters.
      description: |
        Releases every holder the store marked superseded, then promotes
        waiters into the slots that freed. The operator escape hatch for a
        key whose holders died without releasing.
      responses:
        "200":
          description: The holders that were dropped.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.forceReleaseResp
                type: object
                properties:
                  dropped:
                    type: array
                    items: {$ref: "#/components/schemas/ConcurrencyHolder"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/queue/state:
    get:
      x-sparkwing-scope: runs.read
      tags: [concurrency]
      summary: Snapshot every concurrency key, holder, waiter, and runner.
      description: |
        One deployment-wide view for the queue dashboard: per-key capacity
        and cost held, the live holders, the waiting nodes with their
        positions, and the headroom each runner last reported.
      responses:
        "200":
          description: The queue snapshot.
          content:
            application/json:
              schema:
                x-sparkwing-go-partial: pkg/wingwire.QueueState
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      x-sparkwing-go-partial: pkg/wingwire.ResourceState
                      type: object
                      properties:
                        key: {type: string}
                        capacity: {type: number}
                        held: {type: number}
                  holders:
                    type: array
                    items:
                      x-sparkwing-go-partial: pkg/wingwire.Holder
                      type: object
                      properties:
                        run_id: {type: string}
                        semaphores:
                          type: array
                          items: {type: string}
                        elapsed_ms: {type: integer, format: int64}
                        origin: {type: string}
                  waiters:
                    type: array
                    items:
                      x-sparkwing-go-partial: pkg/wingwire.Waiter
                      type: object
                      properties:
                        run_id: {type: string}
                        position: {type: integer}
                        waiting_on:
                          type: array
                          items: {type: string}
                        waiting_ms: {type: integer, format: int64}
                        origin: {type: string}
                  runners:
                    type: array
                    items:
                      x-sparkwing-go-partial: pkg/wingwire.RunnerHeadroom
                      type: object
                      properties:
                        name: {type: string}
                        cores: {type: number}
                        memory_bytes: {type: integer, format: int64}
                        queue_depth: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/nodes/claim:
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Claim the oldest ready, unclaimed node matching labels.
      description: |
        The claim binds to the claiming token -- its prefix segment and
        principal name -- as well as to `holder_id`. The per-node write
        routes and the execution view then admit that token alone while
        the lease is unexpired; another runner token gets `403` with
        `"error": "claim_required"`, even one carrying the same principal
        name. `lease_secs` is clamped to the server cap of 10 minutes.
        A request carrying `executor_name` is a sealed assisted offer:
        it validates the private binding and returns `409
        body_attestation_required` before reservation or award. The `200`
        response remains active only for the ordinary legacy claim shape that
        omits `executor_name`; sealed nodes are excluded from that path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.claimNodeReq
              type: object
              required: [holder_id]
              properties:
                holder_id: {type: string}
                run_id: {type: string}
                node_id: {type: string}
                executor_name: {type: string}
                reservation_id: {type: string}
                resource_digest: {type: string}
                slot: {type: integer}
                lease_secs: {type: integer}
                execution_binding:
                  $ref: "#/components/schemas/ExecutionClaimBinding"
                labels:
                  type: array
                  items: {type: string}
                headroom:
                  allOf: [{$ref: "#/components/schemas/AgentHeadroom"}]
                  nullable: true
                  description: >-
                    The runner's free capacity at claim time, which the agents view reports back. Omit it when the runner engages no local admission daemon.
                capacity:
                  allOf: [{$ref: "#/components/schemas/ClaimCapacity"}]
                  nullable: true
                  description: >-
                    The runner's own slot ceiling and in-flight claim count, which local-first placement reads to tell a saturated runner from an idle one. Omit it to advertise no ceiling, which counts as having room.
                allow_repos:
                  type: array
                  items: {type: string}
                  description: >-
                    Repositories this runner's owner allows it to build, as host/path patterns where '*' matches within one path segment. A list that is present, even empty, confines the claim to runs from matching repositories; an absent list claims as before.
      responses:
        "200":
          description: Claimed node.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Node"}
                  - x-sparkwing-go-partial: pkg/store.Node
                    type: object
                    description: >-
                      Exact claim fence returned only to the authenticated runner that won this claim.
                    properties:
                      claimed_by: {type: string}
                      claim_generation: {type: integer, format: int64}
                      claim_membership_id: {type: string}
                      reservation_id: {type: string}
        "204": {description: Nothing to claim.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "402":
          description: >-
            The claiming token is metered and the credit balance does not cover a minute of its time. The node stays ready and the waiting run records why.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreditsRefused"}
        "409":
          description: >-
            Assisted offer refusal. The controller does not reserve, record, or award the offer.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExecutionAdmissionError"}

  /api/v1/pool:
    get:
      x-sparkwing-scope: runs.read
      tags: [pool]
      summary: List warm-PVC pool. **cluster-only** (requires `AttachPool`).
      responses:
        "200":
          description: Pool snapshot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PoolListResponse"}
        "503": {description: Pool not ready.}

  /api/v1/pool/checkout:
    post:
      x-sparkwing-scope: admin
      tags: [pool]
      summary: Check out a clean PVC. **cluster-only**.
      parameters:
        - in: query
          name: job_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Checked-out PVC name.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: none
                type: object
                required: [pvc]
                properties:
                  pvc: {type: string}
        "409": {description: No clean PVC available -- fall back to cache-less build.}

  /api/v1/pool/return:
    post:
      x-sparkwing-scope: admin
      tags: [pool]
      summary: Return a PVC to the pool (marks it dirty). **cluster-only**.
      parameters:
        - in: query
          name: pvc
          required: true
          schema: {type: string}
      responses:
        "204": {description: Returned.}

  /api/v1/pool/heartbeat:
    post:
      x-sparkwing-scope: admin
      tags: [pool]
      summary: Keep ownership of an in-use PVC alive. **cluster-only**.
      parameters:
        - in: query
          name: pvc
          required: true
          schema: {type: string}
        - in: query
          name: job_id
          required: true
          schema: {type: string}
      responses:
        "204": {description: Renewed.}
        "409": {description: Heartbeat lost (job_id mismatch or PVC expired).}

  /api/v1/artifacts/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema: {type: string}
        description: Content-addressed artifact key.
    get:
      x-sparkwing-scope: runs.read
      tags: [artifacts]
      summary: Stream an artifact's bytes. **laptop-only** (requires `WithArtifactStore`).
      responses:
        "200":
          description: Artifact bytes.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/tokens:
    post:
      x-sparkwing-scope: admin
      tags: [tokens]
      summary: Mint a new bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateTokenRequest"}
      responses:
        "201":
          description: New token (raw value is included **once** in this response).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreateTokenResponse"}
        "400":
          description: >-
            Invalid request: missing principal or kind, or a scope the controller does not honor (the message names the offending scope and the valid set).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    get:
      x-sparkwing-scope: admin
      tags: [tokens]
      summary: List all tokens (no raw values).
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: none
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: {$ref: "#/components/schemas/Token"}

  /api/v1/tokens/{prefix}:
    parameters:
      - in: path
        name: prefix
        required: true
        schema: {type: string, description: The 12-char prefix returned at mint.}
    get:
      x-sparkwing-scope: admin
      tags: [tokens]
      summary: Lookup a token by prefix.
      responses:
        "200":
          description: Token (no raw value).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Token"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      x-sparkwing-scope: admin
      tags: [tokens]
      summary: Revoke a token by prefix.
      responses:
        "204": {description: Revoked.}

  /api/v1/tokens/{prefix}/rotate:
    parameters:
      - in: path
        name: prefix
        required: true
        schema: {type: string}
    post:
      x-sparkwing-scope: admin
      tags: [tokens]
      summary: Mint a replacement; mark the prior token revoked + replaced_by.
      responses:
        "200":
          description: New token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreateTokenResponse"}

  /api/v1/accounts/{account}:
    delete:
      x-sparkwing-scope: admin
      tags: [teams]
      summary: Delete an account on the operator's word.
      description: >-
        Carries out a deletion request that reached the operator by other means. The path names the account by id or by email; an address held by more than one account, none verified, answers 409 and needs the id. The deletion is the one `DELETE /api/v1/me` performs, including its 409 for a last owner of a team with other members.
      parameters:
        - {name: account, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.deletedAccountJSON
                type: object
                required: [account_id, deleted_teams]
                properties:
                  account_id: {type: string}
                  deleted_teams:
                    type: array
                    items: {type: string}
                    description: Teams the account was the only member of, now queued for deletion.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The account is the last owner of teams that have other members, or a team being deleted has a credit checkout in progress (wait for it to expire or complete) or is on hold over a disputed payment (contact support).
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.lastOwnerRefusalJSON
                type: object
                required: [error, teams]
                properties:
                  error: {type: string}
                  teams:
                    type: array
                    items: {$ref: "#/components/schemas/TeamRef"}

  /api/v1/teams/{team}:
    delete:
      x-sparkwing-scope: admin
      tags: [teams]
      summary: Delete a team on the operator's word.
      description: The deletion `DELETE /api/v1/team` performs, without its owner and only-team checks. The default team cannot be deleted.
      parameters:
        - {name: team, in: path, required: true, schema: {type: string}}
      responses:
        "202":
          description: Deletion queued; the team is closed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TeamDeletion"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: "The team has a credit checkout in progress (wait for it to expire or complete) or is on hold over a disputed payment (contact support)."}

  /api/v1/users:
    get:
      x-sparkwing-scope: admin
      tags: [users]
      summary: List local-account users.
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: none
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: {$ref: "#/components/schemas/User"}
    post:
      x-sparkwing-scope: admin
      tags: [users]
      summary: Create a user, or bootstrap the first administrator.
      description: |
        Answers without a credential while the users table is empty, and
        goes back to demanding the route's scope once any user exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.createUserReq
              type: object
              required: [name, password]
              properties:
                name: {type: string}
                password: {type: string}
                scopes:
                  type: array
                  description: >-
                    Scopes this account's dashboard sessions carry. Omit to grant admin. The bootstrap path honours the set it is given but rejects one that omits admin, so the first account can always reach the rest of the API.
                  items: {type: string}
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "409": {description: Bootstrap race lost.}

  /api/v1/users/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: {type: string}
    delete:
      x-sparkwing-scope: admin
      tags: [users]
      summary: Delete a user.
      responses:
        "204": {description: Deleted.}

  /api/v1/auth/login:
    post:
      x-sparkwing-scope: public

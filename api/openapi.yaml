# GENERATED IN PART by internal/apispec. The path and method inventory and
# every x-sparkwing-scope value are read from the route registrations in
# pkg/controller/server.go; summaries, schemas, and examples are hand-written
# here. Rewrite this file with `bash bin/gen-api-docs.sh` and prove it current
# with `bash bin/check-api-spec.sh`. Give a route's authorization as
# x-sparkwing-scope, never as prose, so no two sentences can disagree.

openapi: 3.0.3

info:
  title: Sparkwing Controller HTTP API
  version: "0.1"
  description: |
    HTTP API served by `sparkwing-controller` (cluster mode) and embedded
    in the `sparkwing` CLI's `dashboard start` supervisor (laptop mode).
    Same route table, same wire shapes; the mode is determined by which
    functional options the process wires into the
    [pkg/controller.Server][1] instance.

    Mode-conditional routes are marked in each operation's `description`:

    - **cluster-only** -- wired when the process calls `AttachPool`
      (warm-PVC pool routes under `/api/v1/pool/*`).
    - **laptop-only** -- wired when the process calls `WithArtifactStore`
      (`GET /api/v1/artifacts/{key}`).

    See [VERSIONING.md][2] for stability promises around this surface:
    JSON field renames and behavioral changes are tracked under module
    semver. The Go client lives at `pkg/controller/client/`.

    [1]: https://pkg.go.dev/github.com/sparkwing-dev/sparkwing/pkg/controller
    [2]: ../VERSIONING.md
  contact:
    name: sparkwing
    url: https://github.com/sparkwing-dev/sparkwing
  license:
    name: Elastic License 2.0
    url: https://github.com/sparkwing-dev/sparkwing/blob/main/LICENSE

servers:
  - url: http://localhost:4344
    description: Default cluster-mode `sparkwing-controller` bind address.
  - url: http://127.0.0.1:4343
    description: Default laptop-mode `sparkwing dashboard start` bind address.

tags:
  - name: runs
    description: Run lifecycle and read paths.
  - name: nodes
    description: Per-DAG-node lifecycle (workers and dashboards).
  - name: node-steps
    description: Per-step state inside a node's inner DAG.
  - name: events
    description: Append-only audit + telemetry stream per run.
  - name: triggers
    description: Pipeline invocation intake and worker dispatch.
  - name: approvals
    description: Human gates between nodes.
  - name: concurrency
    description: Distributed mutual exclusion + coalescing.
  - name: debug-pauses
    description: Operator-induced pauses for live debugging.
  - name: pool
    description: Warm-PVC pool (cluster-only).
  - name: artifacts
    description: Content-addressed blob reads (laptop-only).
  - name: tokens
    description: Bearer-token CRUD (admin).
  - name: users
    description: Local-account CRUD + bootstrap.
  - name: auth
    description: Login / logout / session + introspection.
  - name: secrets
    description: Named secret material.
  - name: agents
    description: Active runner heartbeats.
  - name: pipelines
    description: Cross-pipeline / cross-repo reads.
  - name: gitcache
    description: Controller-side proxy onto the Git cache.
  - name: trends
    description: Aggregate dashboard charts.
  - name: receipts
    description: Per-run audit + cost receipts (cluster).
  - name: webhooks
    description: External-trigger ingress (GitHub).
  - name: health
    description: Process probes and Prometheus scrape.

security:
  - bearerToken: []

paths:

  /api/v1/runs:
    post:
      x-sparkwing-scope: runs.state
      tags: [runs]
      summary: Create a run row directly.
      description: |
        Insert a [Run][1] in the caller-supplied state. Idempotent
        upgrade of `pending` rows pre-allocated by trigger intake.
        [1]: #/components/schemas/Run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Run"
      responses:
        "201": {description: Created. Empty body.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
    get:
      x-sparkwing-scope: runs.read
      tags: [runs]
      summary: List runs filtered by query parameters.
      description: |
        Filters are applied before newest-first ordering and `limit`.
        Empty result is `{"runs": []}`.
      parameters:
        - in: query
          name: pipeline
          schema: {type: string}
          description: csv of pipeline names.
        - in: query
          name: status
          schema: {type: string}
          description: csv of run statuses (e.g. `running,pending`).
        - in: query
          name: git_sha
          schema: {type: string}
          description: csv of git SHA prefixes.
        - in: query
          name: git_branch
          schema: {type: string}
          description: csv of exact git branch names.
        - in: query
          name: repo
          schema: {type: string}
          description: csv of exact stored repository identities.
        - in: query
          name: repo_url
          schema: {type: string}
          description: csv of exact canonical repository URLs.
        - in: query
          name: root_only
          schema: {type: boolean}
          description: When true, exclude child runs.
        - in: query
          name: since
          schema: {type: string, format: duration}
          description: Go duration (`1h`, `30m`). Returns runs younger than this.
        - in: query
          name: limit
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: List wrapped under `runs`.
          headers:
            X-Sparkwing-Run-Filter-Version:
              description: Native identity-filter contract version.
              schema: {type: string, enum: ["1"]}
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: {$ref: "#/components/schemas/Run"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}:
    parameters: [{$ref: "#/components/parameters/RunID"}]
    get:
      x-sparkwing-scope: runs.read or nodes.claim or triggers.claim
      tags: [runs]
      summary: Fetch a single run, optionally with its nodes.
      description: |
        With `?include=nodes` returns `{run, nodes}` and decorates each
        node with plan-snapshot context (step rows, approvals,
        spawned children). Without include, returns the raw `Run`.

        Values of arguments the pipeline declared `secret:"true"` are
        replaced with `***` by default. `?include=secret_values`
        returns them in full, and is honored for an `admin` token and
        for a `nodes.claim` token holding an unexpired claim on one of
        the run's nodes -- a cluster executor fetches the arguments it
        runs with from this endpoint. A controller running with
        authentication disabled honors it for every caller. Any other
        caller gets the redacted view whether or not it asks. Comma-separate to
        combine, e.g. `?include=nodes,secret_values`.
      parameters:
        - in: query
          name: include
          description: >-
            Comma-separated. `nodes` wraps the response as `{run, nodes}`; `secret_values` returns unredacted argument values to executor-scoped callers.
          schema: {type: string, enum: [nodes, secret_values, "nodes,secret_values"]}
      responses:
        "200":
          description: Run, or `{run, nodes}` when `include=nodes`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Run"
                  - type: object
                    required: [run, nodes]
                    properties:
                      run: {$ref: "#/components/schemas/Run"}
                      nodes:
                        type: array
                        items: {$ref: "#/components/schemas/Node"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      x-sparkwing-scope: admin
      tags: [runs]
      summary: Delete a run and its nodes / events.
      responses:
        "204": {description: Deleted.}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/finish:
    parameters: [{$ref: "#/components/parameters/RunID"}]
    post:
      x-sparkwing-scope: runs.state
      tags: [runs]
      summary: Mark a run terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FinishRunRequest"}
      responses:
        "204": {description: Run finished.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/plan:
    parameters: [{$ref: "#/components/parameters/RunID"}]
    post:
      x-sparkwing-scope: runs.state
      tags: [runs]
      summary: Upload the run's plan-snapshot blob.
      description: |
        Body is opaque bytes (typically JSON serialized plan).
        Content-Type is ignored.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "204": {description: Plan stored.}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/cancel:
    parameters: [{$ref: "#/components/parameters/RunID"}]
    post:
      x-sparkwing-scope: runs.write
      tags: [runs]
      summary: Request cancellation. The orchestrator surfaces this via heartbeat.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        "204": {description: Cancellation requested.}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/runs/{id}/retry:
    parameters: [{$ref: "#/components/parameters/RunID"}]
    post:
      x-sparkwing-scope: runs.write
      tags: [runs]
      summary: Re-run a failed run. `?full=1` re-runs every node; default skips passed.
      parameters:
        - in: query
          name: full
          schema: {type: string, enum: ["1", "true"]}
          description: When set, re-runs every node regardless of prior outcome.
      responses:
        "200":
          description: New run created.
          content:
            application/json:
              schema:
                type: object
                required: [run_id]
                properties:
                  run_id: {type: string}
                  status: {type: string}
                  trigger_source: {type: string}
                  started_at: {type: string, format: date-time}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/attempts:
    parameters: [{$ref: "#/components/parameters/RunID"}]
    get:
      x-sparkwing-scope: runs.read
      tags: [runs]
      summary: List the retry tree for a run.
      description: |
        Walks `retry_of` / `retried_as` lineage and returns every
        related run in chronological order.
      responses:
        "200":
          description: Retry tree.
          content:
            application/json:
              schema:
                type: object
                required: [attempts]
                properties:
                  attempts:
                    type: array
                    items: {$ref: "#/components/schemas/Run"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/runs/{id}/receipt:
    parameters: [{$ref: "#/components/parameters/RunID"}]
    get:
      x-sparkwing-scope: runs.read
      tags: [receipts]
      summary: Per-run audit + cost receipt.
      description: |
        Recomputed on demand. Field set is documented under the
        `Receipt` schema below.
      responses:
        "200":
          description: Receipt JSON.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Receipt"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/runs/{id}/nodes:
    parameters: [{$ref: "#/components/parameters/RunID"}]
    get:
      x-sparkwing-scope: runs.read
      tags: [nodes]
      summary: List nodes for a run, insertion order.
      responses:
        "200":
          description: Nodes wrapped under `nodes`.
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items: {$ref: "#/components/schemas/Node"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      x-sparkwing-scope: runs.state
      tags: [nodes]
      summary: Insert a node row in `pending` state.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Node"}
      responses:
        "201": {description: Node created.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/nodes/{nodeID}:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    get:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Fetch one node.
      responses:
        "200":
          description: Node.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Node"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/runs/{id}/nodes/{nodeID}/start:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: runs.state
      tags: [nodes]
      summary: Mark a node `running`.
      responses:
        "204": {description: Started.}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/nodes/{nodeID}/finish:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: runs.state
      tags: [nodes]
      summary: Mark a node terminal with outcome + optional output / error.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FinishNodeRequest"}
      responses:
        "204": {description: Finished.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/nodes/{nodeID}/deps:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: runs.state
      tags: [nodes]
      summary: Rewrite a node's dependency list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deps]
              properties:
                deps:
                  type: array
                  items: {type: string}
      responses:
        "204": {description: Updated.}

  /api/v1/runs/{id}/nodes/{nodeID}/output:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    get:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Read the raw output JSON for one node.
      description: |
        Returns the exact bytes the orchestrator wrote -- opaque to
        the controller. Empty body when the node hasn't completed
        with output.
      responses:
        "200":
          description: Raw JSON output.
          content:
            application/json:
              schema:
                type: string
                format: byte
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/runs/{id}/nodes/{nodeID}/dispatch:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Record a node-dispatch attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NodeDispatch"}
      responses:
        "204": {description: Recorded.}
    get:
      x-sparkwing-scope: runs.read
      tags: [nodes]
      summary: Fetch the latest dispatch (or a specific `?seq=N`) for a node.
      description: >-
        Admits `runs.read`, but fills `env_json` only for an `admin` principal; every other reader gets the row without it. `redacted_keys` is served to all readers.
      parameters:
        - in: query
          name: seq
          schema: {type: integer}
      responses:
        "200":
          description: Dispatch row.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NodeDispatch"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/runs/{id}/nodes/{nodeID}/dispatches:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    get:
      x-sparkwing-scope: runs.read
      tags: [nodes]
      summary: List every dispatch attempt for a node.
      description: >-
        Admits `runs.read`, but fills `env_json` only for an `admin` principal; every other reader gets each row without it. `redacted_keys` is served to all readers.
      responses:
        "200":
          description: Dispatch list.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/NodeDispatch"}

  /api/v1/runs/{id}/nodes/{nodeID}/activity:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Update the node's phase string for the dashboard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                detail: {type: string}
      responses:
        "204": {description: Updated.}

  /api/v1/runs/{id}/nodes/{nodeID}/touch:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Update the node's last-heartbeat timestamp.
      responses:
        "204": {description: Touched.}

  /api/v1/runs/{id}/nodes/{nodeID}/annotations:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Append one annotation string to the node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [annotation]
              properties:
                annotation: {type: string}
      responses:
        "204": {description: Appended.}

  /api/v1/runs/{id}/nodes/{nodeID}/summary:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Overwrite the node-scoped run summary markdown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [summary]
              properties:
                summary: {type: string}
      responses:
        "204": {description: Stored.}

  /api/v1/runs/{id}/nodes/{nodeID}/artifact-manifest:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Record the node's published-artifact manifest digest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest_digest]
              properties:
                manifest_digest: {type: string}
      responses:
        "204": {description: Stored.}

  /api/v1/runs/{id}/nodes/{nodeID}/metrics:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Append one metric sample to a node.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MetricSample"}
      responses:
        "204": {description: Recorded.}
    get:
      x-sparkwing-scope: runs.read
      tags: [nodes]
      summary: List metric samples for a node.
      responses:
        "200":
          description: Sample list.
          content:
            application/json:
              schema:
                type: object
                required: [metrics]
                properties:
                  metrics:
                    type: array
                    items: {$ref: "#/components/schemas/MetricSample"}

  /api/v1/runs/{id}/nodes/{nodeID}/mark-ready:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: admin
      tags: [nodes]
      summary: Stamp `ready_at` so pool runners can claim the node.
      responses:
        "204": {description: Stamped.}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/runs/{id}/nodes/{nodeID}/revoke-ready:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: admin
      tags: [nodes]
      summary: Atomically null `ready_at` iff the node is not claimed.
      responses:
        "200":
          description: Whether the revoke won the race.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: {type: boolean}

  /api/v1/runs/{id}/nodes/{nodeID}/heartbeat:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Extend the holding runner's claim lease.
      description: |
        `lease_secs` is clamped to the server cap of 10 minutes, so a
        heartbeat cannot extend a claim past the claim's own bound.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holder_id]
              properties:
                holder_id: {type: string}
                lease_secs: {type: integer, minimum: 0}
      responses:
        "204": {description: Lease extended.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {description: Caller is not the current claim holder.}

  /api/v1/runs/{id}/heartbeat:
    parameters: [{$ref: "#/components/parameters/RunID"}]
    post:
      x-sparkwing-scope: nodes.claim
      tags: [runs]
      summary: Stamp the run's liveness clock.
      description: |
        Keeps the reaper from declaring the run lost while its nodes are
        between claims. The caller must hold a live claim on one of the
        run's nodes.
      responses:
        "204": {description: Heartbeat recorded. Empty body.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/runs/{id}/nodes/{nodeID}/status:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: runs.state
      tags: [nodes]
      summary: Override a node's status (debug / repair).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string}
      responses:
        "204": {description: Updated.}

  /api/v1/runs/{id}/nodes/{nodeID}/release:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: runs.write
      tags: [debug-pauses]
      summary: Release any active debug pause on the node.
      responses:
        "204": {description: Released or no-op.}

  /api/v1/runs/{id}/nodes/{nodeID}/bounce:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
      - {$ref: "#/components/parameters/NodeID"}
    post:
      x-sparkwing-scope: runs.write
      tags: [nodes]
      summary: Ask a running node to restart its process.
      description: |
        Records a bounce request against a running node of a live run and
        stamps the requesting principal. The runner picks it up on its next
        poll of the GET below.
      responses:
        "200":
          description: The recorded bounce request.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NodeBounce"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: "The node is not running, or the run is no longer live."}
        "500": {$ref: "#/components/responses/InternalError"}
    get:
      x-sparkwing-scope: nodes.claim
      tags: [nodes]
      summary: Poll for a bounce request the runner has not consumed.
      responses:
        "200":
          description: A bounce is pending.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NodeBounce"}
        "204": {description: No bounce pending. Empty body.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

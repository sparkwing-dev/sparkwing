      summary: Receive a delivery from the deployment's GitHub App.
      description: >-
        Verifies X-Hub-Signature-256 with the App's webhook secret (401 on mismatch) and requires X-GitHub-Delivery. Routes by the payload's installation id to the team holding it. `push` and `pull_request` start one run per subscribed pipeline, after GitHub confirms, asked on each delivery, that the installation still covers the repository; a pull request from a fork, a push of no commit, an event with no readable time, and an event older than the team's binding start nothing. `installation` deleted unbinds and suspend or unsuspend marks the binding; anything else is acknowledged with 202 and starts nothing. A delivery whose signed body was processed before, for any team, answers 200 with status `duplicate` and spends nothing. Each run spends one of the team's hourly runs: once the cap is reached the first run answers 429 with Retry-After, and a later run of the same delivery is listed with status `shed`. A redelivery lists the runs it already started as `duplicate` without spending, and spends only on the runs that were shed.
      security: []
      responses:
        "200": {description: "Ping answered, installation event applied, or a duplicate delivery answered with the runs it started (status duplicate)."}
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.githubAppWebhookResp
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [dispatched, ignored, duplicate]}
                  reason: {type: string}
                  runs:
                    type: array
                    items:
                      x-sparkwing-go-type: pkg/controller.githubAppRun
                      type: object
                      required: [pipeline, run_id, status]
                      properties:
                        pipeline: {type: string}
                        run_id: {type: string}
                        status: {type: string, enum: [dispatched, duplicate, shed]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {description: The team's hourly run cap is reached; Retry-After says when.}
        "502": {description: GitHub could not be reached to confirm the repository's installation.}
        "503": {description: The controller's queue is above its shed threshold; Retry-After says when.}

  /.well-known/jwks.json:
    get:
      x-sparkwing-scope: public
      summary: The OIDC issuer's public signing keys.
      description: >-
        The RS256 keys that verify the ID tokens this controller signs: the active key, then the previous one while a rotation is in progress. Each kid is the key's RFC 7638 thumbprint. Cacheable for one hour. See docs/oidc.md.
      responses:
        "200":
          description: The key set.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: internal/oidcissuer.JWKS
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      x-sparkwing-go-type: internal/oidcissuer.JWK
                      type: object
                      properties:
                        kty: {type: string}
                        kid: {type: string}
                        use: {type: string}
                        alg: {type: string}
                        n: {type: string}
                        e: {type: string}
        "404": {$ref: "#/components/responses/NotFound"}

  /.well-known/openid-configuration:
    get:
      x-sparkwing-scope: public
      summary: The OIDC issuer's discovery document.
      description: >-
        OpenID provider metadata for the issuer, which is the controller's external URL. Cloud providers read jwks_uri from it to verify run ID tokens. Answers 404 when the controller holds no OIDC signing key. Cacheable for one hour.
      responses:
        "200":
          description: The discovery document.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: internal/oidcissuer.Discovery
                type: object
                properties:
                  issuer: {type: string}
                  jwks_uri: {type: string}
                  response_types_supported: {type: array, items: {type: string}}
                  subject_types_supported: {type: array, items: {type: string}}
                  id_token_signing_alg_values_supported: {type: array, items: {type: string}}
                  claims_supported: {type: array, items: {type: string}}
                  scopes_supported: {type: array, items: {type: string}}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/runs/{id}/oidc-token:
    parameters:
      - {$ref: "#/components/parameters/RunID"}
    post:
      x-sparkwing-scope: nodes.claim or triggers.claim
      tags: [runs]
      summary: Sign an OIDC ID token for a run the caller holds a claim on.
      description: >-
        Returns an RS256 ID token whose sub is team:<team>:pipeline:<pipeline>:trigger:<trigger>:runner:<runner_kind>:ref:<ref>, for exchange with a cloud provider. Every claim but aud comes from the run's rows. A caller holding no live claim on the run gets 404, as does a controller with no signing key. A pipeline or branch holding ':', '*', '?' or whitespace answers 422. Each claim may mint 30 tokens per run, refilled over five minutes. See docs/oidc.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.OIDCTokenRequest
              type: object
              required: [audience]
              properties:
                audience: {type: string, maxLength: 256}
      responses:
        "200":
          description: The signed token.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.OIDCTokenResponse
                type: object
                properties:
                  token: {type: string}
                  expires_at: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {description: A run value cannot appear in the subject.}
        "429": {description: The claim spent its token budget for this run; see Retry-After.}

  /api/v1/signups:
    get:
      x-sparkwing-scope: admin
      tags: [users]
      summary: Read the sign-up gate and the sign-up counts alerting keys on.
      description: >-
        The gate decides whether a new user is admitted with a personal space or placed on the waitlist. Users that already exist are never gated.
      responses:
        "200":
          description: The gate.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.signUpStatusJSON
                type: object
                required: [state, reasons, mode, source, reason, set_by, updated_at, deployment_waitlist, free_tier, limits, counts, velocity_warning]
                properties:
                  state: {type: string, enum: [open, waitlist], description: What a new user meets now.}
                  reasons:
                    type: array
                    items: {type: string, enum: [deployment, operator, hourly_signups, daily_signups, free_tier_closed, free_tier_unreadable]}
                    description: Every condition holding the gate at waitlist; empty while it is open.
                  mode: {type: string, enum: [open, waitlist], description: The stored mode.}
                  source: {type: string, description: "What set the stored mode: `operator`, `hourly_signups`, `daily_signups`, or `default` when nothing has."}
                  reason: {type: string}
                  set_by: {type: string}
                  updated_at: {type: integer, format: int64, description: Unix seconds; the velocity windows start no earlier than this while the mode is open.}
                  deployment_waitlist: {type: boolean, description: True when the controller runs with `--signup-gate=waitlist`.}
                  free_tier: {type: string, enum: [open, throttled, closed, unreadable], description: "`unreadable` when the free-tier source failed, which waitlists new users as `closed` does."}
                  limits:
                    x-sparkwing-go-type: pkg/controller.signUpLimitsJSON
                    type: object
                    required: [hourly_limit, daily_limit, hourly_warn, github_min_account_days, free_team_members]
                    properties:
                      hourly_limit: {type: integer, description: "Admissions the last hour may hold before the gate closes itself, counting new users admitted and waitlisted users who accepted an invitation; 0 is off."}
                      daily_limit: {type: integer, description: The same bound over the last 24 hours; 0 is off.}
                      hourly_warn: {type: integer, description: Hourly count past which the controller warns; 0 is off.}
                      github_min_account_days: {type: integer, description: Youngest GitHub account a sign-up admits; 0 is off.}
                      free_team_members: {type: integer, description: Most members a team that has bought no credits may hold; 0 is off.}
                  counts:
                    x-sparkwing-go-type: pkg/controller.signUpCountsJSON
                    type: object
                    required: [last_hour, last_day, waitlisted]
                    properties:
                      last_hour: {type: integer}
                      last_day: {type: integer}
                      waitlisted: {type: integer}
                  velocity_warning: {type: boolean, description: True while the last hour's new users exceed `hourly_warn`.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      x-sparkwing-scope: admin
      tags: [users]
      summary: Set the sign-up gate's mode, its limits, or both.
      description: >-
        Fields left out keep their values. Setting the mode records the caller and the reason; setting it to `open` also restarts the hourly and daily windows, so a burst that closed the gate does not close it again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.signUpSetReq
              type: object
              properties:
                mode: {type: string, enum: [open, waitlist]}
                reason: {type: string}
                hourly_limit: {type: integer, minimum: 0}
                daily_limit: {type: integer, minimum: 0}
                hourly_warn: {type: integer, minimum: 0}
                github_min_account_days: {type: integer, minimum: 0}
                free_team_members: {type: integer, minimum: 0}
      responses:
        "200":
          description: The gate after the change.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.signUpStatusJSON
                type: object
                required: [state, reasons, mode, source, reason, set_by, updated_at, deployment_waitlist, free_tier, limits, counts, velocity_warning]
                properties:
                  state: {type: string, enum: [open, waitlist], description: What a new user meets now.}
                  reasons:
                    type: array
                    items: {type: string, enum: [deployment, operator, hourly_signups, daily_signups, free_tier_closed, free_tier_unreadable]}
                    description: Every condition holding the gate at waitlist; empty while it is open.
                  mode: {type: string, enum: [open, waitlist], description: The stored mode.}
                  source: {type: string, description: "What set the stored mode: `operator`, `hourly_signups`, `daily_signups`, or `default` when nothing has."}
                  reason: {type: string}
                  set_by: {type: string}
                  updated_at: {type: integer, format: int64, description: Unix seconds; the velocity windows start no earlier than this while the mode is open.}
                  deployment_waitlist: {type: boolean, description: True when the controller runs with `--signup-gate=waitlist`.}
                  free_tier: {type: string, enum: [open, throttled, closed, unreadable], description: "`unreadable` when the free-tier source failed, which waitlists new users as `closed` does."}
                  limits:
                    x-sparkwing-go-type: pkg/controller.signUpLimitsJSON
                    type: object
                    required: [hourly_limit, daily_limit, hourly_warn, github_min_account_days, free_team_members]
                    properties:
                      hourly_limit: {type: integer, description: "Admissions the last hour may hold before the gate closes itself, counting new users admitted and waitlisted users who accepted an invitation; 0 is off."}
                      daily_limit: {type: integer, description: The same bound over the last 24 hours; 0 is off.}
                      hourly_warn: {type: integer, description: Hourly count past which the controller warns; 0 is off.}
                      github_min_account_days: {type: integer, description: Youngest GitHub account a sign-up admits; 0 is off.}
                      free_team_members: {type: integer, description: Most members a team that has bought no credits may hold; 0 is off.}
                  counts:
                    x-sparkwing-go-type: pkg/controller.signUpCountsJSON
                    type: object
                    required: [last_hour, last_day, waitlisted]
                    properties:
                      last_hour: {type: integer}
                      last_day: {type: integer}
                      waitlisted: {type: integer}
                  velocity_warning: {type: boolean, description: True while the last hour's new users exceed `hourly_warn`.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}


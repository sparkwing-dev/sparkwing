  /internal/storage/reserve:
    post:
      x-sparkwing-scope: public
      tags: [storage]
      summary: Reserve room in a team's cache or log store before a write.
      description: |
        The cache calls it with its operator token for any team; the logs
        service forwards the appending caller's credential, which must be
        allowed to write logs and names only its own team's `logs` store. A free
        team is held to its share of the allowance, three quarters for the
        cache and three sixteenths for logs, counting what it stores and
        every reservation still held; a funded team is counted without a
        limit. `up_to` grants as much of `bytes` as the team has room for,
        zero or less asking for all of it. A reservation expires after an
        hour unless it is committed or released.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              x-sparkwing-go-type: pkg/controller.storageReserveReq
              required: [team, store, bytes]
              properties:
                team: {type: string}
                store: {type: string, enum: [cache, logs]}
                bytes: {type: integer, format: int64}
                up_to: {type: boolean}
      responses:
        "200":
          description: The reservation. A single-team controller answers funded with no id.
          content:
            application/json:
              schema:
                type: object
                x-sparkwing-go-type: pkg/store.StorageReservation
                properties:
                  reservation: {type: string}
                  tier: {type: string, enum: [funded, free]}
                  granted_bytes: {type: integer, format: int64}
                  unlimited: {type: boolean}
                  expires_at: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "402": {description: The team has neither credits nor a free-tier slot.}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {description: The write would pass the team's free share of this store.}

  /internal/storage/commit:
    post:
      x-sparkwing-scope: public
      tags: [storage]
      summary: Count what a write stored and drop its reservation.
      description: |
        `bytes` is what the write added to the store: its size, or for an
        overwrite the difference from what it replaced, which may be
        negative. A reservation that already expired, or that is not the
        named team's, drops nothing and the bytes still count. Callers are
        authorized as for the reserve route. `next_bytes` above zero also
        reserves up to that many bytes more in the same transaction and
        answers the new reservation, for a writer that draws many small
        writes from one block; the commit lands even when the next block is
        refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              x-sparkwing-go-type: pkg/controller.storageCommitReq
              required: [team, store, bytes]
              properties:
                team: {type: string}
                store: {type: string, enum: [cache, logs]}
                reservation: {type: string}
                bytes: {type: integer, format: int64}
                next_bytes: {type: integer, format: int64}
      responses:
        "200":
          description: Counted, and the next block when `next_bytes` asked for one.
          content:
            application/json:
              schema:
                type: object
                x-sparkwing-go-type: pkg/store.StorageReservation
                properties:
                  reservation: {type: string}
                  tier: {type: string, enum: [funded, free]}
                  granted_bytes: {type: integer, format: int64}
                  unlimited: {type: boolean}
                  expires_at: {type: string, format: date-time}
        "204": {description: Counted.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "402": {description: "The next block was refused: the team has neither credits nor a free-tier slot. The commit landed."}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {description: "The next block was refused: the team's share is spent. The commit landed."}

  /internal/storage/release:
    post:
      x-sparkwing-scope: public
      tags: [storage]
      summary: Give back a reservation whose write stored nothing.
      description: A reservation already committed, released or expired is not an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              x-sparkwing-go-type: pkg/controller.storageReleaseReq
              required: [team, reservation]
              properties:
                team: {type: string}
                reservation: {type: string}
      responses:
        "204": {description: Released.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /internal/downloads/charge:
    post:
      x-sparkwing-scope: public
      tags: [storage]
      summary: Charge a download to its team's UTC day.
      description: |
        Only the cache's operator token reaches it. A download whose size is
        known is charged whole before its first byte and refused when it
        would pass the team's daily cap, `--team-daily-download-free-bytes`
        or `--team-daily-download-funded-bytes` by whether the team pays.
        Zero `bytes` checks that room is left. `record` charges a finished
        stream whatever the cap says. The operator's team has no cap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              x-sparkwing-go-type: pkg/controller.downloadChargeReq
              required: [team, bytes]
              properties:
                team: {type: string}
                bytes: {type: integer, format: int64}
                record: {type: boolean}
      responses:
        "200":
          description: The team's day after the charge.
          content:
            application/json:
              schema:
                type: object
                x-sparkwing-go-type: pkg/store.DownloadCharged
                properties:
                  tier: {type: string, enum: [funded, free]}
                  day_bytes: {type: integer, format: int64}
                  cap_bytes: {type: integer, format: int64, description: The cap the charge was held to; zero is none.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {description: "The team's day is spent; Retry-After names the seconds until midnight UTC."}

  /internal/egress/totals:
    post:
      x-sparkwing-scope: public
      tags: [storage]
      summary: Keep a service's day and month egress totals.
      description: |
        Only the cache's operator token reaches it. Each stored total keeps
        the larger of itself and what the call reports, and the answer is
        the stored totals, so a restarted cache reports zeros to read back
        where its day and month stood.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EgressTotals"
      responses:
        "200":
          description: The stored totals.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EgressTotals"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/team/billing:
    get:
      x-sparkwing-scope: runs.read
      tags: [teams]
      summary: Read the active team's balance, prices, recent usage and grants.
      description: >-
        Any member of the active team reads it. One credit is one vCPU-second and `credits_per_dollar` of them make a dollar; amounts are micro-credits, `micro_per_credit` to the credit. `usage` is the team's runner spend grouped by run, newest first, with reservations, usage and refunds netted; `grants` are its purchases, operator grants and refund reversals, newest first; each holds at most 50 rows. `checkout_enabled` reports whether this controller sells credits, and `can_purchase` whether the caller, an owner, may buy them.
      responses:
        "200":
          description: Team billing.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.teamBillingJSON
                type: object
                required: [team, balance_micro, balance_cap_micro, frozen, micro_per_credit, credits_per_dollar, min_billable_seconds, purchase_min_cents, purchase_max_cents, rate_table, storage_rate_micro_per_gb_day, storage_free_allowance_bytes, storage_charged_micro, checkout_enabled, can_purchase, usage, grants]
                properties:
                  team: {type: string}
                  balance_micro: {type: integer, format: int64}
                  balance_cap_micro: {type: integer, format: int64, description: The most a team's balance may hold.}
                  frozen: {type: boolean, description: "True while the team's cloud usage is held over a payment dispute; its metered claims are refused."}
                  micro_per_credit: {type: integer, format: int64}
                  credits_per_dollar: {type: integer, format: int64}
                  min_billable_seconds: {type: integer, format: int64, description: The least one node or trigger step is billed for.}
                  purchase_min_cents: {type: integer, format: int64}
                  purchase_max_cents: {type: integer, format: int64}
                  rate_table:
                    type: array
                    items:
                      x-sparkwing-go-type: pkg/controller.creditRateJSON
                      type: object
                      required: [cores, micro_per_second]
                      properties:
                        cores: {type: integer, format: int64}
                        micro_per_second: {type: integer, format: int64}
                  storage_rate_micro_per_gb_day: {type: integer, format: int64, description: "Zero when retained storage is not billed."}
                  storage_free_allowance_bytes: {type: integer, format: int64}
                  storage_charged_micro: {type: integer, format: int64}
                  checkout_enabled: {type: boolean}
                  can_purchase: {type: boolean}
                  usage:
                    type: array
                    items:
                      x-sparkwing-go-type: pkg/controller.teamBillingUsageJSON
                      type: object
                      required: [run_id, seconds, amount_micro, last_charged_at]
                      properties:
                        run_id: {type: string}
                        seconds: {type: integer, format: int64}
                        amount_micro: {type: integer, format: int64}
                        last_charged_at: {type: integer, format: int64, description: Unix seconds.}
                  grants:
                    type: array
                    items:
                      x-sparkwing-go-type: pkg/controller.teamBillingGrantJSON
                      type: object
                      required: [id, kind, amount_micro, created_at]
                      properties:
                        id: {type: string}
                        kind: {type: string, enum: [free, paid, reversal]}
                        amount_micro: {type: integer, format: int64}
                        reference: {type: string}
                        created_at: {type: integer, format: int64, description: Unix seconds.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/team/billing/checkout:
    post:
      x-sparkwing-scope: team.admin
      tags: [teams]
      summary: Open a Stripe Checkout page to buy credits for the active team.
      description: >-
        An owner of the active team buys between `purchase_min_cents` and `purchase_max_cents`. The team is the caller's active team and the body cannot name one. The controller asks its checkout service to open the session and answers with the page to send the owner to; the credits land when Stripe confirms the payment. A purchase is refused before any session opens when the balance, plus the team's checkouts still open, plus this purchase would pass `balance_cap_micro`; an opened checkout counts until it is paid or its session expires. Purchases are final and credits never expire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-sparkwing-go-type: pkg/controller.teamCheckoutReq
              type: object
              required: [amount_cents]
              properties:
                amount_cents: {type: integer, format: int64}
      responses:
        "200":
          description: The Stripe Checkout page.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.teamCheckoutJSON
                type: object
                required: [url]
                properties:
                  url: {type: string}
        "400": {description: "The amount is outside the purchase range (`amount_out_of_range`) or the body is malformed."}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: >-
            The purchase, with the checkouts still open, would lift the balance above the cap (`balance_cap`, the body below). A team whose deletion has begun also answers 409, with only `error`.
          content:
            application/json:
              schema:
                x-sparkwing-go-type: pkg/controller.balanceCapRefusalJSON
                type: object
                required: [error, code, balance_micro, open_micro, cap_micro, amount_micro]
                properties:
                  error: {type: string}
                  code: {type: string, enum: [balance_cap]}
                  balance_micro: {type: integer, format: int64}
                  open_micro: {type: integer, format: int64, description: What the team's open checkouts may still add.}
                  cap_micro: {type: integer, format: int64}
                  amount_micro: {type: integer, format: int64}
        "502": {description: The checkout service or Stripe did not open a session.}
        "503": {description: "This controller sells no credits (`checkout_unavailable`)."}

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <token>` with a `sw*_`-prefixed token
        issued by `POST /api/v1/tokens`. The token's scopes (e.g.
        `runs.read`, `nodes.claim`, `admin`) gate per-route access.
    sessionAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        `Authorization: Session <session-id>`. Used only by the
        dashboard's browser flow after `POST /api/v1/auth/login`.
  parameters:
    RunID:
      in: path
      name: id
      required: true
      schema: {type: string}
      description: Run id (e.g. `run-20260519-150405-a1b2`).
    NodeID:
      in: path
      name: nodeID
      required: true
      schema: {type: string}
    TriggerID:
      in: path
      name: id
      required: true
      schema: {type: string}
    PipelineName:
      in: path
      name: name
      required: true
      schema: {type: string}
      description: Pipeline name as declared in `.sparkwing/sparkwing.yaml`.
    ConcurrencyKey:
      in: path
      name: key
      required: true
      schema: {type: string}
      description: Concurrency group key, global across the deployment.
    GitcacheRepo:
      in: query
      name: repo
      required: true
      schema: {type: string}
      description: |
        Clone URL. Validated before proxying: a local path, a loopback or
        private address, and a URL carrying embedded credentials are all
        refused.
  responses:
    BadRequest:
      description: Invalid request (missing field, malformed JSON).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AuthError"}
    Forbidden:
      description: Token does not carry the scope this route requires.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AuthError"}
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InternalError:
      description: Unhandled server error.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    GitCredential:
      x-sparkwing-go-type: pkg/controller.GitCredentialJSON
      type: object
      required: [host, kind, confirmed, created_by, created_at, updated_at]
      properties:
        host: {type: string}
        kind: {type: string, enum: [ssh, https]}
        username: {type: string, description: "The https username."}
        fingerprint: {type: string, description: "SHA256 fingerprint of the ssh host key the credential pins."}
        host_key: {type: string, description: "The known_hosts entry the credential pins."}
        public_key: {type: string, description: "The deploy key's public half, returned when the key is stored, to add to the forge."}
        confirmed: {type: boolean, description: "An owner confirmed the pinned host key; https credentials are confirmed when stored."}
        created_by: {type: string, description: User id of the owner who stored it.}
        created_at: {type: integer, format: int64, description: Unix seconds.}
        updated_at: {type: integer, format: int64, description: Unix seconds.}
    GitHubAppInstallation:
      x-sparkwing-go-type: pkg/controller.githubAppInstallationJSON
      type: object
      required: [installation_id, account_id, account_login, account_type, suspended, connected_by, created_at, updated_at, manage_url]
      properties:
        installation_id: {type: integer, format: int64}
        account_id: {type: integer, format: int64}
        account_login: {type: string}
        account_type: {type: string, enum: [User, Organization]}
        suspended: {type: boolean, description: GitHub suspended the installation; it starts no runs and mints no tokens.}
        connected_by: {type: string, description: User id of the owner who connected it.}
        created_at: {type: integer, format: int64, description: Unix seconds.}
        updated_at: {type: integer, format: int64, description: Unix seconds.}
        manage_url: {type: string, description: The GitHub page where the account's owner changes the repositories it covers or uninstalls it.}
    GitHubAppTrigger:
      x-sparkwing-go-type: pkg/controller.githubAppTriggerJSON
      type: object
      required: [repository, repository_id, installation_id, pipeline, push, pull_request, created_by, created_at]
      properties:
        repository: {type: string, description: owner/name as GitHub spells it.}
        repository_id: {type: integer, format: int64}
        installation_id: {type: integer, format: int64}
        pipeline: {type: string}
        push: {type: boolean}
        pull_request: {type: boolean}
        created_by: {type: string}
        created_at: {type: integer, format: int64, description: Unix seconds.}
    GitHubAppExtraRepos:
      x-sparkwing-go-type: pkg/controller.githubAppExtraReposJSON
      type: object
      required: [repository, extra_repos]
      properties:
        repository: {type: string, description: The source repository, owner/name.: ''}
        extra_repos:
          type: array
          maxItems: 10
          items: {type: string}

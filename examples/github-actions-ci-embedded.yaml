# Example GitHub Actions workflow that runs a sparkwing pipeline in
# ci-embedded mode. State, cache, and logs go to S3 so a dashboard
# elsewhere can follow or replay the run.
#
# Setup:
# 1. Add AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY repository secrets
#    with permissions to PUT/GET/DELETE on the bucket.
# 2. Declare the CI profile. `--profile NAME` resolves only against
#    ~/.config/sparkwing/profiles.yaml, which a fresh CI runner does
#    not have, so commit the profile to .sparkwing/sparkwing.yaml and
#    point defaults.profile at it:
#
#      profiles:
#        ci-team:
#          state: { type: s3, bucket: my-team-sparkwing, prefix: state/ }
#          cache: { type: s3, bucket: my-team-sparkwing, prefix: cache/ }
#          logs:  { type: s3, bucket: my-team-sparkwing, prefix: logs/  }
#      defaults:
#        profile: ci-team
#
#    (To keep profiles in their own file and select with --profile,
#    point SPARKWING_PROFILES at it in the job env.)
#
#    A profile is selected by the pipeline's own `profile:` field or
#    the project's `defaults.profile` (or `--profile NAME` against
#    ~/.config/sparkwing/profiles.yaml). Sparkwing never auto-selects
#    a profile from the CI environment.
# 3. Make sure your repo has a .sparkwing/ directory with the
#    pipeline you want to run (e.g. release-prod).

name: ci-embedded
on:
  push:
    branches: [main]
  pull_request:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install sparkwing CLI
        run: curl -fsSL https://sparkwing.dev/install.sh | bash

      - name: Run release pipeline
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-west-2
          # Skip sparks resolution at run time -- trust the committed
          # .resolved.mod overlay. Refresh by running
          # `sparkwing pipeline sparks update` locally and committing
          # the diff; the publish step picks up the new versions on
          # next push.
          SPARKWING_NO_SPARKS_RESOLVE: "1"
        # State, cache, and logs come from the profile named by
        # defaults.profile in .sparkwing/sparkwing.yaml. --profile reads
        # only ~/.config/sparkwing/profiles.yaml; on a CI runner point
        # SPARKWING_PROFILES at a committed file if you want to use it.
        run: sparkwing run release-prod --sw-mode=ci-embedded --sw-workers=4
